<style>
:root{--bg:#0b0f19;--card:#151b2b;--line:#242c42;--tx:#eef1f8;--mut:#8b95ae;--blue:#2f6df6;--orange:#f08a1c;--green:#19a85a;--purple:#7048e8;--red:#e5484d;--chip:#1e2540;--r:18px;--g:12px}
html.light{--bg:#f3f5fa;--card:#ffffff;--line:#d9deea;--tx:#18203a;--mut:#5d6882;--chip:#e7ecf8}
html{font-size:16px}html.fs-large{font-size:19px}html.fs-xl{font-size:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) var(--g) 6px;gap:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.who b{font-size:1.2rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .loc{display:block;font-size:.8rem;color:var(--mut);font-weight:normal;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;flex:0 0 46px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.back{font-size:1.6rem;padding:4px 10px;cursor:pointer}
.flags{display:flex;gap:4px;flex:0 0 auto}.flags span{font-size:1.05rem;padding:5px 8px;border-radius:10px;background:var(--card);opacity:.5;cursor:pointer;border:1px solid var(--line)}.flags .on{background:var(--blue);opacity:1;border-color:var(--blue)}
.body{flex:1;padding:6px var(--g) 24px;display:flex;flex-direction:column;gap:var(--g)}
.tabs{display:flex;gap:8px}.tabs span{flex:1;text-align:center;font-size:1rem;padding:12px 8px;border-radius:14px;background:var(--card);color:var(--mut);cursor:pointer;border:1px solid var(--line)}.tabs .on{background:var(--blue);color:#fff;font-weight:bold;border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tap{cursor:pointer}.card.cur{border:2px solid var(--blue)}
.card h4{margin:0 0 6px;font-size:1.15rem}.card p{margin:3px 0;font-size:.95rem;color:var(--mut)}
.tag{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:10px;margin:8px 6px 0 0}
.t-new{background:#1e3a5f;color:#8dbcff}.t-prog{background:#4a3410;color:#fbbf24}.t-est{background:#3a1f5c;color:#c4a5ff}.t-late{background:#4a1519;color:#ff8d92}

.btn{min-height:74px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:12px;font-size:1.35rem;font-weight:bold;color:#fff;cursor:pointer;user-select:none;text-align:center;padding:8px 12px;border:0;width:100%;font-family:inherit}
.btn i{font-style:normal;font-size:1.8rem}.btn small{font-size:.8rem;font-weight:normal;background:rgba(0,0,0,.28);padding:2px 9px;border-radius:10px}
.btn:active{transform:scale(.98);opacity:.9}
.steps{display:flex;gap:8px;margin:2px 0 4px}.steps span{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:bold;font-size:.85rem;opacity:.5}.steps span.on{opacity:1;border-color:#3b82f6;color:#3b82f6}.steps span.dn{opacity:.85}
#sigPad{width:100%;height:210px;background:#fff;border-radius:14px;border:2px dashed #94a3b8;touch-action:none;display:block}
.hint{font-size:.9rem;text-align:center;opacity:.75;margin:6px 0}
.blue{background:var(--blue)}.orange{background:var(--orange)}.green{background:var(--green)}.purple{background:var(--purple)}.gray{background:var(--chip);color:var(--tx)}.red{background:var(--red)}
.chips{display:flex;gap:8px}.chip{flex:1;text-align:center;font-size:1rem;padding:13px 8px;border-radius:14px;background:var(--chip);color:var(--tx);text-decoration:none;cursor:pointer;border:0;font-family:inherit}
.chip.on{background:var(--blue);color:#fff;font-weight:bold}
.txt{font-size:1.02rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.txt small{display:block;color:#8dbcff;font-size:.8rem;margin-top:8px;cursor:pointer;white-space:normal}
html.light .txt small{color:#1c4fb5}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{width:58px;height:58px;border-radius:12px;border:1px solid var(--line);position:relative;background:var(--chip)}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.thumbs div:after{content:"✔";position:absolute;right:-5px;top:-7px;background:var(--green);color:#fff;border-radius:50%;width:19px;height:19px;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.thumbs div.wait:after{content:"⏳";background:var(--orange)}
textarea,input{font-family:inherit;font-size:1rem;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
textarea{resize:none;min-height:86px}
.mut{color:var(--mut);font-size:.85rem}.center{text-align:center}
.sp{flex:1}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:6px}
.bar{padding:8px var(--g);text-align:center;font-size:.85rem;background:#4a3410;color:#fbbf24}
html.light .bar{background:#ffecc7;color:#8a5a00}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:#111827;color:#fff;padding:12px 18px;border-radius:14px;font-size:.95rem;z-index:50;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:1.25rem;text-align:center}
.login{padding:30px 20px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.login h1{margin:0 0 4px;text-align:center;font-size:1.6rem}
.err{color:#ff8d92;font-size:.95rem;text-align:center}
.stat{display:flex;gap:8px}.stat div{flex:1;text-align:center;background:var(--chip);border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:1.6rem}.stat span{font-size:.8rem;color:var(--mut)}
.sec{font-size:.85rem;color:var(--mut);margin:6px 4px 0}
.hide{display:none!important}
</style>

};
const LOCALE = { en: 'en-US', es: 'es-US', ar: 'ar-EG-u-nu-latn' };
const FLAG = { ar: '🇪🇬', en: '🇺🇸', es: '🇪🇸' };
function tr(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

/* ---------------- state ---------------- */

let tasks = [];

function applyLook() {
    document.documentElement.className = (LS.get('wk_theme') === 'light' ? 'light ' : '') + (LS.get('wk_fs') === 'large' ? 'fs-large' : (LS.get('wk_fs') === 'xl' ? 'fs-xl' : ''));

function fmtTime(s) {
    if (!s) return '';
    var m = /^(\d{1,2}):(\d{2})/.exec(s); if (!m) return s;

    applyLook();

function loginHtml() {

function taskSort(a, b) { return ((a.date || '0000') + (a.time || '')).localeCompare((b.date || '0000') + (b.time || '')); }

}
function cardHtml(x, today) {
    var late = x.date && x.date < today;
    var when = (x.date && x.date !== today ? fmtDate(x.date) + ' · ' : '') + fmtTime(x.time);
    var snippet = instrText(x); if (snippet.length > 110) snippet = snippet.slice(0, 107) + '…';
    var tags = '';
    if (x.kind === 'appt') tags += '<span class="tag t-est">🔎 ' + tr('estimateTag') + '</span>';
    if (x.status === 'arrived') tags += '<span class="tag t-prog">' + tr('inProgress') + '</span>'; else tags += '<span class="tag t-new">' + tr('newTag') + '</span>';
    if (late) tags += '<span class="tag t-late">⚠️ ' + tr('late') + '</span>';
    return '<div class="card tap" data-id="' + esc(x.id) + '" onclick="openTask(this.dataset.id)"><h4>' + esc(x.clientName || '—') + '</h4>' +
        (when ? '<p>🕘 ' + esc(when) + '</p>' : '') + (x.address ? '<p>📍 ' + esc(x.address) + '</p>' : '') +
        (snippet ? '<p>🔧 ' + esc(snippet) + '</p>' : '') + tags + '</div>';
}
function instrText(x) {
    var i = x.instr || {};
    return (i[lang] || i.en || x.instrOrig || '');
}
function mapUrl(addr) {
    var q = encodeURIComponent(addr);
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return ios ? 'https://maps.apple.com/?q=' + q : 'https://www.google.com/maps/search/?api=1&query=' + q;
}
function telHref(p) { return 'tel:' + String(p || '').replace(/[^+\d]/g, ''); }
function jobHtml() {
    var x = tasks.filter(function (z) { return z.id === view.id; })[0];
    if (!x) { view = { name: 'list', tab: view.tab || 'today', id: null }; return listHtml(); }
    var instrTr = instrText(x), orig = x.instrOrig || '';
    var hasBoth = orig && instrTr && orig.trim() !== instrTr.trim();
    var showO = !!showOrig[x.id];
    var textShown = (showO && orig) ? orig : (instrTr || orig);
    var h = bannerHtml() + '<div class="hd"><div class="who" onclick="goBack()"><span class="back">' + (lang === 'ar' ? '→' : '←') + '</span><b>' + esc(x.clientName || '') + '<span class="loc">📍 ' + esc(me ? me.region : '') + (x.arrivedAt ? ' · ✔ ' + tr('arrivedAt') + ' ' + esc(fmtClock(x.arrivedAt)) : '') + '</span></b></div>' + langBar() + '</div><div class="body">';
    var when = (x.date ? fmtDate(x.date) + ' · ' : '') + fmtTime(x.time);
    h += '<div class="card">' + (when ? '<p>🕘 ' + esc(when) + '</p>' : '') + (x.address ? '<p>📍 ' + esc(x.address) + '</p>' : '');
    var chips = '';
    if (x.address) chips += '<a class="chip" href="' + esc(mapUrl(x.address)) + '" target="_blank" rel="noopener">' + tr('map') + '</a>';
    if (x.clientPhone) chips += '<a class="chip" href="' + esc(telHref(x.clientPhone)) + '">' + tr('callCustomer') + '</a>';
    if (chips) h += '<div class="chips" style="margin-top:10px">' + chips + '</div>';
    h += '</div>';
    if (textShown) h += '<div class="card txt">' + esc(textShown) + (hasBoth ? '<small onclick="toggleOrig(\'' + esc(x.id) + '\')">' + (showO ? tr('showTranslated') : tr('translated')) + '</small>' : '') + '</div>';
    if (x.status === 'new') {
        h += '<div class="sp"></div><div class="btn purple" onclick="markArrived(\'' + esc(x.id) + '\')"><i>📍</i>' + tr('arrived') + '</div>';
    } else {
        var noteHtml = '<textarea id="noteBox" placeholder="' + esc(tr('notePh')) + '" oninput="noteTyping(\'' + esc(x.id) + '\')" onblur="saveNote(\'' + esc(x.id) + '\')">' + esc(x.note || '') + '</textarea><div id="noteSaved" class="mut center" style="min-height:1.2em"></div>';
        var xid = esc(x.id);
        if (x.kind === 'appt') {
            h += photoBlock(x, 'estimate', tr('estimatePhotos'), 'blue') + noteHtml;
            h += '<div class="sp"></div><div class="btn green" onclick="askDone(\'' + xid + '\')"><i>✔</i>' + tr('done') + '</div>';
        } else {
            if (sigTask !== x.id) { sigTask = x.id; sigUrl = ''; sigName = ''; }
            var st = stepOf(x);
            h += '<div class="steps"><span class="' + (st === 1 ? 'on' : 'dn') + '">1 · ' + tr('before') + '</span><span class="' + (st === 2 ? 'on' : (st < 2 ? '' : 'dn')) + '">2 · ' + tr('after') + '</span><span class="' + (st === 3 ? 'on' : '') + '">3 · ' + tr('stepSign') + '</span></div>';
            if (st === 1) {
                var ok1 = (x.cnt_before || 0) > 0;
                h += photoBlock(x, 'before', tr('before'), 'blue') + noteHtml;
                h += ok1 ? '<div class="btn green" onclick="goStep(\'' + xid + '\',2)">' + tr('next') + ' ' + (lang === 'ar' ? '←' : '→') + '</div>' : '<div class="hint">' + tr('needPhoto') + '</div><div class="btn gray" style="opacity:.5" onclick="toast(tr(\'needPhoto\'))">' + tr('next') + ' ' + (lang === 'ar' ? '←' : '→') + '</div>';
            } else if (st === 2) {
                var ok2 = (x.cnt_after || 0) > 0;
                h += photoBlock(x, 'after', tr('after'), 'orange') + noteHtml;
                h += ok2 ? '<div class="btn green" onclick="goStep(\'' + xid + '\',3)">' + tr('next') + ' ' + (lang === 'ar' ? '←' : '→') + '</div>' : '<div class="hint">' + tr('needPhoto') + '</div><div class="btn gray" style="opacity:.5" onclick="toast(tr(\'needPhoto\'))">' + tr('next') + ' ' + (lang === 'ar' ? '←' : '→') + '</div>';
                h += '<div class="btn gray" style="min-height:50px;font-size:1rem;margin-top:8px" onclick="goStep(\'' + xid + '\',1)">' + (lang === 'ar' ? '→ ' : '← ') + tr('before') + '</div>';
            } else {
                h += '<div class="card center"><b style="font-size:1.15rem">' + tr('signTitle') + '</b><p style="margin:8px 0">' + tr('signText') + '</p></div>';
                h += '<div class="mut center" style="margin:4px 0">' + tr('signHere') + '</div><canvas id="sigPad"></canvas>';
                h += '<div class="btn gray" style="min-height:46px;font-size:.95rem;margin:8px 0" onclick="sigClear()">' + tr('signClear') + '</div>';
                h += '<input id="sigName" type="text" placeholder="' + esc(tr('custName')) + '" value="' + esc(sigName) + '" oninput="sigName=this.value" style="margin-bottom:10px">';
                h += '<div id="finBtn" class="btn ' + (sigUrl ? 'green' : 'gray') + '" style="' + (sigUrl ? '' : 'opacity:.5') + '" onclick="finishClick(\'' + xid + '\')"><i>✔</i>' + tr('done') + '</div>';
                h += '<div class="btn gray" style="min-height:50px;font-size:1rem;margin-top:10px" onclick="askDone(\'' + xid + '\',true)">' + tr('notAvail') + '</div>';
                h += '<div class="btn gray" style="min-height:46px;font-size:.95rem;margin-top:8px" onclick="goStep(\'' + xid + '\',2)">' + (lang === 'ar' ? '→ ' : '← ') + tr('after') + '</div>';
            }
        }
    }
    h += '</div>';
    return h;
}
function photoBlock(x, kind, label, color) {
    var n = x['cnt_' + kind] || 0;
    var th = (x.thumbs || []).filter(function (p) { return p.k === kind; });
    var pend = !!x._pending;
    var h = '<div class="btn ' + color + '" onclick="pickPhoto(\'' + esc(x.id) + '\',\'' + kind + '\')"><i>📷</i>' + label + (n ? '<small>' + n + ' ' + (pend ? '⏳' : '✔') + '</small>' : '') + '</div>';
    if (th.length) h += '<div class="thumbs">' + th.map(function (p) { return '<div class="' + (pend ? 'wait' : '') + '"><img src="' + esc(p.t) + '" alt=""></div>'; }).join('') + '</div>';
    return h;
}
function profileHtml() {
    var now = new Date(), today = isoDate(now);
    var mon = new Date(now); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    var som = new Date(now.getFullYear(), now.getMonth(), 1);
    var dn = tasks.filter(function (x) { return x.status === 'done' && x.doneAt; });
    var cDay = dn.filter(function (x) { return isoDate(new Date(x.doneAt)) === today; }).length;
    var cWeek = dn.filter(function (x) { return x.doneAt >= mon.getTime(); }).length;
    var cMonth = dn.filter(function (x) { return x.doneAt >= som.getTime(); }).length;
    var theme = LS.get('wk_theme') === 'light' ? 'light' : 'dark', fs = LS.get('wk_fs') || 'normal';
    var office = (me && me.officePhone) ? me.officePhone : '';
    var h = bannerHtml() + '<div class="hd"><div class="who" onclick="goBack()"><span class="back">' + (lang === 'ar' ? '→' : '←') + '</span><b>' + tr('profile') + '</b></div>' + langBar() + '</div><div class="body">';
    h += '<div class="card center" style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="transform:scale(1.7);margin:14px 0 8px">' + avatarHtml() + '</div><b style="font-size:1.3rem">' + esc(me ? me.tech : '') + '</b><span class="mut">📍 ' + esc(me && me.region ? me.region : '') + '</span></div>';
    h += '<div class="btn gray" style="min-height:56px;font-size:1.05rem" onclick="pickSelfie()">' + tr('changePhoto') + '</div>';
    h += '<div class="sec">' + tr('myWork') + '</div><div class="stat"><div><b>' + cDay + '</b><span>' + tr('todayWord') + '</span></div><div><b>' + cWeek + '</b><span>' + tr('thisWeek') + '</span></div><div><b>' + cMonth + '</b><span>' + tr('thisMonth') + '</span></div></div><div class="mut center">' + tr('jobsDone') + '</div>';
    h += '<div class="sec">' + tr('theme') + '</div><div class="chips"><span class="chip ' + (theme === 'dark' ? 'on' : '') + '" onclick="setTheme(\'dark\')">' + tr('dark') + '</span><span class="chip ' + (theme === 'light' ? 'on' : '') + '" onclick="setTheme(\'light\')">' + tr('light') + '</span></div>';
    h += '<div class="sec">' + tr('textSize') + '</div><div class="chips"><span class="chip ' + (fs === 'normal' ? 'on' : '') + '" onclick="setFs(\'normal\')">' + tr('normal') + '</span><span class="chip ' + (fs === 'large' ? 'on' : '') + '" onclick="setFs(\'large\')">' + tr('large') + '</span><span class="chip ' + (fs === 'xl' ? 'on' : '') + '" onclick="setFs(\'xl\')">' + tr('xl') + '</span></div>';
    if (office) h += '<a class="btn blue" style="text-decoration:none;min-height:64px;font-size:1.15rem;margin-top:6px" href="' + esc(telHref(office)) + '">' + tr('callOffice') + '</a>';
    h += '<div class="btn gray" style="min-height:56px;font-size:1.05rem" onclick="logout()">' + tr('logout') + '</div></div>';
    return h;
}

/* ---------------- navigation ---------------- */
function go(name, id) {
    view = { name: name, tab: view.tab || 'today', id: id || null };
    try { history.pushState({ v: name }, ''); } catch (e) {}
    render(); window.scrollTo(0, 0);
}
function goBack() { try { if (history.state && history.state.v) { history.back(); return; } } catch (e) {} view = { name: 'list', tab: view.tab || 'today', id: null }; render(); }
window.addEventListener('popstate', function () { if (view.name === 'job' || view.name === 'profile') { view = { name: 'list', tab: view.tab || 'today', id: null }; render(); } });
function setTab(t) { view.tab = t; render(); }
function openTask(id) { go('job', id); }
function goProfile() { go('profile'); }
function toggleOrig(id) { showOrig[id] = !showOrig[id]; render(); }
function setTheme(v) { LS.set('wk_theme', v); render(); }
function setFs(v) { LS.set('wk_fs', v); render(); }

/* ---------------- login / account ---------------- */
function doLogin() {
    var e = (document.getElementById('lgEmail').value || '').trim(), p = document.getElementById('lgPass').value || '';
    if (!e || !p) return;
    e = e.toLowerCase();
    LS.set('wk_email', e);
    loginError = '';
    auth.signInWithEmailAndPassword(e, p).catch(function () { loginError = tr('badLogin'); render(); });
}
function logout() { try { if (unsubTasks) unsubTasks(); if (unsubMe) unsubMe(); } catch (e) {} unsubTasks = null; unsubMe = null; me = null; tasks = []; auth.signOut(); }

auth.onAuthStateChanged(function (u) {
    if (!u) { view = { name: 'login', tab: 'today', id: null }; render(); return; }
    myEmail = (u.email || '').toLowerCase();
    view = { name: 'loading', tab: 'today', id: null }; render();
    try { if (unsubMe) unsubMe(); } catch (e) {}
    unsubMe = db.collection('workerAccounts').doc(myEmail).onSnapshot(function (doc) {
        if (!doc.exists || doc.data().active === false) { me = null; view = { name: 'noaccount', tab: 'today', id: null, why: !doc.exists ? 'no account for' : 'inactive' }; render(); return; }
        var first = !me;
        me = doc.data();
        if (first) {
            if (!LS.get('wk_lang') && me.lang && I18N[me.lang]) lang = me.lang;
            startTasks();
            if (view.name === 'loading' || view.name === 'noaccount') view = { name: 'list', tab: 'today', id: null };
        }
        render();
    }, function (err) { view = { name: 'noaccount', tab: 'today', id: null, why: (err && (err.code || err.message)) || 'error' }; render(); });
});

function startTasks() {
    try { if (unsubTasks) unsubTasks(); } catch (e) {}
    firstTasksLoad = true;
    unsubTasks = db.collection('workerTasks').where('workerEmail', '==', myEmail).onSnapshot({ includeMetadataChanges: true }, function (snap) {
        var anyPending = false, added = false;
        tasks = snap.docs.map(function (d) { var o = d.data(); o.id = d.id; o._pending = d.metadata.hasPendingWrites; if (o._pending) anyPending = true; return o; });
        if (!firstTasksLoad) snap.docChanges().forEach(function (c) { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites && !c.doc.metadata.fromCache) added = true; });
        pendingSync = anyPending;
        firstTasksLoad = false;
        if (added) { toast(tr('newJob')); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
        if (wantTask) { var w = tasks.filter(function (z) { return z.id === wantTask; })[0]; if (w) { wantTask = null; try { history.replaceState(null, '', location.pathname); } catch (e) {} view = { name: 'job', tab: 'today', id: w.id }; } }
        var ae = document.activeElement;
        if (view.name === 'job' && ae && (ae.id === 'noteBox' || ae.id === 'sigName')) return; // never wipe a note while it is being typed
        render();
    }, function () { toast(tr('sendErr')); });
}

/* ---------------- actions ---------------- */
function taskRef(id) { return db.collection('workerTasks').doc(id); }
function markArrived(id) {
    var x = tasks.filter(function (z) { return z.id === id; })[0]; if (!x || x.status !== 'new') return;
    taskRef(id).update({ status: 'arrived', arrivedAt: Date.now(), updatedAt: Date.now() }).catch(function () { toast(tr('sendErr')); });
}
var wkStep = {}, sigUrl = '', sigName = '', sigTask = '';
function stepOf(x) { if (wkStep[x.id]) return wkStep[x.id]; return (x.cnt_after || 0) > 0 ? 2 : 1; }
function goStep(id, n) { saveNote(id, true); wkStep[id] = n; render(); window.scrollTo(0, 0); }
function finishClick(id) { if (!sigUrl) { toast(tr('needSign')); return; } askDone(id); }
function initSig() {
    var c = document.getElementById('sigPad'); if (!c) return;
    var w = c.clientWidth || 300, h = c.clientHeight || 210; c.width = w; c.height = h;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111';
    if (sigUrl) { var im = new Image(); im.onload = function () { g.drawImage(im, 0, 0, w, h); }; im.src = sigUrl; }
    var drawing = false, lx = 0, ly = 0;
    function pos(e) { var r = c.getBoundingClientRect(); return [(e.clientX - r.left) * (w / r.width), (e.clientY - r.top) * (h / r.height)]; }
    c.addEventListener('pointerdown', function (e) { e.preventDefault(); drawing = true; var p = pos(e); lx = p[0]; ly = p[1]; g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx + 0.1, ly + 0.1); g.stroke(); try { c.setPointerCapture(e.pointerId); } catch (x) {} });
    c.addEventListener('pointermove', function (e) { if (!drawing) return; e.preventDefault(); var p = pos(e); g.beginPath(); g.moveTo(lx, ly); g.lineTo(p[0], p[1]); g.stroke(); lx = p[0]; ly = p[1]; });
    function up() { if (!drawing) return; drawing = false; sigUrl = c.toDataURL('image/jpeg', 0.7); updateFin(); }
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
}
function updateFin() { var b = document.getElementById('finBtn'); if (!b) return; b.className = 'btn ' + (sigUrl ? 'green' : 'gray'); b.style.opacity = sigUrl ? '' : '.5'; }
function sigClear() { sigUrl = ''; initSig(); updateFin(); }
function askDone(id, skip) {
    var m = document.createElement('div'); m.className = 'modal'; m.id = 'doneModal';
    m.innerHTML = '<div class="box"><h3>' + tr('confirmDone') + '</h3><div class="btn green" onclick="doDone(\'' + esc(id) + '\',' + (skip ? 'true' : 'false') + ')">' + tr('yes') + '</div><div class="btn gray" style="min-height:56px" onclick="document.getElementById(\'doneModal\').remove()">' + tr('no') + '</div></div>';
    document.body.appendChild(m);
}
function doDone(id, skip) {
    var m = document.getElementById('doneModal'); if (m) m.remove();
    saveNote(id, true);
    var x = tasks.filter(function (z) { return z.id === id; })[0] || {};
    var upd = { status: 'done', doneAt: Date.now(), updatedAt: Date.now() };
    var batch = db.batch();
    if (x.kind !== 'appt') {
        if (skip || !sigUrl) upd.signSkipped = true;
        else {
            upd.signed = true; upd.signName = (sigName || '').trim();
            batch.set(db.collection('workerPhotos').doc('s' + Date.now() + Math.random().toString(36).slice(2, 6)), { taskId: id, kind: 'signature', data: sigUrl, ts: Date.now(), by: myEmail, tech: me ? me.tech : '', signName: upd.signName });
        }
    }
    batch.update(taskRef(id), upd);
    batch.commit().catch(function () { toast(tr('sendErr')); });
    sigUrl = ''; sigName = ''; sigTask = ''; delete wkStep[id];
    view = { name: 'list', tab: view.tab || 'today', id: null };
    try { if (history.state && history.state.v) history.back(); } catch (e) {}
    render();
}
function noteTyping(id) { clearTimeout(noteTimer); noteTimer = setTimeout(function () { saveNote(id); }, 1200); }
function saveNote(id, silent) {
    clearTimeout(noteTimer);
    var box = document.getElementById('noteBox'); if (!box) return;
    var x = tasks.filter(function (z) { return z.id === id; })[0]; if (!x) return;
    var v = box.value.trim();
    if (v === (x.note || '').trim()) return;
    taskRef(id).update({ note: v, noteLang: lang, noteAt: Date.now(), noteTr: FV.delete(), updatedAt: Date.now() }).then(function () {
        var s = document.getElementById('noteSaved'); if (s && !silent) s.textContent = tr('saved');
    }).catch(function () { toast(tr('sendErr')); });
}

/* ---------------- photos ---------------- */
let photoCtx = null;
function pickPhoto(id, kind) { photoCtx = { id: id, kind: kind }; var f = document.getElementById('fileCam'); f.value = ''; f.click(); }
function pickSelfie() { var f = document.getElementById('fileSelfie'); f.value = ''; f.click(); }
function compress(file, maxDim, q) {
    return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () {
            var img = new Image();
            img.onload = function () {
                var w = img.width, h = img.height, s = Math.min(1, maxDim / Math.max(w, h));
                w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
                var c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(c.toDataURL('image/jpeg', q));
            };
            img.onerror = reject; img.src = fr.result;
        };
        fr.onerror = reject; fr.readAsDataURL(file);
    });
}
document.getElementById('fileCam').addEventListener('change', async function (ev) {
    var files = Array.prototype.slice.call(ev.target.files || []); if (!files.length || !photoCtx) return;
    var ctx = photoCtx;
    for (var i = 0; i < files.length; i++) {
        try {
            var data = await compress(files[i], 1280, 0.7);
            if (data.length > 700000) data = await compress(files[i], 1024, 0.55);
            var thumb = await compress(files[i], 96, 0.6);
            var pid = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
            var b = db.batch();
            b.set(db.collection('workerPhotos').doc(pid), { taskId: ctx.id, kind: ctx.kind, data: data, ts: Date.now(), by: myEmail, tech: me ? me.tech : '' });
            var upd = { updatedAt: Date.now(), thumbs: FV.arrayUnion({ id: pid, k: ctx.kind, t: thumb }) };
            upd['cnt_' + ctx.kind] = FV.increment(1);
            b.update(taskRef(ctx.id), upd);
            b.commit().catch(function () { toast(tr('photoErr')); });
        } catch (e) { toast(tr('photoErr')); }
    }
});
document.getElementById('fileSelfie').addEventListener('change', async function (ev) {
    var f = (ev.target.files || [])[0]; if (!f) return;
    try {
        var p = await compress(f, 160, 0.7);
        db.collection('workerAccounts').doc(myEmail).update({ photo: p }).catch(function () { toast(tr('photoErr')); });
    } catch (e) { toast(tr('photoErr')); }
});

document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && (e.target.id === 'lgPass' || e.target.id === 'lgEmail')) doLogin(); });
window.addEventListener('online', render);
window.addEventListener('offline', render);
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('worker-sw.js').catch(function () {}); }); }
applyLook();
render();
</script>
