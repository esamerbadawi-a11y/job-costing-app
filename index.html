    function addTechnician(name = '', days = 1, paid = 0, type = 'نسبة مخصصة', rate = 0, customPercent = 50) {
        technicians.push({ name, days, paid, type, rate, customPercent });
        renderTechnicians();
        calculate();
    }
    function removeTechnician(index) { technicians.splice(index, 1); renderTechnicians(); calculate(); }

    function getPercentBase() {
        const received = parseVal(document.getElementById('amountReceived').value);
        const material = parseVal(document.getElementById('materialCost').value);
        return received - material;
    }

    function setTechPeriod(preset) {
        const fromEl = document.getElementById('techPeriodFrom'), toEl = document.getElementById('techPeriodTo');
        if (preset === 'clear') { fromEl.value = ''; toEl.value = ''; }
        else { const w = weekOf(isoDate(new Date()), preset === 'week' ? 0 : -1); fromEl.value = w.start; toEl.value = w.end; }
        renderTechnicians();
    }

    // Everything the money-status box needs for one technician: his due (this job, and across all his jobs),
    // what he's been paid, and what's left — all for whichever period is picked above (or all-time if none).
    function techMoneyStatus(tech, jobId) {
        const dateFrom = document.getElementById('techPeriodFrom').value;
        const dateTo = document.getElementById('techPeriodTo').value;
        const stats = techStatsWithLiveJob(dateFrom, dateTo);
        const s = stats[tech.name];
        const jobsForName = s ? s.jobs : [];
        const thisJobEntry = jobsForName.find(j => j.job.id === jobId);
        const paidAllJobs = techPaymentsInPeriod(tech.name, dateFrom, dateTo).reduce((sum, p) => sum + parseVal(p.amount), 0);
        const dueAllJobs = s ? s.dues : 0;
        return {
            hasPeriod: !!(dateFrom || dateTo), dateFrom, dateTo,
            dueThisJob: thisJobEntry ? thisJobEntry.dues : 0,
            dueAllJobs, paidAllJobs, remainingAllJobs: round2(dueAllJobs - paidAllJobs),
            jobsCount: jobsForName.length, detail: thisJobEntry
        };
    }

    // ---------- Fixed/daily/hourly pay: split his flat day rate across the jobs he worked that day ----------
    // The days he's actually scheduled for on THIS job (from the Weekly Board) — tapping one
    // fills the date for you, so you never have to remember or type it by hand.
    function techScheduledDatesFor(techName) {
        const jobId = document.getElementById('editingJobId').value;
        const job = jobId ? savedJobs.find(j => j.id === jobId) : null;
        if (!job || !techName) return [];
        return [...new Set(getScheduleEntries(job).filter(e => (e.team || []).includes(techName)).map(e => e.date))].sort();
    }
    function pickTechDailyDate(index, date) {
        const dateEl = document.getElementById(`da-date-${index}`);
        if (!dateEl) return;
        dateEl.value = date;
        const amtEl = document.getElementById(`da-amt-${index}`);
        if (amtEl) { amtEl.focus(); amtEl.select(); }
    }

    // How much of his (schedule-based) due has been assigned to specific days so far — same idea,
    // and same wording pattern, as the weeks summary above.
    function techDailySummaryHtml(tech, dues) {
        const entries = tech.dailyAlloc || [];
        if (entries.length === 0) return '';
        const alloc = round2(entries.reduce((s, e) => s + parseVal(e.amount), 0));
        const diff = round2(dues - alloc);
        let txt = t('twSummary').replace('{a}', ltrAmt(alloc)).replace('{b}', ltrAmt(dues));
        if (diff > 0.005) txt += ' — ' + t('twRemainder').replace('{c}', ltrAmt(diff));
        else if (diff < -0.005) txt += ' — ⚠️ ' + t('twOver').replace('{c}', ltrAmt(Math.abs(diff)));
        return txt;
    }

    // Part of the technician's own row now (not a collapsed extra) — this is the field he uses for
    // every daily/fixed/hourly technician, every week: pick a day he actually worked (from the Weekly
    // Board) or type one, type what that day is worth, and it's taken straight off what's due to him.
    function techDailyPanelHtml(tech, index, dues) {
        if (isPercentType(tech.type)) return '';   // percentage pay already follows the period's own money
        const entries = (tech.dailyAlloc || []).slice().sort((a, b) => a.date.localeCompare(b.date));
        const rows = entries.map(e => `<div class="ledger-row"><input type="date" value="${escHtml(e.date)}" onchange="setTechDailyDate(${index}, '${jsArg(e.id)}', this.value)"><strong style="color:#a78bfa;">${ltrAmt(e.amount)}</strong>${e.note ? `<span class="ledger-note">${escHtml(e.note)}</span>` : '<span class="ledger-note"></span>'}<button type="button" class="ledger-del" onclick="removeTechDaily(${index}, '${jsArg(e.id)}')">🗑</button></div>`).join('');
        const scheduledDates = techScheduledDatesFor(tech.name);
        const allocatedDates = new Set(entries.map(e => e.date));
        const chipsHtml = scheduledDates.length > 0 ? `
            <div class="chip-row" style="margin-bottom:8px;">
                ${scheduledDates.map(d => `<button type="button" class="secondary" style="${allocatedDates.has(d) ? 'opacity:0.55;' : ''}" onclick="pickTechDailyDate(${index}, '${jsArg(d)}')">📅 ${escHtml(d)}${allocatedDates.has(d) ? ' ✓' : ''}</button>`).join('')}
            </div>` : `<div class="ag-meta" style="margin-bottom:8px;">${t('dailyQuickPickNone')}</div>`;
        return `<div style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-color);">
            <div style="display:flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:700; color:var(--text-muted); margin-bottom:8px;">${t('dailyAllocTitle')} <button type="button" onclick="alert(t('dailyAllocHelp'));" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; padding:0 2px;">❓</button></div>
            ${chipsHtml}
            <div style="display:grid; grid-template-columns: 1fr 1fr 40px; gap:10px; align-items:end;">
                <div><label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('dailyDateColLabel')}</label><input type="date" id="da-date-${index}" value="${isoDate(new Date())}" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%;"></div>
                <div><label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('dailyAmountColLabel')}</label><input type="text" inputmode="decimal" id="da-amt-${index}" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTechDaily(${index});}" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%; text-align: center;"></div>
                <button type="button" class="ledger-plus" onclick="addTechDaily(${index})" style="align-self:end;">+</button>
            </div>
            ${rows ? `<div style="margin-top:8px;">${rows}</div>` : ''}
            <div class="daily-summary ag-meta" style="margin-top:6px;">${techDailySummaryHtml(tech, dues)}</div>
        </div>`;
    }
    function addTechDaily(index) {
        const tech = technicians[index];
        if (!tech) return;
        const date = document.getElementById(`da-date-${index}`).value;
        const amt = round2(parseVal(document.getElementById(`da-amt-${index}`).value));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!date) { alert(t('alertPickDate')); return; }
        tech.dailyAlloc = tech.dailyAlloc || [];
        tech.dailyAlloc.push({ id: newLedgerId(), date, amount: amt, note: '' });
        renderTechnicians();
    }
    function removeTechDaily(index, id) {
        const tech = technicians[index];
        if (!tech) return;
        tech.dailyAlloc = (tech.dailyAlloc || []).filter(e => e.id !== id);
        renderTechnicians();
    }
    function setTechDailyDate(index, id, value) {
        const tech = technicians[index];
        if (!tech) return;
        const e = (tech.dailyAlloc || []).find(x => x.id === id);
        if (!e) return;
        e.date = value;
        renderTechnicians();
    }

    // The full "who owes what across every job" picture belongs in the Technicians Guide, not here —
    // showing it on a single job's screen made it look like this job's own number, which it never was.
    // This job screen keeps only what IS specific to it: a warning if this technician is booked on
    // another job the very same day (so his flat day rate doesn't quietly get counted twice).
    function techDueNoteHtml(periodMs) {
        if (!periodMs || !periodMs.detail || !periodMs.detail.isPercentPeriod) return '';
        const d = periodMs.detail;
        return `<div class="due-note ag-meta" style="margin-top:4px; color:#38bdf8;">${t('tmsMoneyBaseNote').replace('{recv}', ltrAmt(d.periodRecv)).replace('{mat}', ltrAmt(d.periodMat)).replace('{base}', ltrAmt(d.periodBase)).replace('{pct}', d.pct)}</div>`;
    }

    function techOverlapWarningHtml(tech, index) {
        if (!tech.name) return '';
        const jobId = document.getElementById('editingJobId').value || '__unsaved__';
        const overlaps = jobId !== '__unsaved__' ? techScheduleOverlaps(tech.name, jobId) : [];
        if (overlaps.length === 0) return '';
        return `<div class="ledger-warn" style="margin-top:12px;">⚠️ ${t('tmsOverlapWarn')}<br>` +
            overlaps.map(o => `📅 ${escHtml(o.date)} — ${escHtml(o.jobName)}` + (o.otherAmount > 0.005 ? ` (${ltrAmt(o.otherAmount)})` : ` (${t('tmsOverlapNoAmount')})`)).join('<br>') + `</div>`;
    }

    // The job's own bottom line for the picked period: money received minus materials minus every
    // technician's due, all scoped to that same period — separate from jobNet() (which is always the
    // whole job, all-time, and drives the 40/40/20 split).
    function jobPeriodNetHtml() {
        const dateFrom = document.getElementById('techPeriodFrom').value;
        const dateTo = document.getElementById('techPeriodTo').value;
        if (!dateFrom && !dateTo) return '';
        const snap = currentEditingJobSnapshot();
        const periodRecv = inRangeSum(snap.receipts, dateFrom, dateTo);
        const periodMat = inRangeSum(snap.materialEntries, dateFrom, dateTo);
        const stats = techStatsWithLiveJob(dateFrom, dateTo);
        let techDuesSum = 0;
        (snap.technicians || []).forEach(tech => {
            if (!tech.name) return;
            const s = stats[tech.name];
            const entry = s ? s.jobs.find(j => j.job.id === snap.id) : null;
            techDuesSum += entry ? entry.dues : 0;
        });
        const net = round2(periodRecv - periodMat - techDuesSum);
        return `<div class="ledger-box" style="margin-bottom:12px;">
            <div class="ledger-title">${t('jobPeriodNetTitle')}</div>
            <div class="ag-meta" style="margin-bottom:4px;">${t('tmsPeriodNote').replace('{range}', ltrRange(dateFrom || '…', dateTo || '…'))}</div>
            <div class="tms-row"><span>${t('jobPeriodRecv')}</span><strong style="color:#34d399;">${ltrAmt(periodRecv)}</strong></div>
            <div class="tms-row"><span>${t('jobPeriodMat')}</span><strong style="color:#f87171;">${ltrAmt(periodMat)}</strong></div>
            <div class="tms-row"><span>${t('jobPeriodTechDues')}</span><strong style="color:#fbbf24;">${ltrAmt(techDuesSum)}</strong></div>
            <div class="tms-row"><span>${t('jobPeriodNet')}</span><strong style="color:${net < 0 ? '#f87171' : '#38bdf8'};">${ltrAmt(net)}</strong></div>
        </div>`;
    }

    // What the "Due ($)" box on the job screen itself shows. For a fixed/daily/hourly technician this
    // is deliberately literal — rate × days as typed, live, with no schedule-based splitting — because
    // that splitting made sense for a WEEKLY REPORT (the Guide) but looked like broken arithmetic sitting
    // right under the Days field on the job's own screen. A manual override (a day-by-day amount, or a
    // typed week) still wins in full when one exists. Percentage technicians are unaffected: their pay
    // already follows the period's own received money by design, not the Days field.
    function techCardDisplayDue(tech, jobId) {
        if (isPercentType(tech.type)) {
            const ms = techMoneyStatus(tech, jobId);
            const reimb = ms.detail ? ms.detail.reimbSum : 0;
            return { wage: round2(ms.dueThisJob - reimb), reimb, periodMs: ms };
        }
        const dailyEntries = (tech.dailyAlloc || []).filter(e => e && e.date);
        const weekEntries = (tech.weeks || []).filter(w => w && w.weekStart);
        let wage;
        if (dailyEntries.length > 0) wage = round2(dailyEntries.reduce((s, e) => s + parseVal(e.amount), 0));
        else if (weekEntries.length > 0) wage = round2(weekEntries.reduce((s, w) => s + parseVal(w.amount), 0));
        else wage = calculateTechDues(tech);
        return { wage, reimb: techReimbTotal(tech), periodMs: null };
    }

    function renderTechnicians() {
        document.getElementById('jobPeriodNetBox').innerHTML = jobPeriodNetHtml();
        const container = document.getElementById('techniciansContainer');
        container.innerHTML = '';
        if (technicians.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">${t('noTechsAdded')}</div>`;
            return;
        }
        const registeredTechs = getUniqueRegisteredTechnicians();

        technicians.forEach((tech, index) => {
            if (!tech.type) { tech.type = 'نسبة مخصصة'; if (tech.customPercent === undefined) tech.customPercent = 50; }
            const dues = calculateTechDues(tech);
            const cardDue = tech.name ? techCardDisplayDue(tech, document.getElementById('editingJobId').value || '__unsaved__') : null;
            const periodMs = cardDue ? cardDue.periodMs : null;
            const periodReimb = cardDue ? cardDue.reimb : 0;
            const displayWage = cardDue ? cardDue.wage : dues;
            const isCustom = tech.type === 'نسبة مخصصة';

            const card = document.createElement('div');
            card.className = 'tech-card';
            card.id = `techcard-${index}`;

            let techOptionsHtml = `<option value="" disabled ${!tech.name ? 'selected' : ''}>${t('techSelectPlaceholder')}</option>`;
            registeredTechs.forEach(tName => { techOptionsHtml += `<option value="${tName}" ${tech.name === tName ? 'selected' : ''}>${tName}</option>`; });
            if (tech.name && !registeredTechs.includes(tech.name)) techOptionsHtml += `<option value="${tech.name}" selected>${tech.name}</option>`;

            const typeOptionsHtml = ['نسبة مخصصة','فني لوحده (%60)','نسبة (50%)','مبلغ ثابت','باليومية','بالساعة']
                .map(v => `<option value="${v}" ${tech.type === v ? 'selected' : ''}>${techTypeLabel(v)}</option>`).join('');

            card.innerHTML = `
                <div class="tg-row1" style="display: grid; grid-template-columns: 2.2fr ${isCustom ? '1.1fr 1.1fr' : '1.6fr'} 1fr 40px; gap: 10px; align-items: center; margin-bottom: 12px;">
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${t('lblTechName')}</label>
                        <select onchange="updateTechData(${index}, 'name', this.value)" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%; min-width: 140px;">${techOptionsHtml}</select>
                    </div>
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${t('lblPaymentMethod')}</label>
                        <select onchange="updateTechData(${index}, 'type', this.value)" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%;">${typeOptionsHtml}</select>
                    </div>
                    ${isCustom ? `<div><label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${t('lblPercent')}</label><input type="text" placeholder="50" value="${tech.customPercent !== undefined ? tech.customPercent : 50}" onfocus="this.select()" oninput="updateTechData(${index}, 'customPercent', this.value)" style="background: #11141d; color: #38bdf8; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%; text-align: center; font-weight:700;"></div>` : ''}
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${isCustom ? t('lblRateOrLimit') : t('lblRatePrice')}</label>
                        <input type="text" placeholder="0" value="${tech.rate !== undefined ? tech.rate : ''}" onfocus="this.select()" oninput="updateTechData(${index}, 'rate', this.value)" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: flex-end; height: 100%;">
                        <button type="button" onclick="removeTechnician(${index})" style="background: rgba(225, 29, 72, 0.15); color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.4); padding: 9px 0; border-radius: 8px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; align-items: center;">
                    <div><label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${t('lblDaysHours')}</label>
                        <div style="display:flex; gap:4px;">
                            <input type="text" placeholder="1" value="${tech.days !== undefined ? tech.days : 1}" onfocus="this.select()" oninput="updateTechData(${index}, 'days', this.value)" style="background: #11141d; color: #fff; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; width: 100%; text-align: center;">
                            ${tech.type === 'باليومية' ? `<button type="button" onclick="calculateDaysFromSchedule(${index})" title="${t('calcDaysFromScheduleBtn')}" style="background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius:8px; padding:0 10px; cursor:pointer; font-size:0.9rem;">📅</button>` : ''}
                        </div>
                    </div>
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">${t('lblDue')}</label>
                        <div class="tech-dues-display" style="background: #11141d; border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; text-align: center; font-size: 0.85rem; color: #38bdf8; font-weight: 700;">
                            ${techDuesLineHtml(displayWage, periodMs ? periodReimb : techReimbTotal(tech))}
                        </div>
                    </div>
                </div>
                ${techDueNoteHtml(periodMs)}
                ${techDailyPanelHtml(tech, index, dues)}
                <details class="tw-box" style="margin-top:12px;" ${((tech.weeks || []).length > 0 || (tech.materialReimbursements || []).length > 0) ? 'open' : ''}>
                    <summary style="cursor:pointer; font-size:0.78rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:6px;">⚙️ ${t('advancedOptionsTitle')} <button type="button" onclick="event.stopPropagation(); alert(t('advancedOptionsHelp'));" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; padding:0 2px;">❓</button></summary>
                    ${techWeeksPanelHtml(tech, index, dues)}
                    ${techReimbPanelHtml(tech, index)}
                </details>
                ${techOverlapWarningHtml(tech, index)}
            `;
            container.appendChild(card);
        });
    }

    // ---------- Weekly amounts typed on the job (per technician) ----------
    // A technician on a job may carry an optional list of weeks: [{weekStart: Monday, amount}].
    // When it exists the Guide uses EXACTLY these amounts per week: no splitting by schedule days, so the number can never drift.
    // THE week used by every "This Week" button: Monday to Sunday. offset: 0 = the week that contains dateStr, -1 = the one before, +1 = the next.
    function weekOf(dateStr, offset) { const mon = addDaysISO(mondayOf(dateStr), 7 * (offset || 0)); return { start: mon, end: addDaysISO(mon, 6) }; }
    function mondayOf(dateStr) { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDate(d); }
    function ltrAmt(v) { return `<span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$${parseVal(v).toFixed(2)}</span>`; }
    function ltrRange(a, b) { return `<span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">${escHtml(a)} → ${escHtml(b)}</span>`; }

    function techWeeksSummaryHtml(tech, dues) {
        const weeks = tech.weeks || [];
        if (weeks.length === 0) return '';
        const alloc = round2(weeks.reduce((s, w) => s + parseVal(w.amount), 0));
        const diff = round2(dues - alloc);
        let txt = t('twSummary').replace('{a}', ltrAmt(alloc)).replace('{b}', ltrAmt(dues));
        if (diff > 0.005) txt += ' — ' + t('twRemainder').replace('{c}', ltrAmt(diff));
        else if (diff < -0.005) txt += ' — ⚠️ ' + t('twOver').replace('{c}', ltrAmt(Math.abs(diff)));
        return txt;
    }

    function techWeeksPanelHtml(tech, index, dues) {
        const weeks = (tech.weeks || []).slice().sort((a, b) => a.weekStart.localeCompare(b.weekStart));
        const rows = weeks.map(w => `<div class="ledger-row"><span style="min-width:170px;">${ltrRange(w.weekStart, addDaysISO(w.weekStart, 6))}</span><strong style="color:#fbbf24;">${ltrAmt(w.amount)}</strong><button type="button" class="ledger-del" style="margin-inline-start:auto;" onclick="removeTechWeek(${index}, '${jsArg(w.weekStart)}')">🗑</button></div>`).join('');
        return `<details class="tw-box" ${weeks.length > 0 ? 'open' : ''} style="margin-top:12px;">
            <summary style="cursor:pointer; font-size:0.78rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:6px;">${t('twTitle')} <button type="button" onclick="event.stopPropagation(); alert(t('twHelp'));" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; padding:0 2px;">❓</button></summary>
            <div class="ag-meta" style="margin:6px 0;">${t('twHint')}</div>
            ${rows}
            <div class="ledger-add-row" style="margin-top:8px;">
                <div class="lg-field lg-date"><span>${t('twWeekOf')}</span><input type="date" id="tw-date-${index}" value="${isoDate(new Date())}"></div>
                <div class="lg-field lg-amt"><span>${t('lblAmountShort')}</span><input type="text" inputmode="decimal" id="tw-amt-${index}" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTechWeek(${index});}"></div>
                <button type="button" class="ledger-plus" onclick="addTechWeek(${index})">+</button>
            </div>
            <div class="tw-summary ag-meta" style="margin-top:6px;">${techWeeksSummaryHtml(tech, dues)}</div>
        </details>`;
    }

    function addTechWeek(index) {
        const tech = technicians[index];
        if (!tech) return;
        const date = document.getElementById(`tw-date-${index}`).value;
        const amt = round2(parseVal(document.getElementById(`tw-amt-${index}`).value));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!date) { alert(t('alertPickDate')); return; }
        const weekStart = mondayOf(date);
        tech.weeks = tech.weeks || [];
        const existing = tech.weeks.find(w => w.weekStart === weekStart);
        if (existing) existing.amount = amt; else tech.weeks.push({ weekStart, amount: amt });
        renderTechnicians();
    }
    function removeTechWeek(index, weekStart) {
        const tech = technicians[index];
        if (!tech) return;
        tech.weeks = (tech.weeks || []).filter(w => w.weekStart !== weekStart);
        renderTechnicians();
    }

    // ---------- Materials a technician bought with his own money, reimbursed through his pay ----------
    // Kept as its own dated list per technician (job.technicians[i].materialReimbursements), separate
    // from the job's own "Material Cost" field, so the two are never mixed up: one is money the COMPANY
    // spent on materials, the other is money a TECHNICIAN spent and is owed back on top of his wage.
    function techReimbTotal(tech) { return round2((tech.materialReimbursements || []).reduce((s, e) => s + parseVal(e.amount), 0)); }
    function techReimbEntriesInRange(tech, dateFrom, dateTo) {
        return (tech.materialReimbursements || []).filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo));
    }
    function techReimbSumInRange(tech, dateFrom, dateTo) { return round2(techReimbEntriesInRange(tech, dateFrom, dateTo).reduce((s, e) => s + parseVal(e.amount), 0)); }
    // The technician's full due on a job: his normal wage PLUS whatever he's owed back for materials he
    // bought himself. Used everywhere a job's technician cost needs to be complete (job list, popup,
    // exports, and the profit split) — NOT inside the wage formula itself, so one technician's personal
    // material purchase never changes what another technician earns on a percentage of the job.
    function calculateJobTechDuesWithReimbursement(tech, amountReceived, materialCost) {
        return round2(calculateJobTechDues(tech, amountReceived, materialCost) + techReimbTotal(tech));
    }
    // The distinct "$100 + $50 materials = $150" line shown on the technician's own card.
    function techDuesLineHtml(dues, reimb) {
        if (reimb <= 0.005) return `<span style="color:#fbbf24;">$${dues.toFixed(2)}</span>`;
        return `<span style="color:#fbbf24;">$${dues.toFixed(2)}</span> <span style="color:var(--text-muted);">+</span> ` +
               `<span style="color:#fb923c;">$${reimb.toFixed(2)} ${t('materialsShort')}</span> <span style="color:var(--text-muted);">=</span> ` +
               `<strong style="color:#34d399;">$${round2(dues + reimb).toFixed(2)}</strong>`;
    }
    function techReimbPanelHtml(tech, index) {
        const entries = (tech.materialReimbursements || []).slice().sort((a, b) => a.date.localeCompare(b.date));
        const rows = entries.map(e => `<div class="ledger-row"><input type="date" value="${escHtml(e.date)}" onchange="setTechReimbDate(${index}, '${jsArg(e.id)}', this.value)"><strong style="color:#fb923c;">${ltrAmt(e.amount)}</strong><span class="ledger-note">${escHtml(e.note)}</span><button type="button" class="ledger-del" onclick="removeTechReimb(${index}, '${jsArg(e.id)}')">🗑</button></div>`).join('');
        const total = techReimbTotal(tech);
        return `<details class="tw-box" ${entries.length > 0 ? 'open' : ''} style="margin-top:12px;">
            <summary style="cursor:pointer; font-size:0.78rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:6px;">${t('reimbTitle')} <button type="button" onclick="event.stopPropagation(); alert(t('reimbHelp'));" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem; padding:0 2px;">❓</button></summary>
            <div class="ag-meta" style="margin:6px 0;">${t('reimbHint')}</div>
            ${rows}
            <div class="ledger-add-row" style="margin-top:8px;">
                <div class="lg-field lg-date"><span>${t('lblReceiptDate')}</span><input type="date" id="reimb-date-${index}" value="${isoDate(new Date())}"></div>
                <div class="lg-field lg-amt"><span>${t('lblAmountShort')}</span><input type="text" inputmode="decimal" id="reimb-amt-${index}" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTechReimb(${index});}"></div>
                <div class="lg-field lg-note"><span>${t('lblNoteShort')}</span><input type="text" id="reimb-note-${index}" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTechReimb(${index});}"></div>
                <button type="button" class="ledger-plus" onclick="addTechReimb(${index})">+</button>
            </div>
            ${total > 0.005 ? `<div class="ag-meta" style="margin-top:6px; color:#fb923c; font-weight:700;">${t('reimbTotal')}: ${ltrAmt(total)}</div>` : ''}
        </details>`;
    }
    function addTechReimb(index) {
        const tech = technicians[index];
        if (!tech) return;
        const date = document.getElementById(`reimb-date-${index}`).value;
        const amt = round2(parseVal(document.getElementById(`reimb-amt-${index}`).value));
        const note = document.getElementById(`reimb-note-${index}`).value.trim();
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!date) { alert(t('alertPickDate')); return; }
        tech.materialReimbursements = tech.materialReimbursements || [];
        tech.materialReimbursements.push({ id: newLedgerId(), date, amount: amt, note });
        renderTechnicians();
    }
    function removeTechReimb(index, id) {
        const tech = technicians[index];
        if (!tech) return;
        tech.materialReimbursements = (tech.materialReimbursements || []).filter(e => e.id !== id);
        renderTechnicians();
    }
    function setTechReimbDate(index, id, value) {
        const tech = technicians[index];
        if (!tech) return;
        const e = (tech.materialReimbursements || []).find(x => x.id === id);
        if (!e) return;
        e.date = value;
        renderTechnicians();
    }

    function calculateTechDues(tech) {
        const rate = parseVal(tech.rate);
        const days = parseVal(tech.days);
        const base = getPercentBase();
        const customPercent = tech.customPercent !== undefined ? parseVal(tech.customPercent) : 50;

        if (tech.type === 'فني لوحده (%60)') return base > 0 ? base * 0.6 : 0;
        if (tech.type === 'نسبة (50%)') return base > 0 ? base * 0.5 : 0;
        if (tech.type === 'نسبة مخصصة') return base > 0 ? base * (customPercent / 100) : 0;
        if (tech.type === 'مبلغ ثابت') return rate;
        return rate * (days === 0 ? 0 : days);
    }

    function calculateJobTechDues(tech, amountReceived, materialCost) {
        const rate = parseVal(tech.rate);
        const days = parseVal(tech.days);
        const base = parseVal(amountReceived) - parseVal(materialCost);
        const customPercent = tech.customPercent !== undefined ? parseVal(tech.customPercent) : 50;

        if (tech.type === 'فني لوحده (%60)') return base > 0 ? base * 0.6 : 0;
        if (tech.type === 'نسبة (50%)') return base > 0 ? base * 0.5 : 0;
        if (tech.type === 'نسبة مخصصة') return base > 0 ? base * (customPercent / 100) : 0;
        if (tech.type === 'مبلغ ثابت') return rate;
        return rate * days;
    }

    // Counts how many of this job's scheduled days actually included this technician,
    // using the same day-by-day schedule shown on the Weekly Board — so daily-rate pay
    // matches the days they were really assigned, not a manually-guessed number.
    // Shows, for the job currently open in the form, exactly which dates each person
    // was scheduled to work — grouped by name, so "who worked which days" is a glance,
    // not a manual count through the Weekly Board.
    function renderJobScheduleSummary() {
        const card = document.getElementById('jobScheduleSummaryCard');
        const editingId = document.getElementById('editingJobId').value;
        if (!editingId) { card.style.display = 'none'; return; }
        const job = savedJobs.find(j => j.id === editingId);
        if (!job) { card.style.display = 'none'; return; }
        const entries = getScheduleEntries(job);
        if (entries.length === 0) { card.style.display = 'none'; return; }

        const byPerson = {};
        entries.forEach(entry => {
            (entry.team || []).forEach(name => {
                if (!byPerson[name]) byPerson[name] = [];
                byPerson[name].push(entry.date);
            });
        });

        let html;
        if (Object.keys(byPerson).length === 0) {
            html = `<div style="color:var(--text-muted);">${t('noTechsAdded')}</div>`;
        } else {
            html = Object.keys(byPerson).map(name => {
                const dates = byPerson[name].slice().sort().join(', ');
                return `<div style="margin-bottom:6px;"><strong style="color:#fbbf24;">${name}:</strong> ${dates}</div>`;
            }).join('');
        }
        document.getElementById('jobScheduleSummaryContent').innerHTML = html;
        card.style.display = 'block';
    }

    function calculateDaysFromSchedule(index) {
        const editingId = document.getElementById('editingJobId').value;
        if (!editingId) { alert(t('alertNoScheduleYet')); return; }
        const job = savedJobs.find(j => j.id === editingId);
        if (!job) { alert(t('alertNoScheduleYet')); return; }
        const techName = technicians[index].name;
        if (!techName) { alert(t('alertPickTechFirst')); return; }
        let myDates = getScheduleEntries(job).filter(e => (e.team || []).includes(techName)).map(e => e.date);
        if (myDates.length === 0) { alert(t('alertNoDaysFoundForTech')); return; }

        // For a job that runs across several weeks, counting every day at once means
        // waiting until the whole thing wraps up to pay anyone — this lets the days (and
        // so the pay) be settled one week at a time instead.
        const thisWeekOnly = confirm(t('confirmCountThisWeekOnly'));
        if (thisWeekOnly) {
            const thisWeek = weekOf(isoDate(new Date()));
            const weekStartStr = thisWeek.start, weekEndStr = thisWeek.end;
            myDates = myDates.filter(d => d >= weekStartStr && d <= weekEndStr);
            if (myDates.length === 0) { alert(t('alertNoDaysThisWeekForTech')); return; }
        }

        // Find any day also shared with another job for this same technician.
        const sharedInfo = myDates.map(date => {
            const otherJobs = savedJobs.filter(j2 => j2.id !== job.id &&
                getScheduleEntries(j2).some(e => e.date === date && (e.team || []).includes(techName)));
            return { date, otherJobs };
        }).filter(s => s.otherJobs.length > 0);

        // Only ask when it actually matters — a technician earns one daily rate per
        // calendar day, so a day shared with another job needs a decision either way.
        let loadFully = false;
        if (sharedInfo.length > 0) {
            loadFully = !confirm(t('confirmSplitSharedDay'));
        }

        let totalDays = 0;
        myDates.forEach(date => {
            const shared = sharedInfo.find(s => s.date === date);
            if (!shared) { totalDays += 1; return; }
            totalDays += loadFully ? 1 : (1 / (shared.otherJobs.length + 1));
        });

        updateTechData(index, 'days', parseFloat(totalDays.toFixed(2)));
        renderTechnicians();

        if (loadFully && sharedInfo.length > 0) {
            const otherNames = [...new Set(sharedInfo.flatMap(s => s.otherJobs.map(j2 => j2.clientName || '?')))];
            alert(t('remindAdjustOtherJob') + ' ' + otherNames.join(', '));
        }
    }

    function updateTechData(index, field, value) {
        if (field === 'type' && EXCLUSIVE_PERCENT_TYPES.includes(value)) {
            const conflict = technicians.some((t, i) => i !== index && EXCLUSIVE_PERCENT_TYPES.includes(t.type));
            if (conflict) { alert(t('alertPercentConflict')); renderTechnicians(); return; }
        }
        technicians[index][field] = value;
        if (field === 'type' || field === 'name') renderTechnicians();
        else updateTechCardDues(index);
    }

    function updateTechCardDues(index) {
        const tech = technicians[index];
        if (!tech) return;
        const dues = calculateTechDues(tech);
        const card = document.getElementById(`techcard-${index}`);
        if (!card) return;
        const cardDue = tech.name ? techCardDisplayDue(tech, document.getElementById('editingJobId').value || '__unsaved__') : null;
        const periodMs = cardDue ? cardDue.periodMs : null;
        const periodReimb = cardDue ? cardDue.reimb : 0;
        const displayWage = cardDue ? cardDue.wage : dues;
        const display = card.querySelector('.tech-dues-display');
        if (display) {
            display.innerHTML = techDuesLineHtml(displayWage, periodMs ? periodReimb : techReimbTotal(tech));
        }
        const existingNote = card.querySelector('.due-note');
        const freshNote = techDueNoteHtml(periodMs);
        if (existingNote && freshNote) existingNote.outerHTML = freshNote;
        else if (existingNote) existingNote.remove();
        else if (freshNote && display) display.insertAdjacentHTML('afterend', freshNote);
        const wsum = card.querySelector('.tw-summary');
        if (wsum) wsum.innerHTML = techWeeksSummaryHtml(tech, dues);
        const dsum = card.querySelector('.daily-summary');
        if (dsum) dsum.innerHTML = techDailySummaryHtml(tech, dues);
        const netBox = document.getElementById('jobPeriodNetBox');
        if (netBox) netBox.innerHTML = jobPeriodNetHtml();
    }

    function calculate() { technicians.forEach((t, i) => updateTechCardDues(i)); }

    // Adds a new materials purchase onto the running total instead of making the user
    // work out the sum by hand each time more materials are bought mid-job.
    // Asks for the Gemini API key once (via a simple native prompt — no file editing
    // needed) and remembers it on this device from then on.
    function getGeminiApiKey() {
        let key = null;
        try { key = localStorage.getItem('geminiApiKey'); } catch (e) {}
        if (!key) {
            const entered = prompt(t('promptEnterGeminiKey'));
            if (!entered) return null;
            key = entered.trim();
            try { localStorage.setItem('geminiApiKey', key); } catch (e) {}
        }
        return key;
    }
    function resetGeminiApiKey() {
        try { localStorage.removeItem('geminiApiKey'); } catch (e) {}
        cachedGenAIClient = null; cachedGenAIClientKey = null;
        alert(t('alertAiKeyReset'));
    }

    // The SDK module and client are fetched/built once and reused — re-importing the
    // whole package from the CDN on every single AI call was the main source of the
    // slowdown the user noticed.
    let cachedGenAIClient = null;
    let cachedGenAIClientKey = null;

    // Photos for the job/appointment currently open in the form — populated when
    // editing an existing record, cleared on a fresh form, and saved along with it.
    let currentJobPhotos = [];
    let currentApptPhotos = [];

    // Resizes/compresses an image client-side before it's stored — since there's no
    // Firebase Storage set up, photos live as base64 inside the record itself, so
    // keeping each one small (under ~150KB) matters for Firestore's document size limit.
    function compressImageToBase64(file, maxDim = 900, quality = 0.6) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                        else { width = Math.round(width * maxDim / height); height = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function renderPhotoGallery(photosArr, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        if (!photosArr || photosArr.length === 0) { container.innerHTML = ''; container.style.display = 'none'; return; }
        container.style.display = 'flex';
        container.innerHTML = photosArr.map((p, i) => `
            <div style="position:relative;">

    async function getGenAIClient(apiKey) {
        if (cachedGenAIClient && cachedGenAIClientKey === apiKey) return cachedGenAIClient;
        const { GoogleGenAI } = await import('https://esm.sh/@google/genai');
        cachedGenAIClient = new GoogleGenAI({ apiKey });
        cachedGenAIClientKey = apiKey;
        return cachedGenAIClient;
    }

    // Google's newer "Authorization Key" format (starts with "AQ.") is sent as a Bearer
    // token, not the old ?key= / x-goog-api-key style used by legacy "AIza..." keys.
    // Records a quick voice note and drops the transcript into Scope of Work, then
    // automatically runs it through the AI cleanup — handy while out on-site.
    // Crafts a polite, situation-appropriate payment reminder (tone shifts with how
    // overdue it is) and opens WhatsApp with it ready to send to the client.
    // ---------- AI calls: never hang silently ----------
    const GEMINI_MODEL = 'gemini-3.6-flash';
    let AI_TIMEOUT_MS = 45000;

    function withTimeout(promise, ms, stageKey) {
        let timer;
        const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(`[${t(stageKey)}] ${t('aiTimeoutMsg')}`)), ms); });
        return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }
    // One place that talks to the AI. If it fails or takes too long, the error says WHICH step (loading the library, or the model's answer).
    async function aiGenerate(apiKey, contents) {
        const fail = (e, stageKey) => { const m = (e && e.message) ? e.message : String(e); return new Error(m.startsWith('[') ? m : `[${t(stageKey)}] ${m}`); };
        let ai;
        try { ai = await withTimeout(getGenAIClient(apiKey), AI_TIMEOUT_MS, 'aiStageSdk'); } catch (e) { throw fail(e, 'aiStageSdk'); }
        let response;
        try { response = await withTimeout(ai.models.generateContent({ model: GEMINI_MODEL, contents }), AI_TIMEOUT_MS, 'aiStageModel'); } catch (e) { throw fail(e, 'aiStageModel'); }
        const text = response && response.text;
        if (!text) throw new Error(`[${t('aiStageModel')}] ${t('aiEmptyMsg')}`);
        return text.trim();
    }

    // ---------- AI payment reminder: a window that shows progress, the message (editable) and the send buttons ----------
    let aiReminderCtx = null;

    function buildReminderPrompt(job, rem, daysOverdue, lang) {
        const long = daysOverdue && daysOverdue > 14;
        if (lang === 'ar') return `اكتب رسالة تذكير بدفعة متأخرة، مهذبة ومختصرة (2-4 جمل)، للعميل ${job.clientName}، بخصوص شغلانة "${job.clientDescription || 'صيانة'}"، المبلغ المتبقي $${rem.toFixed(2)}${daysOverdue ? `، ومتأخر عن الموعد بـ ${daysOverdue} يوم` : ''}. النبرة تتناسب مع ${long ? 'تأخير طويل نسبيًا لكن لسه محترمة' : 'تذكير ودّي بسيط'}. من غير مقدمات زي "تفضل" أو عناوين، الرسالة بس.`;
        return `Write a polite, concise (2-4 sentence) payment reminder to client ${job.clientName}, regarding a "${job.clientDescription || 'service'}" job, outstanding balance $${rem.toFixed(2)}${daysOverdue ? `, ${daysOverdue} days past the follow-up date` : ''}. Tone should be ${long ? 'a bit firmer given the longer delay, but still respectful' : 'a gentle, friendly nudge'}. No preamble or headers, just the message.`;
    }
    // The same message without AI, so the reminder can always be sent.
    function buildFallbackReminder(job, rem, daysOverdue, lang) {
        const what = (job.clientDescription || '').split('\n')[0].slice(0, 80).trim();
        const amount = '$' + rem.toFixed(2);
        const long = daysOverdue && daysOverdue > 14;
        if (lang === 'ar') return `أهلاً، معاك AHA Handyman. تذكير ودّي بالمبلغ المتبقي ${amount}${what ? ' عن ' + what : ''}${daysOverdue ? `، وعدّى ${daysOverdue} يوم على موعد المتابعة` : ''}. ${long ? 'ياريت نرتب السداد في أقرب وقت.' : 'ياريت تبلغنا إمتى نقدر نستلمه.'} شكرًا لتعاونك.`;
        return `Hello, this is AHA Handyman. A friendly reminder about the remaining balance of ${amount}${what ? ' for ' + what : ''}${daysOverdue ? `, now ${daysOverdue} days past the follow-up date` : ''}. ${long ? 'Please arrange payment as soon as you can.' : 'Please let us know when we can expect it.'} Thank you!`;
    }

    function setAiReminderStatus(kind, text) {
        const el = document.getElementById('aiReminderStatus');
        el.textContent = text;
        el.style.borderColor = kind === 'error' ? 'var(--danger)' : (kind === 'ok' ? 'var(--success)' : 'var(--accent)');
    }
    function refreshAiReminderButtons(busy) {
        const has = !!document.getElementById('aiReminderText').value.trim();
        ['aiSendWaBtn', 'aiSendSmsBtn', 'aiCopyBtn'].forEach(id => { document.getElementById(id).disabled = busy || !has; });
        document.getElementById('aiRetryBtn').disabled = !!busy;
    }

    async function sendAiPaymentReminder(jobId) {
        const job = savedJobs.find(j => j.id === jobId);
        if (!job) return;
        const rem = jobRemaining(job);
        let daysOverdue = null;
        if (job.followUpDate) {
            const diff = Math.floor((new Date() - new Date(job.followUpDate + 'T00:00:00')) / 86400000);
            if (diff > 0) daysOverdue = diff;
        }
        aiReminderCtx = { job, rem, daysOverdue, apiKey: getGeminiApiKey(), run: 0, mode: 'ai' };
        document.getElementById('aiReminderLang').value = currentLang === 'ar' ? 'ar' : 'en';
        document.getElementById('aiReminderJob').textContent = `${job.clientName || ''} — $${rem.toFixed(2)}`;
        document.getElementById('aiReminderText').value = '';
        document.getElementById('aiReminderModal').style.display = 'flex';
        if (!aiReminderCtx.apiKey) { useTemplateReminder('aiNoKeyNote'); return; }   // no key: don't leave the user stuck
        await regenerateAiReminder();
    }

    async function regenerateAiReminder() {
        const c = aiReminderCtx;
        if (!c) return;
        if (!c.apiKey) { c.apiKey = getGeminiApiKey(); if (!c.apiKey) { useTemplateReminder('aiNoKeyNote'); return; } }
        c.mode = 'ai';
        const myRun = ++c.run;
        setAiReminderStatus('busy', t('aiWriting'));
        refreshAiReminderButtons(true);
        try {
            const text = await aiGenerate(c.apiKey, buildReminderPrompt(c.job, c.rem, c.daysOverdue, document.getElementById('aiReminderLang').value));
            if (myRun !== c.run || aiReminderCtx !== c) return;   // closed, or a newer request took over
            document.getElementById('aiReminderText').value = text;
            setAiReminderStatus('ok', t('aiReady'));
        } catch (err) {
            if (myRun !== c.run || aiReminderCtx !== c) return;
            const msg = (err && err.message) ? err.message : String(err);
            if (/401|403|UNAUTHENTICATED|PERMISSION|API key/i.test(msg)) { try { localStorage.removeItem('geminiApiKey'); } catch (e) {} c.apiKey = null; }
            setAiReminderStatus('error', t('alertAiFailed') + ' (' + msg + ')');
        }
        refreshAiReminderButtons(false);
    }

    function useTemplateReminder(noteKey) {
        const c = aiReminderCtx;
        if (!c) return;
        c.run++; c.mode = 'template';   // cancels any AI request still running
        document.getElementById('aiReminderText').value = buildFallbackReminder(c.job, c.rem, c.daysOverdue, document.getElementById('aiReminderLang').value);
        setAiReminderStatus('ok', t(noteKey));
        refreshAiReminderButtons(false);
    }
    function onAiReminderLangChange() {
        const c = aiReminderCtx;
        if (!c) return;
        if (c.mode === 'template') useTemplateReminder('aiTemplateNote'); else regenerateAiReminder();
    }

    // The buttons open WhatsApp / Messages directly from the tap, so the phone never blocks them as pop-ups.

    function sendAiReminder(kind) {

    function startVoiceScope(fieldId = 'clientDescription', btnId = 'voiceScopeBtn', aiBtnId = 'aiScopeBtn', instructionId = 'aiInstructionInput') {
        const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognitionApi) { alert(t('alertVoiceNotSupported')); return; }

        const speakArabic = confirm(t('confirmVoiceLangArabic')); // OK = Arabic, Cancel = English
        const recognition = new SpeechRecognitionApi();
        recognition.lang = speakArabic ? 'ar-EG' : 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const micBtn = document.getElementById(btnId);
        const originalLabel = micBtn.innerHTML;
        micBtn.disabled = true; micBtn.innerHTML = '🔴 ...';

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const field = document.getElementById(fieldId);
            field.value = (field.value.trim() ? field.value.trim() + ' ' : '') + transcript;
            improveScopeWithAI(fieldId, aiBtnId, instructionId);
        };
        recognition.onerror = (event) => { alert(t('alertVoiceError') + ' (' + event.error + ')'); };
        recognition.onend = () => { micBtn.disabled = false; micBtn.innerHTML = originalLabel; };
        recognition.start();
    }

    // Reads a photo, sends it to Gemini's vision-capable model, and appends what it

    async function analyzePhotoForScope(event, fieldId, btnId, galleryId) {
        const file = event.target.files && event.target.files[0];

                : "Look at this handyman/contracting job-site photo and write a short, clear bullet-point description of what work appears to be needed, based on what you see. No preamble.";

            if (/401|403|UNAUTHENTICATED|PERMISSION|API key/i.test(msg)) { try { localStorage.removeItem('geminiApiKey'); } catch (e) {} }
            alert(t('alertAiFailed') + ' (' + msg + ')');

            btn.disabled = false; btn.innerHTML = originalLabel;
        }

    // ---------- Dated ledgers: client payments + material invoices (per job) ----------
    // The job keeps its familiar TOTALS (amountReceived / materialCost) so every existing screen and
    // formula is untouched. On top of that each job now keeps dated entries. Whatever part of a total
    // has no entry yet is "undated" (all old data starts that way): it still counts in the totals,
    // but it can't be placed in any week until you give it a date.
    function ledgerArr(kind) { return kind === 'receipt' ? currentReceipts : currentMaterialEntries; }
    function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
    function ledgerSum(arr) { return round2((arr || []).reduce((s, e) => s + parseVal(e.amount), 0)); }
    // total - dated entries. Positive = still undated. Negative = the entries add up to more than the total (a mistake to fix).
    function undatedAmount(total, arr) { return round2(parseVal(total) - ledgerSum(arr)); }
    function newLedgerId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function escHtml(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // Local calendar date (never valueAsDate: it works in UTC and shows tomorrow's date on Florida evenings).
    function initLedgerDates() {
        ['receiptAddDate', 'materialInvoiceDate'].forEach(id => { const el = document.getElementById(id); if (el) el.value = isoDate(new Date()); });
    }

    function renderLedgers() { safeCall(() => renderLedger('receipt')); safeCall(() => renderLedger('material')); }

    function renderLedger(kind) {
        const cfg = LEDGERS[kind];
        const box = document.getElementById(cfg.boxId);
        if (!box) return;
        const entries = ledgerArr(kind).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const undated = undatedAmount(document.getElementById(cfg.totalId).value, entries);
        if (entries.length === 0 && Math.abs(undated) < 0.005) { box.innerHTML = ''; return; }

        let html = '<div class="ledger-box">';
        if (entries.length > 0) {
            html += `<div class="ledger-title">${t(cfg.titleKey)}</div>`;
            entries.forEach(e => {
                html += `<div class="ledger-row">
                    <input type="date" value="${escHtml(e.date)}" onchange="setLedgerEntryDate('${kind}', '${e.id}', this.value)">
                    <strong style="color:${cfg.color};">$${parseVal(e.amount).toFixed(2)}</strong>
                    <span class="ledger-note">${escHtml(e.note)}</span>
                    <button type="button" class="ledger-del" onclick="removeLedgerEntry('${kind}', '${e.id}')">🗑</button>
                </div>`;
            });
        }
        if (undated > 0.005) {
            html += `<div class="ledger-undated">
                <div>⚠️ ${t('undatedLabel')}: <strong dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$${undated.toFixed(2)}</strong></div>
                <div class="ledger-hint">${t(cfg.hintKey)}</div>
                <div class="ledger-add-row">
                    <div class="lg-field lg-amt"><span>${t('lblAmountShort')}</span><input type="text" id="undated_${kind}_amt" inputmode="decimal" value="${undated.toFixed(2)}" onfocus="this.select()"></div>
                    <div class="lg-field lg-date"><span>${t(cfg.dateLbl)}</span><input type="date" id="undated_${kind}_date"></div>
                    <button type="button" class="secondary" style="height:40px;" onclick="dateUndated('${kind}')">${t('dateItBtn')}</button>
                </div>
            </div>`;
        } else if (undated < -0.005) {
            html += `<div class="ledger-warn">⛔ ${t('datedExceedsTotal')} <span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$${Math.abs(undated).toFixed(2)}</span></div>`;
        }
        html += '</div>';
        box.innerHTML = html;
    }

    // Records a NEW amount: adds it to the job's total AND keeps it as a dated entry.
    function addLedgerEntry(kind) {
        const cfg = LEDGERS[kind];
        const amtEl = document.getElementById(cfg.amtId), dateEl = document.getElementById(cfg.dateId), noteEl = document.getElementById(cfg.noteId);
        const amt = round2(parseVal(amtEl.value));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!dateEl.value) { alert(t('alertPickDate')); return; }
        ledgerArr(kind).push({ id: newLedgerId(), date: dateEl.value, amount: amt, note: noteEl.value.trim() });
        const totalEl = document.getElementById(cfg.totalId);
        totalEl.value = round2(parseVal(totalEl.value) + amt).toFixed(2);
        amtEl.value = ''; noteEl.value = '';
        calculateRemaining(); calculate(); renderLedgers();
    }
    function addReceipt() { addLedgerEntry('receipt'); }
    function addToMaterialCost() { addLedgerEntry('material'); }

    // Deleting an entry also takes its amount out of the total (it was a mistaken entry).
    function removeLedgerEntry(kind, id) {
        const cfg = LEDGERS[kind];
        const arr = ledgerArr(kind);
        const idx = arr.findIndex(e => e.id === id);
        if (idx === -1) return;
        if (!confirm(t(cfg.delKey))) return;
        const totalEl = document.getElementById(cfg.totalId);
        totalEl.value = Math.max(0, round2(parseVal(totalEl.value) - parseVal(arr[idx].amount))).toFixed(2);
        arr.splice(idx, 1);
        calculateRemaining(); calculate(); renderLedgers();
    }

    function setLedgerEntryDate(kind, id, value) {
        const e = ledgerArr(kind).find(x => x.id === id);
        if (!e) return;
        e.date = value;
        renderLedger(kind);
    }

    // Gives a date to (part of) the OLD undated amount. The job's total does not change.
    function dateUndated(kind) {
        const cfg = LEDGERS[kind];
        const amt = round2(parseVal(document.getElementById(`undated_${kind}_amt`).value));
        const date = document.getElementById(`undated_${kind}_date`).value;
        const undated = undatedAmount(document.getElementById(cfg.totalId).value, ledgerArr(kind));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!date) { alert(t('alertPickDate')); return; }
        if (amt > undated + 0.005) { alert(t('alertExceedsUndated') + ` ($${undated.toFixed(2)})`); return; }
        ledgerArr(kind).push({ id: newLedgerId(), date, amount: amt, note: '' });
        renderLedger(kind);
    }

    function validateJobBeforeSave(jobData, techs, expenses) {
        const errors = [];
        if (parseVal(jobData.totalRevenue) < 0) errors.push(t('errNegRevenue'));
        if (parseVal(jobData.amountReceived) < 0) errors.push(t('errNegReceived'));
        if (parseVal(jobData.materialCost) < 0) errors.push(t('errNegMaterial'));
        if (undatedAmount(jobData.amountReceived, jobData.receipts) < -0.005) errors.push(t('errDatedReceiptsExceed'));
        if (undatedAmount(jobData.materialCost, jobData.materialEntries) < -0.005) errors.push(t('errDatedMaterialsExceed'));

        techs.forEach((tech, i) => {
            const label = `${t('errRowLabel')} ${i + 1} (${tech.name || t('techSelectPlaceholder')})`;
            if (parseVal(tech.rate) < 0) errors.push(`${t('errNegRate')} — ${label}`);
            if (parseVal(tech.days) < 0) errors.push(`${t('errNegDays')} — ${label}`);
            if (tech.type === 'نسبة مخصصة') {
                const p = parseVal(tech.customPercent);
                if (p < 0 || p > 100) errors.push(`${t('errPercentRange')} — ${label}`);
            }
        });

        expenses.forEach((exp, i) => {
            if (parseVal(exp.amount) < 0) errors.push(`${t('errNegExpense')} — ${t('errRowLabel')} ${i + 1} (${expenseCatLabel(exp.category)})`);
        });

        return errors;
    }

    async function saveJob() {
        const editingId = document.getElementById('editingJobId').value;
        const clientName = document.getElementById('clientName').value.trim();
        if (!clientName) { alert(t('alertClientNameRequired')); return; }

        const jobData = {
            id: editingId ? editingId : Date.now().toString() + Math.random().toString(36).substr(2, 5),
            clientName,
            clientPhone: document.getElementById('clientPhone').value.trim(),
            clientEmail: document.getElementById('clientEmail').value.trim(),
            jobStatus: document.getElementById('jobStatus').value,
            clientAddress: document.getElementById('clientAddress').value.trim(),
            clientDescription: document.getElementById('clientDescription').value.trim(),
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            scheduledTime: document.getElementById('scheduledTime').value,
            totalRevenue: parseVal(document.getElementById('totalRevenue').value),
            amountReceived: parseVal(document.getElementById('amountReceived').value),
            amountRemaining: parseVal(document.getElementById('amountRemaining').value),
            followUpDate: document.getElementById('followUpDate').value,
            materialCost: parseVal(document.getElementById('materialCost').value),
            extraExpenses: parseVal(document.getElementById('extraExpenses').value),
            expenseItems: JSON.parse(JSON.stringify(expenseItems)),
            technicians: JSON.parse(JSON.stringify(technicians)),
            photos: JSON.parse(JSON.stringify(currentJobPhotos)),
            receipts: JSON.parse(JSON.stringify(currentReceipts)),
            materialEntries: JSON.parse(JSON.stringify(currentMaterialEntries)),
            createdBy: currentUserEmail,
            lastEditedBy: currentUserEmail
        };

        const validationErrors = validateJobBeforeSave(jobData, technicians, expenseItems);
        if (validationErrors.length > 0) {
            alert(t('validationErrorsTitle') + '\n\n' + validationErrors.map(e => '• ' + e).join('\n'));
            return;
        }
        if (parseVal(jobData.amountReceived) > parseVal(jobData.totalRevenue) && parseVal(jobData.totalRevenue) > 0) {
            if (!confirm(t('confirmOverpayment'))) { showToast(t('saveCancelledMsg')); return; }
        }

        let oldJobSnapshot = null;
        if (editingId) {
            const index = savedJobs.findIndex(j => j.id === editingId);
            if (index !== -1) {
                oldJobSnapshot = JSON.parse(JSON.stringify(savedJobs[index]));
                jobData.createdBy = savedJobs[index].createdBy || currentUserEmail;
                if (savedJobs[index].assignedTeam !== undefined) jobData.assignedTeam = savedJobs[index].assignedTeam;
                if (savedJobs[index].dayOrder !== undefined) jobData.dayOrder = savedJobs[index].dayOrder;
                if (savedJobs[index].scheduledDate !== undefined) jobData.scheduledDate = savedJobs[index].scheduledDate;
                if (savedJobs[index].dailySchedule !== undefined) jobData.dailySchedule = savedJobs[index].dailySchedule;
                savedJobs[index] = jobData;
            }
        } else {
            savedJobs.unshift(jobData);
        }

        try {
            await saveSavedJobsData();
            logActivity(editingId ? 'edit' : 'add', clientName, buildJobChangeSummary(oldJobSnapshot, jobData));
        } catch (err) {
            alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')');
            return;
        }
        resetForm();
        refreshAllViews();
        if (jobOverlayOpen) { closeJobOverlay(); showToast(t('toastJobSaved')); }
    }

    function jobRemaining(job) { return parseVal(job.totalRevenue) - parseVal(job.amountReceived); }

    // A one-tap snapshot of everything financial about a single job — what's left to
    // collect from the client, and what's still owed to each technician on it.
    function showJobQuickDetails(jobId) {
        const job = savedJobs.find(j => j.id === jobId);
        if (!job) return;
        const { net, shareS, shareM, companyNet } = jobNet(job);
        const rem = jobRemaining(job);
        const expensesTotal = (job.expenseItems && job.expenseItems.length > 0)
            ? job.expenseItems.reduce((sum, e) => sum + parseVal(e.amount), 0)
            : parseVal(job.extraExpenses);

        let lines = [];
        lines.push(job.clientName || '');
        if (job.clientAddress) lines.push('📍 ' + job.clientAddress);
        lines.push('─────────────────');
        lines.push(t('qdScopeOfWork'));
        lines.push(job.clientDescription ? job.clientDescription : ('(' + t('qdNoScopeSet') + ')'));
        lines.push('─────────────────');
        lines.push(`${t('qdTotalRevenue')} $${parseVal(job.totalRevenue).toFixed(2)}`);
        lines.push(`${t('qdReceived')} $${parseVal(job.amountReceived).toFixed(2)}`);
        lines.push(`${t('qdRemainingFromClient')} $${rem.toFixed(2)}`);
        lines.push(`${t('thMaterials')} $${parseVal(job.materialCost).toFixed(2)}`);
        lines.push(`${t('thExpenses')} $${expensesTotal.toFixed(2)}`);
        lines.push('');
        lines.push(t('qdTechBreakdown'));
        if ((job.technicians || []).length === 0) {
            lines.push('  ' + t('noTechsAdded'));
        } else {
            job.technicians.forEach(tech => {
                const wage = calculateJobTechDues(tech, job.amountReceived, job.materialCost);
                const reimb = techReimbTotal(tech);
                lines.push(`  ${tech.name || '?'} — ${t('qdDues')} $${wage.toFixed(2)}` + (reimb > 0.005 ? ` + $${reimb.toFixed(2)} ${t('materialsShort')} = $${round2(wage + reimb).toFixed(2)}` : ''));
                (tech.weeks || []).slice().sort((a, b) => a.weekStart.localeCompare(b.weekStart)).forEach(w => lines.push(`      📆 ${w.weekStart} → ${addDaysISO(w.weekStart, 6)}: $${parseVal(w.amount).toFixed(2)}`));
                (tech.materialReimbursements || []).slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => lines.push(`      🧾 ${e.date}: $${parseVal(e.amount).toFixed(2)}${e.note ? ' - ' + e.note : ''}`));
            });
        }
        lines.push('');
        lines.push(`${t('thNet')} $${net.toFixed(2)}`);
        lines.push(`S: $${shareS.toFixed(2)}  |  M: $${shareM.toFixed(2)}  |  ${t('statShareCompany')}: $${companyNet.toFixed(2)}`);
        alert(lines.join('\n'));
    }

    // The 40/40/20 split happens on the profit BEFORE company operating expenses (gas, coffee,
    // rent, etc.) — those are the company's own overhead, so they come out of the company's 20%
    // share only. S and M's shares are never reduced by the company's spending.
    function jobNet(job) {
        let totalTechDues = 0;
        (job.technicians || []).forEach(tech => { totalTechDues += calculateJobTechDuesWithReimbursement(tech, job.amountReceived, job.materialCost); });
        const netForSplit = parseVal(job.amountReceived) - parseVal(job.materialCost) - totalTechDues;
        const shareS = netForSplit * 0.4;
        const shareM = netForSplit * 0.4;
        const expensesTotal = parseVal(job.extraExpenses);
        const companyGross = netForSplit * 0.2;
        const companyNet = companyGross - expensesTotal;
        const net = shareS + shareM + companyNet; // overall bottom line (= netForSplit - expensesTotal)
        return { totalTechDues, net, shareS, shareM, companyGross, companyNet, expensesTotal };
    }

    function getSortValue(job, field) {
        if (field === 'startDate') return job.startDate || '';
        if (field === 'totalRevenue') return parseVal(job.totalRevenue);
        if (field === 'remaining') return jobRemaining(job);
        if (field === 'net') return jobNet(job).net;
        if (field === 'shareS') return jobNet(job).shareS;
        if (field === 'shareM') return jobNet(job).shareM;
        if (field === 'companyNet') return jobNet(job).companyNet;

    // Runs a view-refresh function in isolation: if one refresh step throws, it must not
    // block the others (this was the actual bug — one failing step was silently skipping
    // every refresh call listed after it, so some cards never updated).
    function safeCall(fn) { try { fn(); } catch (e) { console.error(e); } }

    // Formats a Date as YYYY-MM-DD using LOCAL calendar fields — never use toISOString()
    // for this, since it converts to UTC first and can silently shift the date by a day
    // depending on the device's timezone.
    function isoDate(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    function refreshGuideIfOpen() { if (document.getElementById('techGuideModal').style.display === 'flex') safeCall(renderTechGuideContent); }

    function refreshAllViews() {
        safeCall(renderJobsTable);
        safeCall(updateGlobalStats);
        safeCall(updateTechDropdownFilter);
        safeCall(updateSelectedStats);
        safeCall(renderTodayJobsBanner);
        if (document.getElementById('agendaModal').style.display === 'flex') safeCall(renderAgendaContent);
        refreshGuideIfOpen();
        if (document.getElementById('screenWeekly').style.display !== 'none') safeCall(renderWeeklyBoard);
    }

    function updateGlobalStats() {
        let totalJobsVal = 0, totalMatVal = 0, totalTechVal = 0, totalNetVal = 0, totalShareS = 0, totalShareM = 0, totalShareCompany = 0, totalExtraExp = 0, totalReceivedVal = 0;
        getFilteredJobs().forEach(job => {
            const { totalTechDues, net, shareS, shareM, companyNet } = jobNet(job);
            totalJobsVal += parseVal(job.totalRevenue); totalMatVal += parseVal(job.materialCost); totalTechVal += totalTechDues;
            totalNetVal += net; totalExtraExp += parseVal(job.extraExpenses);
            totalShareS += shareS; totalShareM += shareM; totalShareCompany += companyNet;
            totalReceivedVal += parseVal(job.amountReceived);
        });

        // General (non-job) company expenses logged within the same active date range,
        // so "what's actually left" reflects the whole picture for that period.
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        let generalExpensesInRange = 0;
        companyExpenses.forEach(e => {
            const d = e.date || '';
            if ((!dateFrom || (d && d >= dateFrom)) && (!dateTo || (d && d <= dateTo))) generalExpensesInRange += parseVal(e.amount);
        });
        // Same definition as the "Selected Jobs" card (received - materials - tech dues - job expenses),
        // plus the company's general (non-job) expenses that fall inside the active date range.
        const actualRemaining = totalReceivedVal - totalMatVal - totalTechVal - totalExtraExp - generalExpensesInRange;

        document.getElementById('statTotalJobs').innerText = '$' + totalJobsVal.toFixed(2);
        document.getElementById('statTotalMat').innerText = '$' + totalMatVal.toFixed(2);
        document.getElementById('statTotalTech').innerText = '$' + totalTechVal.toFixed(2);
        document.getElementById('statTotalNet').innerText = '$' + totalNetVal.toFixed(2);
        document.getElementById('statShareS').innerText = '$' + totalShareS.toFixed(2);
        document.getElementById('statShareM').innerText = '$' + totalShareM.toFixed(2);
        document.getElementById('statShareCompany').innerText = '$' + totalShareCompany.toFixed(2);
        document.getElementById('statExtraExp').innerText = '$' + totalExtraExp.toFixed(2);
        document.getElementById('statTotalReceived').innerText = '$' + totalReceivedVal.toFixed(2);
        document.getElementById('statActualRemaining').innerText = '$' + actualRemaining.toFixed(2);

        document.getElementById('statCompactNet').innerText = '$' + totalNetVal.toFixed(2);
        document.getElementById('statCompactRevenue').innerText = '$' + totalJobsVal.toFixed(2);
        document.getElementById('statCompactCompany').innerText = '$' + totalShareCompany.toFixed(2);
    }

        document.getElementById('clientAddress').value = job.clientAddress || '';

        technicians.forEach(tech => { tech.paid = 0; tech.weeks = []; tech.materialReimbursements = []; });

        if (job.expenseItems && job.expenseItems.length > 0) {

    // Builds and opens a print-ready report for a single technician: every job they

    async function printTechnicianReport(techName) {
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('p', 'mm', 'a4');
        doc.setFont("helvetica", "bold"); doc.setFontSize(15);
        doc.text("Technician Report:", 14, 15);
        const nameImg = textToImage(techName);
        const nameH = 7, nameW = nameH * nameImg.aspect;
        doc.addImage(nameImg.dataUrl, 'PNG', 62, 10, nameW, nameH);

        const dateFrom = document.getElementById('guideDateFrom').value;
        const dateTo = document.getElementById('guideDateTo').value;
        const hasDateFilter = !!(dateFrom || dateTo);

        const rows = [];
        let totalDues = 0, totalPaid = 0;
        const techStats = computeTechPeriodStats(dateFrom, dateTo)[techName];
        if (techStats) {
            techStats.jobs.forEach(j => {
                totalDues += j.dues;
                rows.push({ date: j.job.startDate || '', client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: j.dues, paid: null, remaining: null });
            });
        }
        // Payments come only from the 💵 button (same as the Guide), listed as their own rows.
        // Job rows show what was earned; payments are per technician, not per job, so the running
        // balance is given in the totals below the table instead of on each row.
        techPaymentsInPeriod(techName, dateFrom, dateTo)
            .slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''))
            .forEach(p => {
                const amt = parseVal(p.amount);
                totalPaid += amt;
                rows.push({ date: p.date || '', client: 'Payment' + (p.note ? ' - ' + p.note : ''), type: '-', dues: null, paid: amt, remaining: null });
            });

        if (rows.length === 0) { alert(currentLang === 'ar' ? 'الفني ده لسه مالوش شغلانات مسجلة في الفترة دي.' : 'This technician has no recorded jobs in this period.'); return; }

        const headers = [["Date", "Client", "Pay Type", "Dues", "Paid", "Remaining"]];
        const money = v => (v === null || v === undefined) ? '-' : '$' + v.toFixed(2);
        const data = rows.map(r => [r.date, r.client, r.type, money(r.dues), money(r.paid), money(r.remaining)]);
        const TECH_REPORT_ARABIC_COLS = [1, 2]; // Client, Pay Type

        doc.autoTable({
            head: headers, body: data, startY: 24, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: function(cellData) {
                if (cellData.section !== 'body') return;
                if (!TECH_REPORT_ARABIC_COLS.includes(cellData.column.index)) return;
                const text = String(cellData.cell.raw ?? '');
                if (!text || !containsArabic(text)) return;
                doc.setFillColor(255, 255, 255);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
                doc.setDrawColor(200, 200, 200);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
                const img = textToImage(text);
                const padding = 1;
                let targetH = cellData.cell.height - padding * 2;
                let targetW = targetH * img.aspect;
                if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
                const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
                const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
                doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
            }
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(0, 0, 0);
        doc.text(`Total Dues: $${totalDues.toFixed(2)}`, 14, finalY);
        doc.text(`Total Paid: $${totalPaid.toFixed(2)}`, 14, finalY + 7);
        doc.setFont("helvetica", "bold");
        doc.text(`Remaining Balance: $${(totalDues - totalPaid).toFixed(2)}`, 14, finalY + 14);

        doc.autoPrint();
        window.open(doc.output('bloburl'), '_blank');
    }

    async function importBackupJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                let addedJobs = 0, skippedJobs = 0, addedTechs = 0;

                if (Array.isArray(data.savedJobs)) {
                    const existingIds = new Set(savedJobs.map(j => j.id));
                    data.savedJobs.forEach(job => {
                        job.id = String(job.id);
                        if (existingIds.has(job.id)) { skippedJobs++; }
                        else { savedJobs.push(job); existingIds.add(job.id); addedJobs++; }
                    });
                }
                if (data.technicianPhones && typeof data.technicianPhones === 'object') {
                    Object.keys(data.technicianPhones).forEach(name => {
                        if (!(name in technicianPhones)) { technicianPhones[name] = data.technicianPhones[name]; addedTechs++; }
                    });
                }

                await saveSavedJobsData();
                await saveTechPhonesData();
                refreshAllViews();

                alert(`${t('alertImportSummaryPrefix')}\n${addedJobs} ${t('importJobsAdded')}\n${skippedJobs} ${t('importJobsSkipped')}\n${addedTechs} ${t('importTechsAdded')}`);
            } catch (err) {
                alert(t('alertImportFailed'));
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function containsArabic(text) { return /[\u0600-\u06FF]/.test(text || ''); }

    function textToImage(text) {
        const scale = 4;
        const fontPx = 34;
        const isArabic = containsArabic(text);
        const probe = document.createElement('canvas').getContext('2d');
        probe.font = `${fontPx * scale}px Cairo, Tahoma, Arial, sans-serif`;
        const textWidth = Math.max(probe.measureText(text || '').width, 1);

        const canvas = document.createElement('canvas');
        canvas.width = textWidth + 20 * scale;
        canvas.height = (fontPx + 14) * scale;
        const ctx = canvas.getContext('2d');
        ctx.font = `${fontPx * scale}px Cairo, Tahoma, Arial, sans-serif`;
        ctx.fillStyle = '#1a1a1a';
        ctx.textBaseline = 'middle';
        if (isArabic) { ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.fillText(text || '', canvas.width - 10 * scale, canvas.height / 2); }
        else { ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.fillText(text || '', 10 * scale, canvas.height / 2); }

        return { dataUrl: canvas.toDataURL('image/png'), aspect: canvas.width / canvas.height };
    }
