        html += `<div style="color:var(--text-muted); font-size:0.78rem; margin-bottom:6px;">${t('partnerAllTimeLabel')}</div>
        <div class="grid-2" style="margin-bottom:18px; gap:12px;">
            <div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:14px;">
                <div style="color:#38bdf8; font-weight:700; margin-bottom:8px;">S</div>
                <div class="summary-line">${t('totalEarnedLabel')} <b style="color:#34d399;">$${earnedS.toFixed(2)}</b></div>
                <div class="summary-line">${t('totalWithdrawnLabel')} <b style="color:#f87171;">$${withdrawnS.toFixed(2)}</b></div>
                <div class="summary-highlight"><span>${t('remainingBalanceLabel')}</span><b style="color:${remainingS < 0 ? '#f87171' : '#fbbf24'};">$${remainingS.toFixed(2)}</b></div>
            </div>
            <div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:14px;">
                <div style="color:#38bdf8; font-weight:700; margin-bottom:8px;">M</div>
                <div class="summary-line">${t('totalEarnedLabel')} <b style="color:#34d399;">$${earnedM.toFixed(2)}</b></div>
                <div class="summary-line">${t('totalWithdrawnLabel')} <b style="color:#f87171;">$${withdrawnM.toFixed(2)}</b></div>
                <div class="summary-highlight"><span>${t('remainingBalanceLabel')}</span><b style="color:${remainingM < 0 ? '#f87171' : '#fbbf24'};">$${remainingM.toFixed(2)}</b></div>
            </div>
        </div>`;

        if (partnerWithdrawals.length === 0) {
            html += `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noWithdrawalsYet')}</p>`;
        } else {
            const partnerFilter = document.getElementById('wdFilterPartner').value;
            const dateFrom = document.getElementById('wdFilterFrom').value;
            const dateTo = document.getElementById('wdFilterTo').value;
            const filtered = partnerWithdrawals
                .map((w, i) => ({ ...w, _origIndex: i }))
                .filter(w => {
                    const matchPartner = !partnerFilter || w.partner === partnerFilter;
                    const matchFrom = !dateFrom || (w.date && w.date >= dateFrom);
                    const matchTo = !dateTo || (w.date && w.date <= dateTo);
                    return matchPartner && matchFrom && matchTo;
                });

            html += `<h4 style="color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">${t('withdrawalHistoryTitle')} (${filtered.length})</h4>`;
            if (filtered.length === 0) {
                html += `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noWithdrawalsMatchFilter')}</p>`;
            } else {
                html += '<table style="width:100%; border-collapse:collapse;"><tbody>';
                filtered.forEach(w => {
                    html += `<tr style="border-top:1px solid var(--border-color);">
                        <td style="padding:6px; font-size:0.78rem; color:var(--text-muted); white-space:nowrap;">${w.date || ''}</td>
                        <td style="padding:6px; font-weight:700; color:#38bdf8;">${w.partner}</td>
                        <td style="padding:6px; color:#f87171; font-weight:700;">$${parseVal(w.amount).toFixed(2)}</td>
                        <td style="padding:6px; font-size:0.78rem; color:var(--text-muted);">${w.note || ''}</td>
                        <td style="padding:6px;"><button class="danger" onclick="deleteWithdrawal(${w._origIndex})" style="padding:3px 8px; font-size:0.72rem;">${t('deleteBtn')}</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
        }
        container.innerHTML = html;
    }

    // ---------- Partner Report: a shareable, per-partner statement across every job that partner
    // was added to as an "extra partner" — full transparency (job total, materials, technicians, then
    // everyone's % and $ share), so it's ready to send to that partner directly. ----------
    function getExtraPartnerNames() {
        let names = new Set();
        savedJobs.forEach(job => (job.extraPartners || []).forEach(p => { if (p.name && p.name.trim() && parseVal(p.percent) > 0.005) names.add(p.name.trim()); }));
        return Array.from(names).sort();
    }

    function jobsForExtraPartner(name) {
        return savedJobs.filter(job => (job.extraPartners || []).some(p => (p.name || '').trim() === name && parseVal(p.percent) > 0.005));
    }

    function openPartnerReportModal() {
        closeOtherTopModals('partnerReportModal');
        const sel = document.getElementById('partnerReportSelect');
        const names = getExtraPartnerNames();
        sel.innerHTML = names.length
            ? names.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('')
            : `<option value="">${t('noExtraPartnersYet')}</option>`;
        document.getElementById('partnerReportModal').style.display = 'flex';
        renderPartnerReportContent();
    }
    function closePartnerReportModal() { document.getElementById('partnerReportModal').style.display = 'none'; }

    function renderPartnerReportContent() {
        const container = document.getElementById('partnerReportContent');
        const name = document.getElementById('partnerReportSelect').value;
        if (!name) { container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noExtraPartnersYet')}</p>`; return; }

        const jobs = jobsForExtraPartner(name);
        let partnerTotal = 0, jobsHtml = '';
        jobs.forEach(job => {
            const { shareS, shareM, companyNet, ratio, extraShares, totalTechDues } = jobNet(job);
            const mine = extraShares.find(x => (x.name || '').trim() === name);
            partnerTotal += mine ? mine.amount : 0;

            const rows = [
                { label: 'S', percent: ratio.s * 100, amount: shareS },
                { label: 'M', percent: ratio.m * 100, amount: shareM },
                { label: t('statShareCompany'), percent: ratio.company * 100, amount: companyNet },
                ...extraShares.filter(x => x.percent > 0.005).map(x => ({ label: x.name || '?', percent: x.percent, amount: x.amount, mine: (x.name || '').trim() === name }))
            ];
            // Everyone's cut of this one job, all on one line — same format as the job's own ℹ️ details popup.
            const splitLine = rows.map(r => {
                const seg = `${escHtml(r.label)} (${Math.round(r.percent)}%): ${ltrAmt(r.amount)}`;
                return r.mine ? `<strong style="color:#34d399;">${seg}</strong>` : seg;
            }).join('&nbsp;&nbsp;|&nbsp;&nbsp;');
            jobsHtml += `<div style="border:1px solid var(--border-color); border-radius:10px; padding:12px 14px; margin-bottom:12px;">
                <div style="font-weight:700; color:#38bdf8; margin-bottom:6px;">${escHtml(job.clientName || '')}${job.startDate ? ' — ' + escHtml(job.startDate) : ''}</div>
                <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;">
                    ${t('qdTotalRevenue')} ${ltrAmt(job.totalRevenue)} &nbsp;|&nbsp;
                    ${t('thMaterials')} ${ltrAmt(job.materialCost)} &nbsp;|&nbsp;
                    ${t('qdTechBreakdown')} ${ltrAmt(totalTechDues)}
                </div>
                <div style="font-size:0.82rem;">${splitLine}</div>
            </div>`;
        });

        // Paid comes ONLY from this screen's own ledger (extraPartnerPayments) — kept entirely
        // separate from techPayments, so a payment logged here never shows up on, or draws from,
        // any other screen (Technicians Guide, Technician & Partner Report), even if this
        // partner's name happens to match a technician's name elsewhere.
        const myPayments = extraPartnerPayments.filter(p => (p.name || '').trim() === name)
            .slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const paid = round2(myPayments.reduce((s, p) => s + parseVal(p.amount), 0));
        const remaining = round2(partnerTotal - paid);

        const paymentsHtml = myPayments.length === 0
            ? `<p style="color:var(--text-muted); padding:6px 0; font-size:0.8rem;">${t('partnerPaymentNoneYet')}</p>`
            : myPayments.map(p => {
                const idx = extraPartnerPayments.indexOf(p);
                return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border-color); font-size:0.8rem;">
                    <span>${escHtml(p.date || '')}${p.note ? ' — ' + escHtml(p.note) : ''}</span>
                    <span style="display:flex; align-items:center; gap:8px;">
                        <strong style="color:#34d399;">${ltrAmt(parseVal(p.amount))}</strong>
                        <button class="danger" onclick="deleteExtraPartnerPayment(${idx})" style="padding:2px 8px; font-size:0.7rem;">${t('deleteBtn')}</button>
                    </span>
                </div>`;
            }).join('');

        container.innerHTML = (jobs.length === 0)
            ? `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noJobsThisDay')}</p>`
            : jobsHtml + `
                <div style="margin-top:4px; padding-top:8px; border-top:2px solid var(--border-color); font-size:0.95rem; line-height:1.9;">
                    <div style="display:flex; justify-content:space-between;"><span>${t('partnerReportTotalLabel')}</span> <strong style="color:#34d399;">${ltrAmt(partnerTotal)}</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>${t('techPartnerColPaid')}</span> <strong>${ltrAmt(paid)}</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>${t('techPartnerColRemaining')}</span> <strong style="color:${remaining > 0.005 ? '#f87171' : '#34d399'};">${ltrAmt(remaining)}</strong></div>
                </div>
                <div style="margin-top:14px;">
                    <div style="font-weight:700; margin-bottom:4px; font-size:0.85rem;">${t('partnerPaymentHistoryTitle')}</div>
                    ${paymentsHtml}
                </div>`;
    }
    function renderPartnerReportContentIfOpen() {
        if (document.getElementById('partnerReportModal').style.display === 'flex') renderPartnerReportContent();
    }
    function toggleExtraPartnerPaymentForm() {
        const name = document.getElementById('partnerReportSelect').value;
        if (!name) { alert(t('noExtraPartnersYet')); return; }
        const box = document.getElementById('extraPartnerPaymentForm');
        const showing = box.style.display !== 'none';
        if (showing) { closeExtraPartnerPaymentForm(); return; }
        box.style.display = 'block';
        document.getElementById('partnerPaymentAmount').value = '';
        document.getElementById('partnerPaymentDate').value = isoDate(new Date());
        document.getElementById('partnerPaymentNote').value = '';
    }
    function closeExtraPartnerPaymentForm() {
        document.getElementById('extraPartnerPaymentForm').style.display = 'none';
    }
    // Saves a payment into this screen's OWN ledger (extraPartnerPayments) — never touches
    // techPayments, so it only ever appears here, exactly as asked.
    async function saveExtraPartnerPayment() {
        const name = document.getElementById('partnerReportSelect').value;
        if (!name) { alert(t('noExtraPartnersYet')); return; }
        const amount = parseVal(document.getElementById('partnerPaymentAmount').value);
        const date = document.getElementById('partnerPaymentDate').value || isoDate(new Date());
        const note = document.getElementById('partnerPaymentNote').value.trim();
        if (amount <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }

        const entry = { name, amount, date, note, by: currentUserEmail || '?', at: new Date().toISOString() };
        try {
            extraPartnerPayments.unshift(entry);
            await EXTRA_PARTNER_PAYMENTS_DOC.set({ entries: extraPartnerPayments });
            closeExtraPartnerPaymentForm();
            renderPartnerReportContent();
        } catch (err) {
            extraPartnerPayments = extraPartnerPayments.filter(x => x !== entry);
            alertSaveError(err);
        }
    }
    async function deleteExtraPartnerPayment(index) {
        const backup = extraPartnerPayments[index];
        extraPartnerPayments.splice(index, 1);
        renderPartnerReportContent();
        try {
            await EXTRA_PARTNER_PAYMENTS_DOC.set({ entries: extraPartnerPayments });
        } catch (err) {
            if (backup) extraPartnerPayments.splice(index, 0, backup);
            renderPartnerReportContent();
            alertSaveError(err);
            return;
        }
        showUndoToast(t('undoToastDeleted'), async () => {
            extraPartnerPayments.splice(index, 0, backup);
            renderPartnerReportContent();
            try { await EXTRA_PARTNER_PAYMENTS_DOC.set({ entries: extraPartnerPayments }); }
            catch (err) { alertSaveError(err); }
        });
    }

    // Built the same way as the Technician Report: one clean autoTable grid (instead of
    // manually-positioned free text), with Arabic cells (client names, the partner's own name)
    // drawn as images the same way, since jsPDF's built-in fonts can't render Arabic text.
    async function downloadPartnerReportPDF() {
        const name = document.getElementById('partnerReportSelect').value;
        if (!name) return;
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('p', 'mm', 'a4');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
        const titleText = `${companyDisplayName()} - Partner Report:`;
        doc.text(titleText, 14, 15);
        const nameImg = textToImage(name);
        const nameH = 7, nameW = nameH * nameImg.aspect;
        const nameX = 14 + doc.getTextWidth(titleText) + 4; // small gap after the title text
        doc.addImage(nameImg.dataUrl, 'PNG', nameX, 10, nameW, nameH);

        const jobs = jobsForExtraPartner(name);
        const rows = [];
        let grandTotal = 0;
        jobs.forEach(job => {
            const { extraShares, totalTechDues } = jobNet(job);
            const mine = extraShares.find(x => (x.name || '').trim() === name);
            const myAmount = mine ? mine.amount : 0;
            const myPercent = mine ? mine.percent : 0;
            grandTotal += myAmount;
            rows.push({
                date: job.startDate || '', client: job.clientName || '',
                total: parseVal(job.totalRevenue), materials: parseVal(job.materialCost),
                tech: totalTechDues, percent: myPercent, share: myAmount
            });
        });

        if (rows.length === 0) { alert(t('noJobsThisDay')); return; }

        const headers = [["Date", "Client", "Job Total", "Materials", "Technicians", "Share $"]];
        const money = v => '$' + v.toFixed(2);
        const data = rows.map(r => [r.date, r.client, money(r.total), money(r.materials), money(r.tech), money(r.share)]);
        const PARTNER_REPORT_ARABIC_COLS = [1]; // Client

        doc.autoTable({
            head: headers, body: data, startY: 24, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: function(cellData) {
                if (cellData.section !== 'body') return;
                if (!PARTNER_REPORT_ARABIC_COLS.includes(cellData.column.index)) return;
                const text = String(cellData.cell.raw ?? '');
                if (!text || !containsArabic(text)) return;
                doc.setFillColor(255, 255, 255);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
                doc.setDrawColor(200, 200, 200);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
                const img = textToImage(text);
                const padding = 1;
                let targetH = cellData.cell.height - padding * 2;
                let targetW = targetH * img.aspect;
                if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
                const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
                const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
                doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
            }
        });

        // Paid/Remaining come from this report's own payment ledger (extraPartnerPayments) —
        // the same one the on-screen view uses — never from techPayments.
        const paid = round2(extraPartnerPayments.filter(p => (p.name || '').trim() === name).reduce((s, p) => s + parseVal(p.amount), 0));
        const remaining = round2(grandTotal - paid);

        let finalY = doc.lastAutoTable.finalY + 10;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(0, 0, 0);
        if (containsArabic(name)) {
            const totalPrefix = `Total for`;
            doc.text(totalPrefix, 14, finalY);
            const totalNameImg = textToImage(name);
            const totalNameH = 6, totalNameW = totalNameH * totalNameImg.aspect;
            const totalNameX = 14 + doc.getTextWidth(totalPrefix) + 3;
            doc.addImage(totalNameImg.dataUrl, 'PNG', totalNameX, finalY - totalNameH + 1.5, totalNameW, totalNameH);
            doc.text(`: $${grandTotal.toFixed(2)}`, totalNameX + totalNameW + 1, finalY);
        } else {
            doc.text(`Total for ${name}: $${grandTotal.toFixed(2)}`, 14, finalY);
        }
        finalY += 8;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
        doc.text(`Paid: $${paid.toFixed(2)}`, 14, finalY);
        finalY += 7;
        doc.setFont('helvetica', 'bold');
        doc.text(`Remaining: $${remaining.toFixed(2)}`, 14, finalY);

        addLogoWatermark(doc);
        doc.save(`${companyFileSlug()}_Partner_Report_${name}.pdf`);
    }

    // Simple PDF-only weekly recap for the Company Account screen — deliberately NOT shown
    // inline on screen (the user asked for a report without a table cluttering the page),
    // just a button that generates it for the date range already picked above. Two small
    // tables (income by job, expenses by category) + one net line, built the exact same
    // Arabic-safe way as the other reports (autoTable + textToImage for Arabic cells).
    async function downloadCompanyWeekReportPDF() {
        const dateFrom = document.getElementById('ceFilterFrom').value;
        const dateTo = document.getElementById('ceFilterTo').value;
        if (!dateFrom && !dateTo) { alert(t('alertPickWeekFirst')); return; }
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('p', 'mm', 'a4');

        doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
        doc.text(`${companyDisplayName()} - Company Weekly Report`, 14, 15);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 100, 100);
        doc.text(`Period: ${dateFrom || '...'} - ${dateTo || '...'}`, 14, 21);
        doc.text(`Printed on: ${isoDate(new Date())}`, 14, 26);
        doc.setTextColor(0, 0, 0);

        const drawArabicCell = (colIndexes) => function (cellData) {
            if (cellData.section !== 'body') return;
            if (!colIndexes.includes(cellData.column.index)) return;
            const text = String(cellData.cell.raw ?? '');
            if (!text || !containsArabic(text)) return;
            doc.setFillColor(255, 255, 255);
            doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
            doc.setDrawColor(200, 200, 200);
            doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
            const img = textToImage(text);
            const padding = 1;
            let targetH = cellData.cell.height - padding * 2;
            let targetW = targetH * img.aspect;
            if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
            const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
            const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
            doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
        };

        // Section 1: the full P&L waterfall for the period — Revenue in, Materials and
        // Technician dues out, the 40/40/20 split, so this report alone is a complete profit &
        // loss statement for the period, not just a bottom-line number.
        const { totalShareCompany, jobBreakdown, totalReceived: periodReceivedPdf, totalMaterials: periodMaterialsPdf, totalTechDues: periodTechDuesPdf, totalShareS: periodShareSPdf, totalShareM: periodShareMPdf } = computeSAndMPeriodShare(dateFrom, dateTo);
        const money = v => '$' + v.toFixed(2);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text('Profit & Loss Summary', 14, 34);
        doc.autoTable({
            body: [
                ['Total Received', money(periodReceivedPdf)],
                ['Materials', '-' + money(periodMaterialsPdf)],
                ['Technician Dues', '-' + money(periodTechDuesPdf)],
                ["S's Share", money(periodShareSPdf)],
                ["M's Share", money(periodShareMPdf)],
                ["Company's Share (Net)", money(totalShareCompany)],
            ],
            startY: 37, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2.5 },
            columnStyles: { 1: { halign: 'right', fontStyle: 'bold' } },
        });

        // Section 2: company income, broken down job by job — same math/source as the
        // "Send Company Share" WhatsApp message, just on paper instead.
        const incomeRows = (jobBreakdown || [])
            .filter(b => Math.abs(b.shareCompany) > 0.005)
            .map(b => [
                b.generalBonus ? 'General bonus' : (b.job.clientName || ''),
                b.generalBonus ? '' : (b.job.startDate || ''),
                '$' + b.shareCompany.toFixed(2)
            ]);

        let afterSummaryY = doc.lastAutoTable.finalY + 10;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text('Company Income by Job', 14, afterSummaryY);
        doc.autoTable({
            head: [['Client', 'Date', 'Company Share']],
            body: incomeRows.length ? incomeRows : [['-', '-', '$0.00']],
            startY: afterSummaryY + 3, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: drawArabicCell([0])
        });

        // Section 3: general expenses in the same period, grouped by category.
        const periodExpenses = companyExpenses.filter(e => (!dateFrom || (e.date && e.date >= dateFrom)) && (!dateTo || (e.date && e.date <= dateTo)));
        const catTotals = {};
        periodExpenses.forEach(e => {
            const label = expenseCatLabel(e.category);
            catTotals[label] = round2((catTotals[label] || 0) + parseVal(e.amount));
        });
        const expenseRows = Object.keys(catTotals).map(label => [label, '$' + catTotals[label].toFixed(2)]);
        const totalSpent = round2(periodExpenses.reduce((s, e) => s + parseVal(e.amount), 0));

        let afterIncomeY = doc.lastAutoTable.finalY + 10;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text('General Expenses by Category', 14, afterIncomeY);
        doc.autoTable({
            head: [['Category', 'Total']],
            body: expenseRows.length ? expenseRows : [['-', '$0.00']],
            startY: afterIncomeY + 3, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: drawArabicCell([0])
        });

        const netForPeriod = round2(totalShareCompany - totalSpent);
        let finalY = doc.lastAutoTable.finalY + 10;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(0, 0, 0);
        doc.text(`Net for the Period: $${netForPeriod.toFixed(2)}`, 14, finalY);

        addLogoWatermark(doc);
        doc.save(`${companyFileSlug()}_Company_Weekly_Report_${dateFrom || 'all'}_${dateTo || 'all'}.pdf`);
    }

    // ---------- Technician & Partner Report: pick ONE person, see every job he worked as a
    // technician in one table and every job he's a profit-share partner in a second table —
    // kept strictly separate so a job never shows two different numbers mixed in one row.
    // Tech dues and partner share both come from the exact same math used everywhere else
    // (calculateJobTechDuesWithReimbursement / jobNet's extraShares, which already deducts
    // ALL technicians' dues + materials before splitting the partner percentage). ----------
    function getAllTechAndPartnerNames() {
        const names = new Set();
        savedJobs.forEach(job => {
            (job.technicians || []).forEach(t => { if (t.name && t.name.trim()) names.add(t.name.trim()); });
            (job.extraPartners || []).forEach(p => { if (p.name && p.name.trim() && parseVal(p.percent) > 0.005) names.add(p.name.trim()); });
        });
        return Array.from(names).sort();
    }
    function jobsWhereTech(name) {
        return savedJobs.filter(job => (job.technicians || []).some(t => (t.name || '').trim() === name));
    }

    function openTechPartnerReportModal() {
        closeOtherTopModals('techPartnerReportModal');
        const sel = document.getElementById('techPartnerReportSelect');

    // Same week-picker as the Technicians Guide and the S & M account, for this report too.
    let techPartnerLastWeekStep = 0;
    function shiftTechPartnerWeek(dir) {
        const fromEl = document.getElementById('techPartnerReportFrom'), toEl = document.getElementById('techPartnerReportTo');
        const base = mondayOf(fromEl.value || isoDate(new Date()));
        const w = weekOf(base, dir);
        fromEl.value = w.start; toEl.value = w.end;
        renderTechPartnerReportContent();
    }
    function setTechPartnerDateRange(preset) {
        const fromEl = document.getElementById('techPartnerReportFrom');
        const toEl = document.getElementById('techPartnerReportTo');
        const today = new Date();
        const iso = d => isoDate(d);
        if (preset === 'today') {
            techPartnerLastWeekStep = 0;
            fromEl.value = iso(today); toEl.value = iso(today);
        } else if (preset === 'week') {
            techPartnerLastWeekStep = 0;
            const w = weekOf(iso(today), 0);
            fromEl.value = w.start; toEl.value = w.end;
        } else if (preset === 'lastweek') {
            techPartnerLastWeekStep += 1;
            const w = weekOf(iso(today), -techPartnerLastWeekStep);
            fromEl.value = w.start; toEl.value = w.end;
        } else {
            techPartnerLastWeekStep = 0;
            fromEl.value = ''; toEl.value = '';
        }
        renderTechPartnerReportContent();
    }

    // Shared by the on-screen view and the PDF: for one person, their two job lists plus the
    // combined total/paid/remaining. Paid/remaining use the SAME payments ledger as everywhere
    // else (not job-specific) — a payment can be made out of one job's money to settle dues
    // that built up across several jobs, which is exactly how the weekly payout works in practice.
    function techPartnerReportData(name, dateFrom, dateTo) {
        dateFrom = dateFrom || ''; dateTo = dateTo || '';
        const inRange = job => (!dateFrom || (job.startDate && job.startDate >= dateFrom)) && (!dateTo || (job.startDate && job.startDate <= dateTo));
        const techJobs = jobsWhereTech(name).filter(inRange).map(job => {
            const tech = (job.technicians || []).find(t => (t.name || '').trim() === name);
            const dues = calculateJobTechDuesWithReimbursement(tech, job.amountReceived, job.materialCost);
            return { job, dues };
        });
        const partnerJobs = jobsForExtraPartner(name).filter(inRange).map(job => {
            const { extraShares } = jobNet(job);
            const mine = extraShares.find(x => (x.name || '').trim() === name);
            return { job, percent: mine ? mine.percent : 0, amount: mine ? mine.amount : 0 };
        });
        const techTotal = round2(techJobs.reduce((s, r) => s + r.dues, 0));
        const partnerTotal = round2(partnerJobs.reduce((s, r) => s + r.amount, 0));
        const combinedTotal = round2(techTotal + partnerTotal);
        const paid = round2(techPaymentsInPeriod(name, dateFrom, dateTo).reduce((s, p) => s + parseVal(p.amount), 0));
        const remaining = round2(combinedTotal - paid);
        return { techJobs, partnerJobs, techTotal, partnerTotal, combinedTotal, paid, remaining };
    }

    // Same structured-table style as the Technician and Partner reports: two separate grids
    // (as-technician, as-partner) for the selected person, then one combined total/paid/remaining.
    async function downloadTechPartnerReportPDF() {
        const name = document.getElementById('techPartnerReportSelect').value;
        if (!name) return;
        const dateFrom = document.getElementById('techPartnerReportFrom').value;
        const dateTo = document.getElementById('techPartnerReportTo').value;
        const { techJobs, partnerJobs, combinedTotal, paid, remaining } = techPartnerReportData(name, dateFrom, dateTo);
        if (techJobs.length === 0 && partnerJobs.length === 0) { alert(t('noJobsThisDay')); return; }
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('p', 'mm', 'a4');
        const money = v => '$' + v.toFixed(2);

        doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
        const titleText = `${companyDisplayName()} - Technician & Partner Report:`;
        doc.text(titleText, 14, 15);
        const nameImg = textToImage(name);
        const nameH = 7, nameW = nameH * nameImg.aspect;
        const nameX = 14 + doc.getTextWidth(titleText) + 4; // small gap after the title text
        doc.addImage(nameImg.dataUrl, 'PNG', nameX, 10, nameW, nameH);

        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 100, 100);
        const periodText = (dateFrom || dateTo)
            ? `Period: ${dateFrom || '...'} - ${dateTo || '...'}`
            : `Period: All time`;
        doc.text(periodText, 14, 21);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
        doc.text(`Printed on: ${isoDate(new Date())}`, 14, 26);
        doc.setTextColor(0, 0, 0);

        const drawArabicCells = function(cellData, arabicCols) {
            if (cellData.section !== 'body') return;
            if (!arabicCols.includes(cellData.column.index)) return;
            const text = String(cellData.cell.raw ?? '');
            if (!text || !containsArabic(text)) return;
            doc.setFillColor(255, 255, 255);
            doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
            doc.setDrawColor(200, 200, 200);
            doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
            const img = textToImage(text);
            const padding = 1;
            let targetH = cellData.cell.height - padding * 2;
            let targetW = targetH * img.aspect;
            if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
            const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
            const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
            doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
        };

        let nextY = 34;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(0, 0, 0);
        doc.text('As Technician', 14, nextY);
        doc.autoTable({
            head: [["Date", "Client", "Tech Dues"]],
            body: techJobs.length ? techJobs.map(({ job, dues }) => [job.startDate || '', job.clientName || '', money(dues)]) : [['', '—', money(0)]],
            startY: nextY + 3, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: cellData => drawArabicCells(cellData, [1])
        });
        nextY = doc.lastAutoTable.finalY + 12;

        doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
        doc.text('As Partner', 14, nextY);
        doc.autoTable({
            head: [["Date", "Client", "Share %", "Partner Share $"]],
            body: partnerJobs.length ? partnerJobs.map(({ job, percent, amount }) => [job.startDate || '', job.clientName || '', Math.round(percent) + '%', money(amount)]) : [['', '—', '', money(0)]],
            startY: nextY + 3, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: cellData => drawArabicCells(cellData, [1])
        });
        nextY = doc.lastAutoTable.finalY + 12;

        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(0, 0, 0);
        doc.text(`Total (technician + partner): ${money(combinedTotal)}`, 14, nextY);
        doc.text(`Paid (${(dateFrom || dateTo) ? 'in period' : 'all-time'}): ${money(paid)}`, 14, nextY + 7);
        doc.text(`Remaining: ${money(remaining)}`, 14, nextY + 14);

        addLogoWatermark(doc);
        doc.save(`${companyFileSlug()}_Tech_Partner_Report_${name}.pdf`);
    }

    function renderExpenseReportContent() {
        const container = document.getElementById('expenseReportContent');
        const totals = {};
        let grandTotal = 0;
        let companyIncome = 0;
        savedJobs.forEach(job => {
            const { companyGross } = jobNet(job);
            companyIncome += companyGross;
            (job.expenseItems || []).forEach(item => {
                const amt = parseVal(item.amount);
                totals[item.category] = (totals[item.category] || 0) + amt;
                grandTotal += amt;
            });
            // Backward compatibility: old jobs may only have a plain extraExpenses number with no breakdown.
            if ((!job.expenseItems || job.expenseItems.length === 0) && parseVal(job.extraExpenses) > 0) {
                totals['أخرى'] = (totals['أخرى'] || 0) + parseVal(job.extraExpenses);
                grandTotal += parseVal(job.extraExpenses);
            }
        });
        const companyNetTotal = companyIncome - grandTotal;

        let html = `<div class="grid-3" style="margin-bottom:18px;">
            <div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:12px; text-align:center;">
                <div style="font-size:0.75rem; color:var(--text-muted);">${t('companyIncomeLabel')}</div>
                <div style="font-size:1.15rem; font-weight:700; color:#34d399;">$${companyIncome.toFixed(2)}</div>
            </div>
            <div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:12px; text-align:center;">
                <div style="font-size:0.75rem; color:var(--text-muted);">${t('companyOutgoLabel')}</div>
                <div style="font-size:1.15rem; font-weight:700; color:#f87171;">$${grandTotal.toFixed(2)}</div>
            </div>
            <div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:12px; text-align:center;">
                <div style="font-size:0.75rem; color:var(--text-muted);">${t('companyNetLabel')}</div>
                <div style="font-size:1.15rem; font-weight:700; color:${companyNetTotal < 0 ? '#f87171' : '#38bdf8'};">$${companyNetTotal.toFixed(2)}</div>
            </div>
        </div>`;

        const categories = Object.keys(totals);
        if (categories.length === 0) { html += `<p style="text-align:center; color:var(--text-muted); padding:20px;">${t('expenseReportEmpty')}</p>`; container.innerHTML = html; return; }

        categories.sort((a, b) => totals[b] - totals[a]);
        html += '<table style="width:100%; border-collapse:collapse; margin-top:10px;"><thead><tr><th>' + t('expenseCategoryLabel') + '</th><th>' + t('expenseAmountLabel') + '</th></tr></thead><tbody>';
        categories.forEach(cat => {
            html += `<tr><td>${expenseCatLabel(cat)}</td><td style="color:#fbbf24; font-weight:700;">$${totals[cat].toFixed(2)}</td></tr>`;
        });
        html += `<tr style="border-top:2px solid var(--border-color);"><td style="font-weight:700;">${t('expenseReportTotal')}</td><td style="color:#38bdf8; font-weight:700;">$${grandTotal.toFixed(2)}</td></tr>`;
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // Builds a full international number from a selected country code + whatever the person
    // typed, instead of guessing the country from the digit count (which always assumed US).
    function buildFullPhone(countryCode, localNumber) {
        let digits = String(localNumber).replace(/[^\d]/g, '');
        digits = digits.replace(/^0+/, ''); // many countries prefix local numbers with a 0 that's dropped internationally
        if (!digits) return '';
        if (countryCode === 'other') return digits; // person typed the code as part of the number itself
        return countryCode + digits;
    }

    // Best-effort split of a stored full number back into {code, local} for editing —
    // matches against our known list, longest code first so e.g. 971 isn't misread as 97+1.
    function splitPhoneForEdit(fullPhone) {
        const digits = String(fullPhone || '').replace(/[^\d]/g, '');
        if (!digits) return { code: '1', local: '' };
        const sorted = getCountryCodes().filter(c => c.code !== 'other').sort((a, b) => b.code.length - a.code.length);
        for (const c of sorted) {
            if (digits.startsWith(c.code)) return { code: c.code, local: digits.slice(c.code.length) };
        }
        return { code: 'other', local: digits };
    }

    function escJs(str) { return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    /* ---------------- Contacts ---------------- */
    function normalizePhoneDigits(p) { return (p || '').replace(/\D/g, ''); }

    // A match on phone digits is decisive; if neither has a phone, fall back to an
    // exact (case-insensitive) name match.
    function findDuplicateContact(name, phone, excludeId) {
        const normPhone = normalizePhoneDigits(phone);
        return contacts.find(c => {
            if (c.id === excludeId) return false;
            if (normPhone && normalizePhoneDigits(c.phone)) return normalizePhoneDigits(c.phone) === normPhone;
            return c.name.trim().toLowerCase() === (name || '').trim().toLowerCase();
        });
    }

    async function saveContact() {
        const name = document.getElementById('contactName').value.trim();
        if (!name) { alert(t('alertClientNameRequired')); return; }
        const phone = document.getElementById('contactPhone').value.trim();

        const dup = findDuplicateContact(name, phone, editingContactId);
        if (dup) { alert(t('alertDuplicateContact') + ` (${dup.name})`); return; }

        const fields = {
            name, phone,
            company: document.getElementById('contactCompany').value.trim(),
            email: document.getElementById('contactEmail').value.trim(),
            address: document.getElementById('contactAddress').value.trim(),
            note: document.getElementById('contactNote').value.trim(),
            by: currentUserEmail || '?'
        };

        try {
            if (editingContactId) {
                const idx = contacts.findIndex(c => c.id === editingContactId);
                if (idx !== -1) contacts[idx] = { ...contacts[idx], ...fields };
            } else {
                contacts.unshift({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), ...fields });
            }
            await CONTACTS_DOC.set({ entries: contacts });
            toggleContactForm(true);
            renderContacts();
        } catch (err) {
            alertSaveError(err);
        }
    }

    async function deleteContact(id) {
        if (!confirm(t('confirmDeleteContact'))) return;
        contacts = contacts.filter(c => c.id !== id);
        try { await CONTACTS_DOC.set({ entries: contacts }); renderContacts(); }
        catch (err) { alert(t('alertJobSaveFailed')); }
    }

    // Scans every job on record and adds any client not already a contact — matched the
    // same way manual duplicate-checking works (phone first, name as a fallback) — so
    // running it twice never creates copies.
    async function importContactsFromJobs() {
        let addedCount = 0;
        savedJobs.forEach(job => {
            if (!job.clientName) return;
            if (findDuplicateContact(job.clientName, job.clientPhone, null)) return;
            contacts.unshift({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5) + addedCount,
                name: job.clientName, phone: job.clientPhone || '', email: job.clientEmail || '',
                address: job.clientAddress || '', company: '', note: '', by: currentUserEmail || '?'
            });
            addedCount++;
        });
        if (addedCount === 0) { alert(t('noNewContactsToImport')); return; }
        try {
            await CONTACTS_DOC.set({ entries: contacts });
            renderContacts();
            alert(t('importedContactsCount').replace('{n}', addedCount));
        } catch (err) { alert(t('alertJobSaveFailed')); }
    }

    const AVATAR_COLORS = ['#0ea5e9', '#f59e0b', '#10b981', '#a855f7', '#ec4899', '#ef4444', '#6366f1', '#14b8a6'];
    function avatarColorFor(name) {
        let hash = 0;
        for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    // resulting payment then gets tagged with that job's id, so the job screen's own paid/remaining
    // (and the Job Pay / Tech & Partner reports) count it correctly. Opened from anywhere else

    let techPaymentJobId = null;
    // Every job this person is in, either as a technician or as an extra profit-share partner
    // (or both) — used to let a payment be tagged to one specific job instead of only ever
    // being a general payment against his combined total.
    function jobOptionsForPaymentPerson(name) {
        const byId = new Map();
        jobsWhereTech(name).forEach(job => {
            const e = byId.get(job.id) || { job, tech: false, partner: false };
            e.tech = true; byId.set(job.id, e);
        });
        jobsForExtraPartner(name).forEach(job => {
            const e = byId.get(job.id) || { job, tech: false, partner: false };
            e.partner = true; byId.set(job.id, e);
        });
        return Array.from(byId.values()).sort((a, b) => (b.job.startDate || '').localeCompare(a.job.startDate || ''));

    function populateTechPaymentJobSelect(name, preselectJobId) {
        const sel = document.getElementById('techPaymentJobSelect');
        const options = jobOptionsForPaymentPerson(name);
        let html = `<option value="">${t('techPaymentAllJobsOption')}</option>`;
        options.forEach(({ job, tech, partner }) => {
            const icon = tech && partner ? '🔧🤝' : (partner ? '🤝' : '🔧');
            html += `<option value="${escHtml(job.id)}">${icon} ${escHtml(job.clientName || '')}${job.startDate ? ' — ' + escHtml(job.startDate) : ''}</option>`;
        });
        sel.innerHTML = html;

        document.getElementById('techPaymentJobGroup').style.display = options.length ? '' : 'none';

    function syncTechPaymentSettleDate() {

    async function saveTechPayment() {
        const amount = parseVal(document.getElementById('techPaymentAmount').value);
        const date = document.getElementById('techPaymentDate').value;
        const settleDate = document.getElementById('techPaymentSettleDate').value || date;
        const note = document.getElementById('techPaymentNote').value.trim();
        if (amount <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }

        if (editingPaymentAt) {   // editing an existing payment: same record, new amount / date / note
            const idx = techPayments.findIndex(x => x.at === editingPaymentAt);
            if (idx === -1) { closeTechPaymentModal(); renderTechGuideContent(); return; }
            const backup = { ...techPayments[idx] };
            techPayments[idx] = { ...backup, amount, date, settleDate, note, editedBy: currentUserEmail || '?', editedAt: new Date().toISOString() };
            try {
                await TECH_PAYMENTS_DOC.set({ entries: techPayments });
                logActivity('edit', backup.name || '', `${t('guidePaymentsTitle')}: $${parseVal(backup.amount).toFixed(2)} (${backup.date || ''}) → $${amount.toFixed(2)} (${date})`);
            } catch (err) {
                techPayments[idx] = backup;
                alertSaveError(err);
                return;
            }
            closeTechPaymentModal();
            renderTechGuideContent();
            safeCall(renderTechnicians);
            safeCall(renderTechPartnerReportContentIfOpen);
            safeCall(renderPartnerReportContentIfOpen);
            return;
        }

        const entry = { name: techPaymentName, amount, date, settleDate, note, by: currentUserEmail || '?', at: new Date().toISOString() };
        const jobSelectEl = document.getElementById('techPaymentJobSelect');
        const chosenJobId = (jobSelectEl && jobSelectEl.value) || techPaymentJobId;
        if (chosenJobId) {
            entry.jobId = chosenJobId;
            const job = savedJobs.find(j => String(j.id) === String(chosenJobId));
            if (job) entry.jobClientName = job.clientName || '';
        }
        try {
            techPayments.unshift(entry);
            await TECH_PAYMENTS_DOC.set({ entries: techPayments });
            closeTechPaymentModal();
            renderTechGuideContent();
            safeCall(renderTechnicians);
            safeCall(renderJobPayModalIfOpen);
            safeCall(renderTechPartnerReportContentIfOpen);
            safeCall(renderPartnerReportContentIfOpen);
        } catch (err) {
            techPayments = techPayments.filter(x => x !== entry);   // the save failed: don't keep a payment that was never stored
            alertSaveError(err);
        }
    }

    // What the day editor looks like right now, to tell whether something was changed and not saved.
    function scheduleEditorState() {
        return { date: document.getElementById('editScheduleDayLabel').value, time: document.getElementById('esTime').value,
                 note: document.getElementById('esNote').value, team: [...document.querySelectorAll('.es-team-check:checked')].map(c => c.value).sort().join('|') };
    }
    function scheduleEditorDirty() {
        if (!editScheduleSnap) return false;
        const now = scheduleEditorState();
        return now.date !== editScheduleSnap.date || now.time !== editScheduleSnap.time || now.note !== editScheduleSnap.note || now.team !== editScheduleSnap.team;
    }
    function goFullEdit(jobId) { closeEditScheduleModal(); openJobOverlay(jobId); }

        document.getElementById('unsavedScheduleModal').style.display = 'none';

        const jobId = pendingFullEditJobId;

        goFullEdit(jobId);

        document.getElementById('editScheduleDayLabel').value = entry.date || '';
        document.getElementById('esTime').value = entry.time || '';
        document.getElementById('esNote').value = entry.note || '';

            </label>`).join('');

    async function removeScheduleDay(jobId, date) {
        if (!confirm(t('confirmRemoveDay'))) return;
        const idx = savedJobs.findIndex(j => j.id === jobId);
        if (idx === -1) return;
        const entries = getScheduleEntries(savedJobs[idx]).filter(e => e.date !== date);
        savedJobs[idx].dailySchedule = entries;
        savedJobs[idx].lastEditedBy = currentUserEmail;
        try {
            await saveSavedJobsData();
            logActivity('edit', savedJobs[idx].clientName, t('activityRemovedDay') + ' ' + date);
        } catch (e) { alert(t('alertJobSaveFailed')); return; }
        closeEditScheduleModal();
        renderWeeklyBoard();
        refreshGuideIfOpen();
    }

    async function saveEditSchedule() {
        const idx = savedJobs.findIndex(j => j.id === editScheduleJobId);
        if (idx === -1) return false;
        const newDate = document.getElementById('editScheduleDayLabel').value;
        const newTime = document.getElementById('esTime').value;
        const newNote = document.getElementById('esNote').value.trim();
        const newTeam = Array.from(document.querySelectorAll('.es-team-check:checked')).map(cb => cb.value);

        // Drop the entry being edited, then add it back at (possibly) its new date —
        // this both handles "just changed the time/team" and "moved this day elsewhere"
        // without ever touching this job's OTHER scheduled days.
        const backup = JSON.parse(JSON.stringify(savedJobs[idx]));
        const original = getScheduleEntries(savedJobs[idx]).find(e => e.date === editScheduleOrigDate) || {};
        const entries = getScheduleEntries(savedJobs[idx]).filter(e => e.date !== editScheduleOrigDate);
        entries.push({ ...original, date: newDate, time: newTime, team: newTeam, note: newNote, dayOrder: 0 });
        savedJobs[idx].dailySchedule = entries;
        savedJobs[idx].lastEditedBy = currentUserEmail;
        try {
            await saveSavedJobsData();
            logActivity('edit', savedJobs[idx].clientName, t('activityScheduleUpdated') + ` ${newDate} ${newTime} (${newTeam.join(', ')})`);
        } catch (e) { savedJobs[idx] = backup; alert(t('alertJobSaveFailed')); return false; }
        closeEditScheduleModal();
        renderWeeklyBoard();
        refreshGuideIfOpen();
        return true;
    }

    // Fills a visit's note from the job's own Scope of Work — the person can still edit or clear it afterwards.
    // 'qs' = Quick Schedule (job picked from the dropdown); 'es' = the day editor (job already known).
    function useJobScopeFor(which) {
        let job = null;
        if (which === 'qs') {
            if (quickScheduleMode !== 'existing') { alert(t('alertPickJobFirst')); return; }
            job = savedJobs.find(j => j.id === document.getElementById('qsExistingJobSelect').value);
        } else {
            job = savedJobs.find(j => j.id === editScheduleJobId);
        }
        if (!job) { alert(t('alertPickJobFirst')); return; }
        if (!job.clientDescription) { alert(t('alertJobHasNoScope')); return; }
        document.getElementById(which === 'qs' ? 'qsNote' : 'esNote').value = job.clientDescription;
        // Copying the scope into the day editor is a change like any other, so the unsaved-changes check (which compares values) still catches it.
    }

    async function saveQuickSchedule() {
        const pickedDate = document.getElementById('qsDateInput').value;
        if (!pickedDate) { alert(t('alertPickDate')); return; }
        quickScheduleDay = pickedDate;
        const time = document.getElementById('qsTime').value;
        const note = document.getElementById('qsNote').value.trim();
        const team = Array.from(document.querySelectorAll('.qs-team-check:checked')).map(cb => cb.value);

        if (quickScheduleMode === 'new') {
            const clientName = document.getElementById('qsClientName').value.trim();
            if (!clientName) { alert(t('alertClientNameRequired')); return; }
            const newJob = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                clientName,
                clientPhone: '',
                jobStatus: 'شغال',
                clientAddress: document.getElementById('qsClientAddress').value.trim(),
                clientDescription: '',
                startDate: quickScheduleDay,
                endDate: quickScheduleDay,
                dailySchedule: [{ date: quickScheduleDay, time, team, note, dayOrder: 0 }],
                totalRevenue: 0, amountReceived: 0, amountRemaining: 0,
                followUpDate: '', materialCost: 0, extraExpenses: 0,
                expenseItems: [], technicians: [],
                createdBy: currentUserEmail, lastEditedBy: currentUserEmail
            };
            savedJobs.unshift(newJob);
            try {
                await saveSavedJobsData();
                logActivity('add', clientName);
            } catch (err) { alert(t('alertJobSaveFailed')); return; }
        } else {
            const jobId = document.getElementById('qsExistingJobSelect').value;
            if (!jobId) { return; }
            const idx = savedJobs.findIndex(j => j.id === jobId);
            if (idx === -1) return;
            // Adds/updates just THIS day's entry — a job already scheduled on other days
            // (maybe with a different tech) keeps those days untouched. The job's official
            // record date (startDate, used in Log & Reports) is never touched either.
            upsertScheduleEntry(savedJobs[idx], quickScheduleDay, time, team, note);
            savedJobs[idx].lastEditedBy = currentUserEmail;
            try {
                await saveSavedJobsData();
                logActivity('edit', savedJobs[idx].clientName, t('activityScheduleUpdated') + ` ${quickScheduleDay} ${time} (${team.join(', ')})`);
            } catch (err) { alert(t('alertJobSaveFailed')); return; }
        }

        closeQuickScheduleModal();
        refreshAllViews();
        renderWeeklyBoard();
    }
