    // Adds a new materials purchase onto the running total instead of making the user

    // Asks for the Gemini API key once (via a simple native prompt — no file editing
    // needed) and remembers it on this device from then on.
    function getGeminiApiKey() {
        let key = null;
        try { key = localStorage.getItem('geminiApiKey'); } catch (e) {}
        if (!key) {
            const entered = prompt(t('promptEnterGeminiKey'));

    // The SDK module and client are fetched/built once and reused — re-importing the
    // whole package from the CDN on every single AI call was the main source of the
    // slowdown the user noticed.
    let cachedGenAIClient = null;
    let cachedGenAIClientKey = null;

    // Photos for the job/appointment currently open in the form — populated when

    let currentJobPhotos = [];

    let currentQuotePhotos = [];

    // Resizes/compresses an image client-side before it's stored — since there's no
    // Firebase Storage set up, photos live as base64 inside the record itself, so
    // keeping each one small (under ~150KB) matters for Firestore's document size limit.
    function compressImageToBase64(file, maxDim = 900, quality = 0.6) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                        else { width = Math.round(width * maxDim / height); height = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function getGenAIClient(apiKey) {
        if (cachedGenAIClient && cachedGenAIClientKey === apiKey) return cachedGenAIClient;
        const { GoogleGenAI } = await import('https://esm.sh/@google/genai');
        cachedGenAIClient = new GoogleGenAI({ apiKey });
        cachedGenAIClientKey = apiKey;
        return cachedGenAIClient;
    }

    // Google's newer "Authorization Key" format (starts with "AQ.") is sent as a Bearer
    // token, not the old ?key= / x-goog-api-key style used by legacy "AIza..." keys.
    // Records a quick voice note and drops the transcript into Scope of Work, then
    // automatically runs it through the AI cleanup — handy while out on-site.
    // Crafts a polite, situation-appropriate payment reminder (tone shifts with how
    // overdue it is) and opens WhatsApp with it ready to send to the client.
    // ---------- AI calls: never hang silently ----------
    const GEMINI_MODEL = 'gemini-3.6-flash';
    let AI_TIMEOUT_MS = 45000;

    function withTimeout(promise, ms, stageKey) {
        let timer;
        const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(`[${t(stageKey)}] ${t('aiTimeoutMsg')}`)), ms); });
        return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }
    // The model API occasionally answers with a transient "high demand" / 503 (UNAVAILABLE)
    // or 429 (rate-limited) error that usually clears within a couple of seconds on its own —
    // so those (and only those — never an auth/bad-request error) are worth a couple of quick
    // retries before bothering the user with an error popup.
    function isRetryableAiError(e) {
        const msg = (e && e.message) ? e.message : String(e);
        return /\b503\b|UNAVAILABLE|\b429\b|RESOURCE_EXHAUSTED|overloaded|high demand/i.test(msg);
    }
    function aiSleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // One place that talks to the AI. If it fails or takes too long, the error says WHICH step (loading the library, or the model's answer).
    async function aiGenerate(apiKey, contents) {
        const fail = (e, stageKey) => { const m = (e && e.message) ? e.message : String(e); return new Error(m.startsWith('[') ? m : `[${t(stageKey)}] ${m}`); };
        let ai;
        try { ai = await withTimeout(getGenAIClient(apiKey), AI_TIMEOUT_MS, 'aiStageSdk'); } catch (e) { throw fail(e, 'aiStageSdk'); }

        const MAX_ATTEMPTS = 3; // 1 try + up to 2 retries
        let response, lastErr;
        for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
            try {
                response = await withTimeout(ai.models.generateContent({ model: GEMINI_MODEL, contents }), AI_TIMEOUT_MS, 'aiStageModel');
                lastErr = null;
                break;
            } catch (e) {
                lastErr = e;
                if (attempt < MAX_ATTEMPTS && isRetryableAiError(e)) { await aiSleep(attempt * 1200); continue; }
                break;
            }
        }
        if (lastErr) throw fail(lastErr, 'aiStageModel');
        const text = response && response.text;
        if (!text) throw new Error(`[${t('aiStageModel')}] ${t('aiEmptyMsg')}`);
        return text.trim();
    }

    // ---------- AI payment reminder: a window that shows progress, the message (editable) and the send buttons ----------

    function followUpReasonContext(appt, lang) {

            other: { ar: note || 'محتاجين نتابع معاه', en: note || 'we need to follow up with them' }
        };

    function buildFollowUpPrompt(appt, lang, customInstructions) {

    // Quote message: tells the client the total price (and, if a breakdown was built, lists

    function buildQuotePrompt(appt, lang, customInstructions) {
        const extra = (customInstructions || '').trim();
        const price = parseVal(appt.quotedPrice).toFixed(2);
        const items = appt.quoteItems || [];
        const itemsLine = items.length
            ? (lang === 'ar' ? ` التفاصيل: ${items.map(it => `${it.desc} ($${parseVal(it.amount).toFixed(2)})`).join('، ')}.` : ` Breakdown: ${items.map(it => `${it.desc} ($${parseVal(it.amount).toFixed(2)})`).join(', ')}.`)
            : '';

    async function regenerateAiReminder() {
        const c = aiReminderCtx;
        if (!c) return;
        if (!c.apiKey) { c.apiKey = getGeminiApiKey(); if (!c.apiKey) { useTemplateReminder('aiNoKeyNote'); return; } }
        c.mode = 'ai';
        const myRun = ++c.run;
        setAiReminderStatus('busy', t('aiWriting'));
        refreshAiReminderButtons(true);
        try {
            const lang = document.getElementById('aiReminderLang').value;
            const customInstructions = document.getElementById('aiCustomInstructions').value;
            const prompt = c.msgKind === 'thankyou' ? buildThankYouPrompt(c.job, lang, customInstructions)
                : c.msgKind === 'followup' ? buildFollowUpPrompt(c.job, lang, customInstructions)
                : c.msgKind === 'quote' ? buildQuotePrompt(c.job, lang, customInstructions)
                : buildReminderPrompt(c.job, c.rem, c.daysOverdue, lang, customInstructions);
            const text = await aiGenerate(c.apiKey, prompt);
            if (myRun !== c.run || aiReminderCtx !== c) return;   // closed, or a newer request took over
            document.getElementById('aiReminderText').value = text;
            setAiReminderStatus('ok', t('aiReady'));
        } catch (err) {
            if (myRun !== c.run || aiReminderCtx !== c) return;
            const msg = (err && err.message) ? err.message : String(err);
            if (/401|403|UNAUTHENTICATED|PERMISSION|API key/i.test(msg)) { try { localStorage.removeItem('geminiApiKey'); } catch (e) {} c.apiKey = null; }
            setAiReminderStatus('error', t('alertAiFailed') + ' (' + msg + ')');
        }
        refreshAiReminderButtons(false);
    }

    function useTemplateReminder(noteKey) {
        const c = aiReminderCtx;

        const lang = document.getElementById('aiReminderLang').value;
        document.getElementById('aiReminderText').value = c.msgKind === 'thankyou' ? buildFallbackThankYou(c.job, lang)

    // Safety net on top of the prompt instructions below: the destination for all AI text in this
    // file is a plain <textarea>, which can't render Markdown/HTML. If the model still returns a
    // Markdown table or stray <br>/HTML tags, clean it up into plain readable lines instead of
    // showing the raw syntax to the user.
    function sanitizeAiPlainText(text) {
        if (!text) return '';
        let s = String(text).replace(/\r\n/g, '\n');
        s = s.replace(/<br\s*\/?>/gi, ' ');          // stray <br> -> a space (keeps a table row on one line)
        s = s.replace(/\*\*(.+?)\*\*/g, '$1');        // drop stray **bold** markers left inside table cells
        s = s.replace(/<\/?[a-zA-Z][^>]*>/g, '');     // strip any other stray HTML tags
        s = s.split('\n').map(line => {
            const trimmed = line.trim();
            if (/^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(trimmed)) return ''; // markdown table separator row (|---|---|)
            if (trimmed.startsWith('|') && trimmed.endsWith('|') && trimmed.length > 1) {
                // markdown table row -> a single readable line with its cells joined
                const cells = trimmed.slice(1, -1).split('|').map(c => c.trim()).filter(Boolean);
                return cells.length ? '- ' + cells.join(' — ') : '';
            }
            return line;
        }).filter(line => line.trim() !== '').join('\n');
        s = s.replace(/\n{3,}/g, '\n\n');
        return s.trim();
    }

    // ---------- Dated ledgers: client payments + material invoices (per job) ----------
    // The job keeps its familiar TOTALS (amountReceived / materialCost) so every existing screen and
    // formula is untouched. On top of that each job now keeps dated entries. Whatever part of a total
    // has no entry yet is "undated" (all old data starts that way): it still counts in the totals,
    // but it can't be placed in any week until you give it a date.
    function ledgerArr(kind) { return kind === 'receipt' ? currentReceipts : currentMaterialEntries; }
    function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
    function ledgerSum(arr) { return round2((arr || []).reduce((s, e) => s + parseVal(e.amount), 0)); }
    // total - dated entries. Positive = still undated. Negative = the entries add up to more than the total (a mistake to fix).
    function undatedAmount(total, arr) { return round2(parseVal(total) - ledgerSum(arr)); }
    function newLedgerId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function escHtml(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // The invoice's "Scope" line shows the job's own "Scope of Work" text as-is — and that text
    // is often pasted/dictated with markdown-style bullets ("* point one * point two...") that
    // may have no real line breaks at all, which used to render as one unreadable wall of text.
    // This turns it into a real bulleted list whenever it looks like it has bullet points (an
    // actual newline, or a "*"/"-"/"•" marker), and leaves plain short text untouched. "**bold**"
    // segments become <b>bold</b> either way.
    function formatScopeHtml(text) {
        if (!text) return '';
        let t = escHtml(String(text).replace(/\r\n/g, '\n'));
        t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); // **bold** -> <b>bold</b>, before bullets are split out
        const points = [];
        t.split('\n').forEach(line => {
            const parts = line.split(/(?:^|\s)[\*\-•]\s+/).map(p => p.trim()).filter(Boolean);
            if (parts.length > 1) points.push(...parts);
            else if (line.trim()) points.push(line.trim());
        });
        if (points.length <= 1) return (points[0] || '').replace(/\n/g, '<br>');
        return '<ul style="margin:4px 0 0 18px; padding:0;">' + points.map(p => `<li style="margin-bottom:3px;">${p}</li>`).join('') + '</ul>';
    }

    function renderLedger(kind) {

        if (!box) return;
        const entries = ledgerArr(kind).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const undated = undatedAmount(document.getElementById(cfg.totalId).value, entries);
        if (entries.length === 0 && Math.abs(undated) < 0.005) { box.innerHTML = ''; return; }

        let html = '<div class="ledger-box">';
        if (entries.length > 0) {
            html += `<div class="ledger-title">${t(cfg.titleKey)}</div>`;
            entries.forEach(e => {
                const invoiceThumb = e.photoIsPdf
                    ? `<span onclick="viewInvoicePhoto('${kind}', '${e.id}')" title="${t('viewInvoiceBtn')}" style="width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:#f87171; border-radius:6px; cursor:pointer; border:1px solid var(--border-color); background:#1a1a1a;">PDF</span>`
                    : `<img src="${e.photo}" onclick="viewInvoicePhoto('${kind}', '${e.id}')" title="${t('viewInvoiceBtn')}" style="width:28px; height:28px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--border-color);">`;
                const photoHtml = !cfg.hasPhotoAttach ? '' : (e.photo
                    ? `${invoiceThumb}<button type="button" class="ledger-del" title="${t('removeInvoiceBtn')}" onclick="removeInvoicePhoto('${kind}', '${e.id}')">✕📎</button>`
                    : `<button type="button" class="secondary" title="${t('attachInvoiceBtn')}" onclick="triggerInvoicePhotoUpload('${kind}', '${e.id}')" style="padding:4px 8px; font-size:0.78rem;">📎</button>`);
                html += `<div class="ledger-row">
                    <input type="date" value="${escHtml(e.date)}" onchange="setLedgerEntryDate('${kind}', '${e.id}', this.value)">
                    <strong style="color:${cfg.color};">$${parseVal(e.amount).toFixed(2)}</strong>
                    <span class="ledger-note">${escHtml(e.note)}</span>
                    ${photoHtml}
                    <button type="button" class="ledger-del" onclick="removeLedgerEntry('${kind}', '${e.id}')">🗑</button>
                </div>`;
            });
        }
        if (undated > 0.005) {
            html += `<div class="ledger-undated">
                <div>⚠️ ${t('undatedLabel')}: <strong dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$${undated.toFixed(2)}</strong></div>
                <div class="ledger-hint">${t(cfg.hintKey)}</div>
                <div class="ledger-add-row">
                    <div class="lg-field lg-amt"><span>${t('lblAmountShort')}</span><input type="text" id="undated_${kind}_amt" inputmode="decimal" value="${undated.toFixed(2)}" onfocus="this.select()"></div>
                    <div class="lg-field lg-date"><span>${t(cfg.dateLbl)}</span><input type="date" id="undated_${kind}_date"></div>
                    <button type="button" class="secondary" style="height:40px;" onclick="dateUndated('${kind}')">${t('dateItBtn')}</button>
                </div>
            </div>`;
        } else if (undated < -0.005) {
            html += `<div class="ledger-warn">⛔ ${t('datedExceedsTotal')} <span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$${Math.abs(undated).toFixed(2)}</span></div>`;
        }
        html += '</div>';
        box.innerHTML = html;
    }

    // Records a NEW amount: adds it to the job's total AND keeps it as a dated entry.
    function addLedgerEntry(kind) {
        const cfg = LEDGERS[kind];
        const amtEl = document.getElementById(cfg.amtId), dateEl = document.getElementById(cfg.dateId), noteEl = document.getElementById(cfg.noteId);
        const amt = round2(parseVal(amtEl.value));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!dateEl.value) { alert(t('alertPickDate')); return; }
        ledgerArr(kind).push({ id: newLedgerId(), date: dateEl.value, amount: amt, note: noteEl.value.trim() });
        const totalEl = document.getElementById(cfg.totalId);
        totalEl.value = round2(parseVal(totalEl.value) + amt).toFixed(2);
        amtEl.value = ''; noteEl.value = '';
        calculateRemaining(); calculate(); renderLedgers(); updateSplitRatioTotal();
    }
    function addReceipt() { addLedgerEntry('receipt'); }
    function addToMaterialCost() { addLedgerEntry('material'); }

    // Deleting an entry also takes its amount out of the total (it was a mistaken entry).
    function removeLedgerEntry(kind, id) {
        const cfg = LEDGERS[kind];
        const arr = ledgerArr(kind);
        const idx = arr.findIndex(e => e.id === id);
        if (idx === -1) return;
        if (!confirm(t(cfg.delKey))) return;
        const totalEl = document.getElementById(cfg.totalId);
        totalEl.value = Math.max(0, round2(parseVal(totalEl.value) - parseVal(arr[idx].amount))).toFixed(2);
        arr.splice(idx, 1);
        calculateRemaining(); calculate(); renderLedgers(); updateSplitRatioTotal();
    }

    function setLedgerEntryDate(kind, id, value) {
        const e = ledgerArr(kind).find(x => x.id === id);
        if (!e) return;
        e.date = value;
        renderLedger(kind);
    }

    // Gives a date to (part of) the OLD undated amount. The job's total does not change.
    function dateUndated(kind) {
        const cfg = LEDGERS[kind];
        const amt = round2(parseVal(document.getElementById(`undated_${kind}_amt`).value));
        const date = document.getElementById(`undated_${kind}_date`).value;
        const undated = undatedAmount(document.getElementById(cfg.totalId).value, ledgerArr(kind));
        if (amt <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }
        if (!date) { alert(t('alertPickDate')); return; }
        if (amt > undated + 0.005) { alert(t('alertExceedsUndated') + ` ($${undated.toFixed(2)})`); return; }
        ledgerArr(kind).push({ id: newLedgerId(), date, amount: amt, note: '' });
        renderLedger(kind);
    }

    // Attach a photo OR a PDF of the actual invoice/receipt to one dated ledger entry — stored the
    // same way job/appointment photos already are (base64, right inside the record itself, since
    // there's no Firebase Storage set up). Images get compressed first (they're the common case and
    // compress well); a PDF is kept as-is (can't be resized the same way) but is capped in size so one
    // invoice can't blow past Firestore's 1MB-per-document limit on its own.
    const INVOICE_PDF_MAX_BYTES = 700 * 1024;
    let pendingInvoicePhotoTarget = null;
    function triggerInvoicePhotoUpload(kind, id) {
        pendingInvoicePhotoTarget = { kind, id };
        document.getElementById('materialInvoicePhotoInput').click();
    }
    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
    async function onInvoicePhotoSelected(event) {
        const file = event.target.files && event.target.files[0];
        const target = pendingInvoicePhotoTarget;
        pendingInvoicePhotoTarget = null;
        event.target.value = '';
        if (!file || !target) return;
        const e = ledgerArr(target.kind).find(x => x.id === target.id);
        if (!e) return;
        try {
            const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
            if (isPdf) {
                if (file.size > INVOICE_PDF_MAX_BYTES) { alert(t('alertPdfTooBig')); return; }
                e.photo = await readFileAsDataURL(file);
                e.photoIsPdf = true;
            } else {
                e.photo = await compressImageToBase64(file);
                e.photoIsPdf = false;
            }
            renderLedger(target.kind);
        } catch (err) { alert(t('alertPhotoFailed')); }
    }
    function viewInvoicePhoto(kind, id) {
        const e = ledgerArr(kind).find(x => x.id === id);
        if (!e || !e.photo) return;
        if (e.photoIsPdf) { window.open(e.photo, '_blank'); return; }
        const win = window.open('');
        // A close (×) button in the corner — this tab has no browser chrome of its own on most
        // phones, so without it there was no way back except the phone's own back gesture.
        if (win) win.document.write(`<body style="margin:0; background:#000;">
            <button onclick="window.close()" style="position:fixed; top:10px; inset-inline-end:10px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.9); color:#000; border:none; font-size:1.2rem; font-weight:700; cursor:pointer; z-index:10;">×</button>
            <img src="${e.photo}" style="max-width:100%; display:block; margin:0 auto;">

    function removeInvoicePhoto(kind, id) {

    }

    function validateJobBeforeSave(jobData, techs, expenses) {
        const errors = [];
        if (parseVal(jobData.totalRevenue) < 0) errors.push(t('errNegRevenue'));
        if (parseVal(jobData.amountReceived) < 0) errors.push(t('errNegReceived'));
        if (parseVal(jobData.materialCost) < 0) errors.push(t('errNegMaterial'));
        if (undatedAmount(jobData.amountReceived, jobData.receipts) < -0.005) errors.push(t('errDatedReceiptsExceed'));
        if (undatedAmount(jobData.materialCost, jobData.materialEntries) < -0.005) errors.push(t('errDatedMaterialsExceed'));

        techs.forEach((tech, i) => {
            const label = `${t('errRowLabel')} ${i + 1} (${tech.name || t('techSelectPlaceholder')})`;
            if (parseVal(tech.rate) < 0) errors.push(`${t('errNegRate')} — ${label}`);
            if (parseVal(tech.days) < 0) errors.push(`${t('errNegDays')} — ${label}`);
            if (tech.type === 'نسبة مخصصة') {
                const p = parseVal(tech.customPercent);
                if (p < 0 || p > 100) errors.push(`${t('errPercentRange')} — ${label}`);
            }
        });

        expenses.forEach((exp, i) => {
            if (parseVal(exp.amount) < 0) errors.push(`${t('errNegExpense')} — ${t('errRowLabel')} ${i + 1} (${expenseCatLabel(exp.category)})`);
        });

        const rS = parseVal(jobData.splitRatio && jobData.splitRatio.s);
        const rM = parseVal(jobData.splitRatio && jobData.splitRatio.m);
        const rC = parseVal(jobData.splitRatio && jobData.splitRatio.company);
        const extras = jobData.extraPartners || [];
        const extraSum = extras.reduce((s, p) => s + parseVal(p.percent), 0);
        let anyNegExtra = false, anyUnnamedExtra = false;
        extras.forEach(p => { if (parseVal(p.percent) < 0) anyNegExtra = true; if (parseVal(p.percent) > 0.005 && !String(p.name || '').trim()) anyUnnamedExtra = true; });
        if (rS < 0 || rM < 0 || rC < 0 || anyNegExtra) errors.push(t('errNegSplitRatio'));
        else if (Math.abs(rS + rM + rC + extraSum - 100) > 0.01) errors.push(t('errSplitRatioSum').replace('{total}', round2(rS + rM + rC + extraSum)));
        if (anyUnnamedExtra) errors.push(t('errUnnamedPartner'));

        return errors;
    }

    async function saveJob() {
        const editingId = document.getElementById('editingJobId').value;
        const clientName = document.getElementById('clientName').value.trim();
        if (!clientName) { alert(t('alertClientNameRequired')); return; }

        // Closed-books protection: block the save if either this job's new date, or (when
        // editing) its ORIGINAL date, falls inside a locked period — covers both "editing a job
        // that's already in a locked period" and "moving a job's date into one".
        const newStartDate = document.getElementById('startDate').value;
        const existingJobForLock = editingId ? savedJobs.find(j => j.id === editingId) : null;
        const lockHit = lockedPeriodFor(newStartDate) || (existingJobForLock ? lockedPeriodFor(existingJobForLock.startDate) : null);
        if (lockHit) { alert(t('alertPeriodLockedSave').replace('{from}', lockHit.dateFrom).replace('{to}', lockHit.dateTo)); return; }

        const jobData = {
            id: editingId ? editingId : Date.now().toString() + Math.random().toString(36).substr(2, 5),
            clientName,
            clientPhone: document.getElementById('clientPhone').value.trim(),
            tenantName: document.getElementById('tenantName').value.trim(),
            tenantPhone: document.getElementById('tenantPhone').value.trim(),
            clientEmail: document.getElementById('clientEmail').value.trim(),
            jobStatus: document.getElementById('jobStatus').value,
            clientAddress: document.getElementById('clientAddress').value.trim(),
            clientDescription: document.getElementById('clientDescription').value.trim(),
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            scheduledTime: document.getElementById('scheduledTime').value,
            totalRevenue: parseVal(document.getElementById('totalRevenue').value),
            amountReceived: parseVal(document.getElementById('amountReceived').value),
            amountRemaining: parseVal(document.getElementById('amountRemaining').value),
            followUpDate: document.getElementById('followUpDate').value,
            materialCost: parseVal(document.getElementById('materialCost').value),
            extraExpenses: parseVal(document.getElementById('extraExpenses').value),
            expenseItems: JSON.parse(JSON.stringify(expenseItems)),
            technicians: JSON.parse(JSON.stringify(technicians)),
            photos: JSON.parse(JSON.stringify(currentJobPhotos)),
            receipts: JSON.parse(JSON.stringify(currentReceipts)),
            materialEntries: JSON.parse(JSON.stringify(currentMaterialEntries)),
            splitRatio: { s: parseVal(document.getElementById('splitRatioS').value), m: parseVal(document.getElementById('splitRatioM').value), company: parseVal(document.getElementById('splitRatioCompany').value) },
            extraPartners: JSON.parse(JSON.stringify(profitPartners)),
            createdBy: currentUserEmail,
            lastEditedBy: currentUserEmail
        };

        const validationErrors = validateJobBeforeSave(jobData, technicians, expenseItems);
        if (validationErrors.length > 0) {
            alert(t('validationErrorsTitle') + '\n\n' + validationErrors.map(e => '• ' + e).join('\n'));
            return;
        }
        if (parseVal(jobData.amountReceived) > parseVal(jobData.totalRevenue) && parseVal(jobData.totalRevenue) > 0) {
            if (!confirm(t('confirmOverpayment'))) { showToast(t('saveCancelledMsg')); return; }
        }

        // Photos and any receipt/material-entry PDF go to their own per-job document, not into
        // the shared savedJobs document — see splitJobAttachments() above.
        const { slimJob, attachments, hasAttachments } = splitJobAttachments(jobData);

        let oldJobSnapshot = null;
        if (editingId) {
            const index = savedJobs.findIndex(j => j.id === editingId);
            if (index !== -1) {
                oldJobSnapshot = JSON.parse(JSON.stringify(savedJobs[index]));
                slimJob.createdBy = savedJobs[index].createdBy || currentUserEmail;
                if (savedJobs[index].assignedTeam !== undefined) slimJob.assignedTeam = savedJobs[index].assignedTeam;
                if (savedJobs[index].dayOrder !== undefined) slimJob.dayOrder = savedJobs[index].dayOrder;
                if (savedJobs[index].scheduledDate !== undefined) slimJob.scheduledDate = savedJobs[index].scheduledDate;
                if (savedJobs[index].dailySchedule !== undefined) slimJob.dailySchedule = savedJobs[index].dailySchedule;
                // The edit form has no fields for saved invoices — it only knows the core job
                // fields (name, amounts, technicians, etc). Rebuilding jobData from the form alone
                // and replacing the whole job object with it was silently dropping every invoice
                // ever saved for that job the moment ANY job field (like the amount) was edited.
                if (savedJobs[index].savedInvoices !== undefined) slimJob.savedInvoices = savedJobs[index].savedInvoices;
                savedJobs[index] = slimJob;
            }
        } else {
            savedJobs.unshift(slimJob);
        }

        try {
            await saveSavedJobsData();
            logActivity(editingId ? 'edit' : 'add', clientName, buildJobChangeSummary(oldJobSnapshot, jobData));
        } catch (err) {
            alertSaveError(err);
            return;
        }
        if (hasAttachments) {
            try { await saveJobAttachments(slimJob.id, attachments); }
            catch (err) { alert(t('alertAttachmentsSaveFailed')); }
        }
        resetForm();
        refreshAllViews();
        if (jobOverlayOpen) { closeJobOverlay(); showToast(t('toastJobSaved')); }
    }

    // Splits the (long) job form into 4 tabs purely visually — every field from every tab
    // stays in the DOM the whole time (just hidden via CSS), so none of the existing
    // calculation functions (calculate(), updateSplitRatioTotal(), renderTechnicians(), etc.)
    // had to change: they still read/write the same element ids regardless of which tab is
    // showing. Save and Cancel stay visible on every tab — this is a navigation aid, not a
    // strict wizard, so nothing blocks saving from tab 1.
    let currentJobStep = 1;
    const JOB_STEP_COUNT = 4;
    function goToJobStep(n) {
        n = Math.max(1, Math.min(JOB_STEP_COUNT, n));
        currentJobStep = n;
        for (let i = 1; i <= JOB_STEP_COUNT; i++) {
            const stepEl = document.getElementById('jobStep' + i);
            const tabEl = document.getElementById('jobStepTab' + i);
            if (stepEl) stepEl.classList.toggle('active', i === n);
            if (tabEl) tabEl.classList.toggle('active-tab', i === n);
        }
        const prevBtn = document.getElementById('jobStepPrevBtn');
        const nextBtn = document.getElementById('jobStepNextBtn');
        if (prevBtn) prevBtn.style.display = n === 1 ? 'none' : '';
        if (nextBtn) nextBtn.style.display = n === JOB_STEP_COUNT ? 'none' : '';
    }

    function resetForm() {
        jobFormDirty = false;
        clearJobDraft();
        goToJobStep(1);
        document.getElementById('editingJobId').value = '';
        document.getElementById('clientName').value = '';
        document.getElementById('clientPhone').value = '';
        document.getElementById('tenantName').value = '';
        document.getElementById('tenantPhone').value = '';

        document.getElementById('amountReceived').value = 0;

        document.getElementById('followUpDate').value = '';
        document.getElementById('materialCost').value = 0;
        document.getElementById('extraExpenses').value = 0;
        document.getElementById('splitRatioS').value = '40';
        document.getElementById('splitRatioM').value = '40';
        document.getElementById('splitRatioCompany').value = '20';
        // Clear every data array BEFORE any render call below — renderProfitPartners() and
        // renderTechnicians() both recompute the profit-split $ preview live, and that preview
        // reads the global `technicians`/`profitPartners` arrays directly. Rendering one before
        // the other is cleared meant the split preview briefly mixed the OLD job's technicians
        // with the ALREADY-reset (zeroed) amountReceived/materialCost fields — showing a bogus
        // negative split for an instant (e.g. the old techs' daily-allocated pay with nothing to
        // offset it, since day-allocated pay doesn't depend on amountReceived/materialCost at all).
        profitPartners = [];
        technicians = [];
        expenseItems = [];
        renderProfitPartners();
        document.getElementById('crmClientInfoBox').style.display = 'none';
        document.getElementById('clientAutocompleteList').style.display = 'none';
        document.getElementById('addressAutocompleteList').style.display = 'none';
        renderTechnicians();
        renderExpenseItems();
        currentJobPhotos = [];
        renderPhotoGallery(currentJobPhotos, 'jobPhotoGallery');
        currentReceipts = []; currentMaterialEntries = [];
        initLedgerDates(); renderLedgers();
        document.getElementById('jobScheduleSummaryCard').style.display = 'none';
        document.getElementById('formTitle').innerText = t('formTitleNew');
        document.getElementById('saveBtn').innerText = t('saveBtnNew');
        document.getElementById('cancelEditBtn').style.display = 'none';
        safeCall(renderMarginWarning);
    }

    // The whole job form's own live money picture, reused for the profit-split $ preview: what's left
    // after technicians and materials — same base used by jobNet() once the job is saved.
    function liveNetForSplit() {
        const received = parseVal(document.getElementById('amountReceived').value);
        const materials = parseVal(document.getElementById('materialCost').value);
        let techDues = 0;
        technicians.forEach(tech => { techDues += effectiveJobTechDue(tech, received, materials) + techReimbTotal(tech); });
        return round2(received - materials - techDues);
    }
    // A separate estimate from liveNetForSplit() above: that one tracks actual cash received (for
    // the S/M/company split preview), but the margin warning is about whether the JOB ITSELF is
    // worth it — so it's measured against the full contract value, as if it all gets collected,
    // not just what's been received so far (which is often still $0 on a brand-new job).
    function liveMarginEstimate() {
        const revenue = parseVal(document.getElementById('totalRevenue').value);
        const materials = parseVal(document.getElementById('materialCost').value);
        const expenses = parseVal(document.getElementById('extraExpenses').value);
        let techDues = 0;
        technicians.forEach(tech => { techDues += effectiveJobTechDue(tech, revenue, materials) + techReimbTotal(tech); });
        const net = round2(revenue - materials - techDues - expenses);
        const marginPct = revenue > 0.005 ? round2(net / revenue * 100) : null;
        // Still missing the two things most likely to move this number a lot — worth saying so,
        // since a brand-new job with nothing entered yet would otherwise show a falsely perfect 100%.
        const incomplete = technicians.length === 0 || materials < 0.005;
        return { revenue, net, marginPct, incomplete };
    }
    function renderMarginWarning() {
        const box = document.getElementById('jobMarginEstimateBox');
        if (!box) return;
        const { revenue, net, marginPct, incomplete } = liveMarginEstimate();
        if (revenue < 0.005 || marginPct === null) { box.style.display = 'none'; return; }
        const threshold = companyProfile.marginAlertThreshold;
        const hasThreshold = threshold !== null && threshold !== undefined && threshold !== '' && !isNaN(threshold);
        const isLow = hasThreshold && marginPct < parseVal(threshold);
        box.style.display = 'block';
        box.style.background = isLow ? 'rgba(248,113,113,0.12)' : 'rgba(52,211,153,0.08)';
        box.style.border = `1px solid ${isLow ? '#f87171' : '#34d399'}`;
        const lineColor = isLow ? '#f87171' : '#34d399';
        box.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                <span style="font-size:0.8rem; color:var(--text-muted);">${t('marginEstimateLabel')}</span>
                <strong style="font-size:1.05rem; color:${lineColor};">${marginPct}% <span style="font-size:0.78rem; color:var(--text-muted); font-weight:400;">($${net.toFixed(2)})</span></strong>
            </div>
            ${isLow ? `<div style="font-size:0.78rem; color:#f87171; margin-top:4px;">⚠️ ${t('marginBelowThresholdWarning').replace('{threshold}', threshold)}</div>` : ''}
            ${incomplete ? `<div style="font-size:0.74rem; color:var(--text-muted); margin-top:4px;">📝 ${t('marginEstimateIncompleteNote')}</div>` : ''}
        `;
    }
    function updateSplitRatioTotal() {
        const s = parseVal(document.getElementById('splitRatioS').value);
        const m = parseVal(document.getElementById('splitRatioM').value);
        const c = parseVal(document.getElementById('splitRatioCompany').value);
        const extraTotal = round2(profitPartners.reduce((sum, p) => sum + parseVal(p.percent), 0));
        const total = round2(s + m + c + extraTotal);
        const ok = Math.abs(total - 100) < 0.01;
        document.getElementById('splitRatioTotalDisplay').innerHTML =
            `${t('splitRatioTotalLabel')} <strong style="color:${ok ? '#34d399' : '#f87171'};">${total}%</strong>` + (ok ? '' : ` ⚠️ ${t('splitRatioMustBe100')}`);

        const net = liveNetForSplit();
        const expenses = parseVal(document.getElementById('extraExpenses').value);
        document.getElementById('splitRatioSDollar').textContent = '$' + round2(net * s / 100).toFixed(2);
        document.getElementById('splitRatioMDollar').textContent = '$' + round2(net * m / 100).toFixed(2);
        document.getElementById('splitRatioCompanyDollar').textContent = '$' + round2(net * c / 100 - expenses).toFixed(2);
        profitPartners.forEach((p, i) => {
            const el = document.querySelector(`.profit-partner-dollar[data-idx="${i}"]`);
            if (el) el.textContent = '$' + round2(net * parseVal(p.percent) / 100).toFixed(2);
        });
    }

    // ---------- Extra partners: per-job only (no aggregate account, no withdrawal tracking — those stay
    // exclusive to S and M) — an open-ended list, add as many as a job actually needs. ----------
    let profitPartners = [];
    function addProfitPartner(name = '', percent = 0) { profitPartners.push({ name, percent }); renderProfitPartners(); }
    function removeProfitPartner(index) { profitPartners.splice(index, 1); renderProfitPartners(); }
    function updateProfitPartner(index, field, value) { if (profitPartners[index]) profitPartners[index][field] = value; updateSplitRatioTotal(); }
    // Picking a saved technician name from the 👤 dropdown fills the free-text field with it.
    // (A plain <datalist> was tried first, but iOS Safari never shows datalist suggestions at
    // all, so on iPhone nothing ever appeared — a real native <select> works everywhere.)
    function pickProfitPartnerName(index, name) {
        if (!name || !profitPartners[index]) return;
        profitPartners[index].name = name;
        renderProfitPartners();
    }
    function renderProfitPartners() {
        const container = document.getElementById('profitPartnersContainer');
        if (profitPartners.length === 0) { container.innerHTML = ''; updateSplitRatioTotal(); return; }
        const registeredTechs = getUniqueRegisteredTechnicians();

            <div class="ledger-row">

                    <option value="">👤</option>

                <input type="text" value="${escHtml(p.name)}" placeholder="${t('profitPartnerNamePh')}" oninput="updateProfitPartner(${i}, 'name', this.value)" style="flex:2; min-width:90px;">
                <input type="text" inputmode="decimal" value="${escHtml(String(p.percent))}" oninput="updateProfitPartner(${i}, 'percent', this.value)" style="width:70px; text-align:center;">
                <span class="profit-partner-dollar" data-idx="${i}" style="min-width:80px; text-align:end; color:#34d399; font-weight:700; align-self:center;"></span>
                <button type="button" class="ledger-del" onclick="removeProfitPartner(${i})">🗑</button>
            </div>`).join('');
        updateSplitRatioTotal();
    }

    function jobRemaining(job) { return parseVal(job.totalRevenue) - parseVal(job.amountReceived); }

    // A one-tap snapshot of everything financial about a single job — what's left to
    // collect from the client, and what's still owed to each technician on it.
    function showJobQuickDetails(jobId) {
        const job = savedJobs.find(j => j.id === jobId);
        if (!job) return;
        const { net, shareS, shareM, companyNet, ratio, extraShares } = jobNet(job);
        const rem = jobRemaining(job);
        const expensesTotal = (job.expenseItems && job.expenseItems.length > 0)
            ? job.expenseItems.reduce((sum, e) => sum + parseVal(e.amount), 0)
            : parseVal(job.extraExpenses);

        let lines = [];
        lines.push(job.clientName || '');
        if (job.clientAddress) lines.push('📍 ' + job.clientAddress);
        if (job.tenantName || job.tenantPhone) lines.push('🏠 ' + t('lblTenantName').replace(':', '') + ' ' + [job.tenantName, job.tenantPhone].filter(Boolean).join(' — '));
        lines.push('─────────────────');
        lines.push(t('qdScopeOfWork'));
        lines.push(job.clientDescription ? job.clientDescription : ('(' + t('qdNoScopeSet') + ')'));
        lines.push('─────────────────');
        lines.push(`${t('qdTotalRevenue')} $${parseVal(job.totalRevenue).toFixed(2)}`);
        lines.push(`${t('qdReceived')} $${parseVal(job.amountReceived).toFixed(2)}`);
        lines.push(`${t('qdRemainingFromClient')} $${rem.toFixed(2)}`);
        lines.push(`${t('thMaterials')} $${parseVal(job.materialCost).toFixed(2)}`);
        lines.push(`${t('thExpenses')} $${expensesTotal.toFixed(2)}`);
        lines.push('');
        lines.push(t('qdTechBreakdown'));
        if ((job.technicians || []).length === 0) {
            lines.push('  ' + t('noTechsAdded'));
        } else {
            job.technicians.forEach(tech => {
                const wage = effectiveJobTechDue(tech, job.amountReceived, job.materialCost);
                const reimb = techReimbTotal(tech);
                lines.push(`  ${tech.name || '?'} — ${t('qdDues')} $${wage.toFixed(2)}` + (reimb > 0.005 ? ` + $${reimb.toFixed(2)} ${t('materialsShort')} = $${round2(wage + reimb).toFixed(2)}` : ''));
                (tech.weeks || []).slice().sort((a, b) => a.weekStart.localeCompare(b.weekStart)).forEach(w => lines.push(`      📆 ${w.weekStart} → ${addDaysISO(w.weekStart, 6)}: $${parseVal(w.amount).toFixed(2)}`));
                (tech.materialReimbursements || []).slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => lines.push(`      🧾 ${e.date}: $${parseVal(e.amount).toFixed(2)}${e.note ? ' - ' + e.note : ''}`));
            });
        }
        lines.push('');
        lines.push(`${t('thNet')} $${net.toFixed(2)}`);
        lines.push(`S (${Math.round(ratio.s * 100)}%): $${shareS.toFixed(2)}  |  M (${Math.round(ratio.m * 100)}%): $${shareM.toFixed(2)}  |  ${t('statShareCompany')} (${Math.round(ratio.company * 100)}%): $${companyNet.toFixed(2)}`);
        extraShares.filter(x => x.percent > 0.005).forEach(x => lines.push(`${x.name || '?'} (${Math.round(x.percent)}%): $${x.amount.toFixed(2)}`));
        alert(lines.join('\n'));
    }

    // The 40/40/20 split happens on the profit BEFORE company operating expenses (gas, coffee,
    // rent, etc.) — those are the company's own overhead, so they come out of the company's 20%
    // share only. S and M's shares are never reduced by the company's spending.
    // Every job carries its OWN split percentages (job.splitRatio = {s, m, company}), read fresh from
    // that job's own data every time — never a shared/global setting — so changing one job's split can
    // never affect another job's numbers. Falls back to the standard 40/40/20 for any job that has none
    // (every job saved before this feature existed, or one where the fields were simply left at default).
    function jobSplitRatio(job) {
        const r = job.splitRatio;
        const extraSum = (job.extraPartners || []).reduce((sum, p) => sum + parseVal(p.percent), 0);
        if (r) {
            const s = parseVal(r.s), m = parseVal(r.m), c = parseVal(r.company);
            if (s >= 0 && m >= 0 && c >= 0 && Math.abs(s + m + c + extraSum - 100) < 0.01) return { s: s / 100, m: m / 100, company: c / 100 };
        }
        return { s: 0.4, m: 0.4, company: 0.2 };
    }
    function jobNet(job) {
        let totalTechDues = 0;
        (job.technicians || []).forEach(tech => { totalTechDues += calculateJobTechDuesWithReimbursement(tech, job.amountReceived, job.materialCost); });
        const netForSplit = parseVal(job.amountReceived) - parseVal(job.materialCost) - totalTechDues;
        const ratio = jobSplitRatio(job);
        const shareS = netForSplit * ratio.s;
        const shareM = netForSplit * ratio.m;
        const expensesTotal = parseVal(job.extraExpenses);
        const companyGross = netForSplit * ratio.company;
        const companyNet = companyGross - expensesTotal;
        const extraShares = (job.extraPartners || []).map(p => ({ name: p.name || '', percent: parseVal(p.percent), amount: round2(netForSplit * parseVal(p.percent) / 100) }));
        const extraTotal = round2(extraShares.reduce((s, x) => s + x.amount, 0));
        const net = shareS + shareM + companyNet + extraTotal; // overall bottom line (= netForSplit - expensesTotal)
        return { totalTechDues, net, shareS, shareM, companyGross, companyNet, expensesTotal, ratio, extraShares, extraTotal };
    }

    let jobSortField = null;
    let jobSortDirection = 'asc';

    function sortTableBy(field) {
        if (jobSortField === field) { jobSortDirection = jobSortDirection === 'asc' ? 'desc' : 'asc'; }
        else { jobSortField = field; jobSortDirection = 'asc'; }
        renderJobsTable();
        updateSortIndicators();
    }

    function updateSortIndicators() {
        document.querySelectorAll('#jobsTableCard th[data-sort-field]').forEach(th => {
            const field = th.getAttribute('data-sort-field');
            const arrow = th.querySelector('.sort-arrow');
            if (!arrow) return;
            arrow.textContent = field === jobSortField ? (jobSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
        });
    }

    function getSortValue(job, field) {
        if (field === 'startDate') return job.startDate || '';
        if (field === 'totalRevenue') return parseVal(job.totalRevenue);
        if (field === 'remaining') return jobRemaining(job);
        if (field === 'net') return jobNet(job).net;
        if (field === 'shareS') return jobNet(job).shareS;
        if (field === 'shareM') return jobNet(job).shareM;
        if (field === 'companyNet') return jobNet(job).companyNet;
        return '';
    }

    function renderJobsTable() {
        const tbody = document.getElementById('jobsTableBody');

        }

        let jobsToRender = savedJobs;
        if (jobSortField) {
            jobsToRender = [...savedJobs].sort((a, b) => {

        // A cancelled job keeps all its data in the log, but always sinks to the bottom of the
        // list — under any sort column — so it never gets in the way of the active/done jobs.
        jobsToRender = [...jobsToRender].sort((a, b) => (a.jobStatus === 'ملغي' ? 1 : 0) - (b.jobStatus === 'ملغي' ? 1 : 0));

        jobsToRender.forEach(job => {

                techDetailsText += `• ${tech.name || 'Tech'} (${techTypeLabel(tech.type)}): ${t('techLineDue')}${totalDue}<br>`;

            const { net: netProfit, shareS, shareM, companyNet, ratio: rowRatio } = jobNet(job);
            const rev = parseVal(job.totalRevenue);
            const rec = parseVal(job.amountReceived);
            const rem = jobRemaining(job);
            const hasDebt = rem > 0;

            const tr = document.createElement('tr');

            const statusBadgeClass = job.jobStatus === 'خلص' ? 'completed' : (job.jobStatus === 'ملغي' ? 'cancelled' : 'active');
            tr.innerHTML = `
                <td data-label="" style="text-align: center;"><input type="checkbox" class="job-checkbox" value="${job.id}" ${selectedJobIds.has(String(job.id)) ? 'checked' : ''} onchange="toggleJobSelection('${job.id}', this)"></td>
                <td data-label="${t('thClient')}"><strong>${job.clientName}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${job.clientPhone ? `<a href="tel:${job.clientPhone.replace(/[^+\d]/g, '')}" style="color:#38bdf8; text-decoration:none;" onclick="event.stopPropagation();">📞 ${job.clientPhone}</a>` : ''}${job.clientPhone && job.clientAddress ? ' - ' : ''}${job.clientAddress ? `<a href="#" onclick="event.stopPropagation(); event.preventDefault(); showMapChoice('${job.clientAddress.replace(/'/g, "\\'")}');" style="color:#38bdf8; text-decoration:none;">📍 ${job.clientAddress}</a>` : ''}</span>${hasDebt ? '<br><span class="debt-alert-badge">' + t('debtBadgePrefix') + ' $' + rem.toFixed(2) + '</span> <button onclick="event.stopPropagation(); sendAiPaymentReminder(\'' + job.id + '\');" style="background:linear-gradient(135deg,#7c3aed,#38bdf8); color:#fff; border:none; border-radius:6px; padding:2px 8px; font-size:0.68rem; font-weight:700; cursor:pointer;">✨ ' + t('aiReminderBtn') + '</button>' : ''}${isOverdue ? '<br><span class="debt-alert-badge" style="background:rgba(217,119,6,0.2); color:#fbbf24; border-color:rgba(217,119,6,0.4);">🔔 ' + t('reminderOverdueSuffix') + '</span>' : ''}</td>
                <td data-label="${t('thDateStatus')}"><span class="badge ${statusBadgeClass}">${statusLabel(job.jobStatus)}</span><br><span style="font-size:0.75rem; color:var(--text-muted);">${job.startDate || ''}</span></td>

                <td data-label="${t('thShareM')}" style="color:#38bdf8;">$${shareM.toFixed(2)} <span style="color:var(--text-muted); font-size:0.72rem;">(${Math.round(rowRatio.m * 100)}%)</span></td>

                    <button class="secondary" onclick="showJobQuickDetails('${job.id}')" style="padding:4px 8px; font-size:0.75rem; background:#7c3aed;" title="${t('jobQuickDetailsBtn')}">ℹ️</button>
                    <button class="secondary" onclick="openInvoiceModal('${job.id}')" style="padding:4px 8px; font-size:0.75rem; background:#0ea5e9;" title="${t('invoiceBtn')}">🧾</button>
                    <button class="secondary" onclick="openJobPayModal('${job.id}')" style="padding:4px 8px; font-size:0.75rem; background:#16a34a;" title="${t('jobPayBtn')}">💰</button>

            tbody.appendChild(tr);

        filterJobs();
    }

    // Runs a view-refresh function in isolation: if one refresh step throws, it must not
    // block the others (this was the actual bug — one failing step was silently skipping
    // every refresh call listed after it, so some cards never updated).
    function safeCall(fn) { try { fn(); } catch (e) { console.error(e); } }

    // Formats a Date as YYYY-MM-DD using LOCAL calendar fields — never use toISOString()
    // for this, since it converts to UTC first and can silently shift the date by a day
    // depending on the device's timezone.
    function isoDate(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    function refreshGuideIfOpen() { if (document.getElementById('techGuideModal').style.display === 'flex') safeCall(renderTechGuideContent); }

    function refreshAllViews() {
        safeCall(renderJobsTable);
        safeCall(updateGlobalStats);
        safeCall(updateTechDropdownFilter);
        safeCall(updateSelectedStats);
        safeCall(renderTodayJobsBanner);
        if (document.getElementById('agendaModal').style.display === 'flex') safeCall(renderAgendaContent);
        refreshGuideIfOpen();
        if (document.getElementById('screenWeekly').style.display !== 'none') safeCall(renderWeeklyBoard);
    }

    function updateGlobalStats() {
        let totalJobsVal = 0, totalMatVal = 0, totalTechVal = 0, totalNetVal = 0, totalShareS = 0, totalShareM = 0, totalShareCompany = 0, totalExtraExp = 0, totalReceivedVal = 0;
        getFilteredJobs().forEach(job => {
            const { totalTechDues, net, shareS, shareM, companyNet } = jobNet(job);
            totalJobsVal += parseVal(job.totalRevenue); totalMatVal += parseVal(job.materialCost); totalTechVal += totalTechDues;
            totalNetVal += net; totalExtraExp += parseVal(job.extraExpenses);
            totalShareS += shareS; totalShareM += shareM; totalShareCompany += companyNet;
            totalReceivedVal += parseVal(job.amountReceived);
        });

        // General (non-job) company expenses logged within the same active date range,
        // so "what's actually left" reflects the whole picture for that period.
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        let generalExpensesInRange = 0;
        companyExpenses.forEach(e => {
            const d = e.date || '';
            if ((!dateFrom || (d && d >= dateFrom)) && (!dateTo || (d && d <= dateTo))) generalExpensesInRange += parseVal(e.amount);
        });
        // Same definition as the "Selected Jobs" card (received - materials - tech dues - job expenses),
        // plus the company's general (non-job) expenses that fall inside the active date range.
        const actualRemaining = totalReceivedVal - totalMatVal - totalTechVal - totalExtraExp - generalExpensesInRange;

        document.getElementById('statTotalJobs').innerText = '$' + totalJobsVal.toFixed(2);
        document.getElementById('statTotalMat').innerText = '$' + totalMatVal.toFixed(2);
        document.getElementById('statTotalTech').innerText = '$' + totalTechVal.toFixed(2);
        document.getElementById('statTotalNet').innerText = '$' + totalNetVal.toFixed(2);
        document.getElementById('statShareS').innerText = '$' + totalShareS.toFixed(2);
        document.getElementById('statShareM').innerText = '$' + totalShareM.toFixed(2);
        document.getElementById('statShareCompany').innerText = '$' + totalShareCompany.toFixed(2);

        if (lockHit) { alert(t('alertPeriodLockedDelete').replace('{from}', lockHit.dateFrom).replace('{to}', lockHit.dateTo)); return; }
        if (!confirm(t('confirmDeleteJob'))) return;

        logActivity('delete', deletedClientName);
        refreshAllViews();
        jobAttachmentsDocRef(id).delete().catch(() => {}); // best-effort; not critical if it fails

        // Closed-books protection: silently drop any selected job that falls in a locked period
        // instead of deleting it, and tell the user how many were skipped and why.
        const lockedCount = savedJobs.filter(j => selectedJobIds.has(String(j.id)) && isDateLocked(j.startDate)).length;

    // Builds and opens a print-ready report for a single technician: every job they
    // worked on, what they earned, what they were paid, and their running balance.
    async function printTechnicianReport(techName) {
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('p', 'mm', 'a4');
        doc.setFont("helvetica", "bold"); doc.setFontSize(15);
        doc.text("Technician Report:", 14, 15);
        const nameImg = textToImage(techName);
        const nameH = 7, nameW = nameH * nameImg.aspect;
        doc.addImage(nameImg.dataUrl, 'PNG', 62, 10, nameW, nameH);

        const dateFrom = document.getElementById('guideDateFrom').value;
        const dateTo = document.getElementById('guideDateTo').value;
        const hasDateFilter = !!(dateFrom || dateTo);

        // Make explicit that each job's Dues figure is calculated from the specific day(s) he
        // actually worked it (shown in the Date column below) — not the job's own start date.
        doc.setFont("helvetica", "italic"); doc.setFontSize(8.5); doc.setTextColor(90, 90, 90);
        doc.text("Dues per job are calculated only from the day(s) actually worked, shown below.", 14, 21);
        doc.setTextColor(0, 0, 0);

        const rows = [];
        let totalDues = 0, totalMaterials = 0, totalBonus = 0, totalPaid = 0;
        const techStats = computeTechPeriodStats(dateFrom, dateTo)[techName];
        if (techStats) {
            techStats.jobs.forEach(j => {
                // Materials he bought himself (to be reimbursed) get their own column — they used
                // to be silently folded into "Dues" (j.dues = wage + reimbSum), which made his pay
                // look bigger than it actually was. Wage is shown alone here; reimbursement is its
                // own number, in its own column, right next to it.
                const reimb = round2(j.reimbSum || 0);
                const wageOnly = round2(j.dues - reimb);
                totalDues += wageOnly;
                totalMaterials += reimb;

                // One row per actual day he worked — that's the thing that matters, not how
                // many days the job itself ran for. A typed week or a percentage job has no
                // day-level split to show, so those stay as one row.
                if (j.manual) {
                    rows.push({ date: j.weeks.map(w => w.weekStart).filter(Boolean).sort().join(', ') || (j.job.startDate || ''), client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: wageOnly, materials: null, paid: null, remaining: null });
                } else if (j.dailyManual) {
                    // Already one $ amount per actual day — each gets its own row as-is.
                    j.dailyEntries.forEach(e => {
                        rows.push({ date: e.date, client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: round2(parseVal(e.amount)), materials: null, paid: null, remaining: null });
                    });
                } else if (j.isPercentPeriod) {
                    rows.push({ date: j.job.startDate || '', client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: wageOnly, materials: null, paid: null, remaining: null });
                } else {
                    const datesInPeriod = (j.dates || []).filter(d => (!dateFrom || d >= dateFrom) && (!dateTo || d <= dateTo)).sort();
                    if (datesInPeriod.length === 0) {
                        rows.push({ date: j.job.startDate || '', client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: wageOnly, materials: null, paid: null, remaining: null });
                    } else {
                        splitAmountAcrossDates(wageOnly, datesInPeriod).forEach(r => {
                            rows.push({ date: r.date, client: j.job.clientName || '', type: techTypeLabel(j.tech.type), dues: r.amount, materials: null, paid: null, remaining: null });
                        });
                    }
                }
                // Materials he bought himself, each on its own actual purchase date — not folded
                // into any one wage day.
                (j.reimbEntries || []).forEach(e => {
                    rows.push({ date: e.date || '', client: 'Materials (' + (j.job.clientName || '') + ')', type: '-', dues: null, materials: round2(parseVal(e.amount)), paid: null, remaining: null });
                });
            });
        }
        // Bonuses (🎁) get their own rows too, clearly labeled as a bonus — kept separate from
        // "Dues" in the totals below so it reads as a reward, not pay for extra job work.
        techBonusesInPeriod(techName, dateFrom, dateTo)
            .slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''))
            .forEach(b => {
                const amt = parseVal(b.amount);
                totalBonus += amt;
                rows.push({ date: b.date || '', client: 'Bonus' + (b.jobClientName ? ' (' + b.jobClientName + ')' : '') + (b.note ? ' - ' + b.note : ''), type: '-', dues: amt, materials: null, paid: null, remaining: null });
            });
        // Payments come only from the 💵 button (same as the Guide), listed as their own rows.
        // Job rows show what was earned; payments are per technician, not per job, so the running
        // balance is given in the totals below the table instead of on each row.
        techPaymentsInPeriod(techName, dateFrom, dateTo)
            .slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''))
            .forEach(p => {
                const amt = parseVal(p.amount);
                totalPaid += amt;
                rows.push({ date: p.date || '', client: 'Payment' + (p.note ? ' - ' + p.note : ''), type: '-', dues: null, materials: null, paid: amt, remaining: null });
            });

        if (rows.length === 0) { alert(currentLang === 'ar' ? 'الفني ده لسه مالوش شغلانات مسجلة في الفترة دي.' : 'This technician has no recorded jobs in this period.'); return; }

        // Oldest to newest, across jobs/bonuses/payments together — not grouped by type. A job
        // row's date can be a comma-joined list of days (e.g. earlier worked, later worked); it
        // sorts by its first (earliest) date since the list itself is already built ascending.
        rows.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

        const headers = [["Date", "Client", "Pay Type", "Dues", "Materials", "Paid", "Remaining"]];
        const money = v => (v === null || v === undefined) ? '-' : '$' + v.toFixed(2);
        const data = rows.map(r => [r.date, r.client, r.type, money(r.dues), money(r.materials), money(r.paid), money(r.remaining)]);
        const TECH_REPORT_ARABIC_COLS = [1, 2]; // Client, Pay Type

        // Bonus (🎁) rows are highlighted and bolded throughout the table — same light-amber
        // background jsPDF-autoTable draws from styles.fillColor, plus a bold font, so a bonus
        // reads as a reward at a glance instead of blending into the regular job rows.
        const BONUS_HIGHLIGHT_RGB = [255, 243, 205];
        const BONUS_TEXT_RGB = [120, 90, 0];
        const isBonusRow = (rowRaw) => String((rowRaw && rowRaw[1]) ?? '').startsWith('Bonus');

        doc.autoTable({
            head: headers, body: data, startY: 27, theme: 'grid',
            styles: { fontSize: 9, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didParseCell: function(cellData) {
                if (cellData.section !== 'body') return;
                if (!isBonusRow(cellData.row.raw)) return;
                cellData.cell.styles.fontStyle = 'bold';
                cellData.cell.styles.fillColor = BONUS_HIGHLIGHT_RGB;
                cellData.cell.styles.textColor = BONUS_TEXT_RGB;
            },
            didDrawCell: function(cellData) {
                if (cellData.section !== 'body') return;
                if (!TECH_REPORT_ARABIC_COLS.includes(cellData.column.index)) return;
                const text = String(cellData.cell.raw ?? '');
                if (!text || !containsArabic(text)) return;
                const bonusRow = isBonusRow(cellData.row.raw);
                doc.setFillColor(...(bonusRow ? BONUS_HIGHLIGHT_RGB : [255, 255, 255]));
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
                doc.setDrawColor(200, 200, 200);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
                const img = textToImage(text);
                const padding = 1;
                let targetH = cellData.cell.height - padding * 2;
                let targetW = targetH * img.aspect;
                if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
                const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
                const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
                doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
            }
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(0, 0, 0);
        doc.text(`Basic Dues: $${totalDues.toFixed(2)}`, 14, finalY);
        let lineY = finalY + 7;
        if (totalMaterials > 0.005) { doc.text(`Materials: $${totalMaterials.toFixed(2)}`, 14, lineY); lineY += 7; }
        if (totalBonus > 0.005) {
            const bonusText = `Bonus: $${totalBonus.toFixed(2)}`;
            doc.setFont("helvetica", "bold");
            const tw = doc.getTextWidth(bonusText);
            doc.setFillColor(255, 243, 205);
            doc.rect(13, lineY - 4.5, tw + 4, 6, 'F');
            doc.setTextColor(120, 90, 0);
            doc.text(bonusText, 14, lineY);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "normal");
            lineY += 7;
        }
        doc.text(`Total Paid: $${totalPaid.toFixed(2)}`, 14, lineY);
        doc.setFont("helvetica", "bold");
        doc.text(`Remaining Balance: $${(totalDues + totalMaterials + totalBonus - totalPaid).toFixed(2)}`, 14, lineY + 7);

        addLogoWatermark(doc);
        doc.autoPrint();
        window.open(doc.output('bloburl'), '_blank');
    }

    async function importBackupJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                let addedJobs = 0, skippedJobs = 0, addedTechs = 0;

                if (Array.isArray(data.savedJobs)) {
                    const existingIds = new Set(savedJobs.map(j => j.id));
                    data.savedJobs.forEach(job => {
                        job.id = String(job.id);
                        if (existingIds.has(job.id)) { skippedJobs++; }
                        else { savedJobs.push(job); existingIds.add(job.id); addedJobs++; }
                    });
                }
                if (data.technicianPhones && typeof data.technicianPhones === 'object') {
                    Object.keys(data.technicianPhones).forEach(name => {
                        if (!(name in technicianPhones)) { technicianPhones[name] = data.technicianPhones[name]; addedTechs++; }
                    });
                }

                await saveSavedJobsData();
                await saveTechPhonesData();
                refreshAllViews();

                alert(`${t('alertImportSummaryPrefix')}\n${addedJobs} ${t('importJobsAdded')}\n${skippedJobs} ${t('importJobsSkipped')}\n${addedTechs} ${t('importTechsAdded')}`);
            } catch (err) {
                alert(t('alertImportFailed'));
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function containsArabic(text) { return /[\u0600-\u06FF]/.test(text || ''); }

    function textToImage(text) {
        const scale = 4;
        const fontPx = 34;
        const isArabic = containsArabic(text);
        const probe = document.createElement('canvas').getContext('2d');
        probe.font = `${fontPx * scale}px Cairo, Tahoma, Arial, sans-serif`;
        const textWidth = Math.max(probe.measureText(text || '').width, 1);

        const canvas = document.createElement('canvas');
        canvas.width = textWidth + 20 * scale;
        canvas.height = (fontPx + 14) * scale;
        const ctx = canvas.getContext('2d');
        ctx.font = `${fontPx * scale}px Cairo, Tahoma, Arial, sans-serif`;
        ctx.fillStyle = '#1a1a1a';
        ctx.textBaseline = 'middle';
        if (isArabic) { ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.fillText(text || '', canvas.width - 10 * scale, canvas.height / 2); }
        else { ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.fillText(text || '', 10 * scale, canvas.height / 2); }

        return { dataUrl: canvas.toDataURL('image/png'), aspect: canvas.width / canvas.height };
    }

    const PDF_ARABIC_COLS = [2, 3, 8]; // Customer, Address, Status

    async function buildJobsPdfDoc(jobsList) {
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF('l', 'mm', 'a4');
        doc.setFont("helvetica", "bold"); doc.setFontSize(16);
        doc.text(`${companyDisplayName()} - PM STATEMENT`, 14, 15);

        const headers = [["Jobs #", "Date", "Customer", "Address", "Contract", "Received", "Balance", "Materials", "Status", "Split (S/M/Co)", "Net Profit", "S Share", "M Share", "Company Net"]];
        const data = jobsList.map((job, index) => {
            const { net: netProfit, shareS, shareM, companyNet, ratio: pdfRatio } = jobNet(job);
            return [
                "#" + (index + 1), job.startDate || '', job.clientName || '', job.clientAddress || '',
                "$" + parseVal(job.totalRevenue).toFixed(2), "$" + parseVal(job.amountReceived).toFixed(2), "$" + jobRemaining(job).toFixed(2),
                "$" + parseVal(job.materialCost).toFixed(2), statusLabel(job.jobStatus),
                `${Math.round(pdfRatio.s * 100)}/${Math.round(pdfRatio.m * 100)}/${Math.round(pdfRatio.company * 100)}`,
                "$" + netProfit.toFixed(2), "$" + shareS.toFixed(2), "$" + shareM.toFixed(2), "$" + companyNet.toFixed(2)
            ];
        });

        doc.autoTable({
            head: headers, body: data, startY: 22, theme: 'grid',
            styles: { fontSize: 8, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [41, 128, 185], textColor: 255 },
            didDrawCell: function(cellData) {
                if (cellData.section !== 'body') return;
                if (!PDF_ARABIC_COLS.includes(cellData.column.index)) return;
                const text = String(cellData.cell.raw ?? '');
                if (!text || !containsArabic(text)) return;

                doc.setFillColor(255, 255, 255);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height, 'F');
                doc.setDrawColor(200, 200, 200);
                doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);

                const img = textToImage(text);
                const padding = 1;
                let targetH = cellData.cell.height - padding * 2;
                let targetW = targetH * img.aspect;
                if (targetW > cellData.cell.width - padding * 2) { targetW = cellData.cell.width - padding * 2; targetH = targetW / img.aspect; }
                const x = cellData.cell.x + (cellData.cell.width - targetW) / 2;
                const y = cellData.cell.y + (cellData.cell.height - targetH) / 2;
                doc.addImage(img.dataUrl, 'PNG', x, y, targetW, targetH);
            }
        });
        addLogoWatermark(doc);
        return doc;
    }

    async function exportPDF() {

        doc.save(`${companyFileSlug()}_PM_STATEMENT.pdf`);
