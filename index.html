    // ===== Branded, itemized client invoice (replaces the old plain PDF invoice) =====
    let invoiceState = null;
    // A snapshot of invoiceState taken every time it's freshly loaded/saved — compared against
    // the live invoiceState to tell whether there are unsaved changes before letting the user
    // leave the invoice screen (close it, load a different saved invoice, or start a new draft).
    let invoiceStateSnapshot = null;
    let pendingInvoiceExitAction = null;

    function invoiceIsDirty() {
        return !!invoiceState && JSON.stringify(invoiceState) !== invoiceStateSnapshot;
    }

    // Runs `action` (closing the modal, loading another saved invoice, starting a new draft)
    // right away if there's nothing unsaved — otherwise asks first via unsavedInvoiceModal.
    function guardInvoiceExit(action) {
        if (invoiceIsDirty()) {
            pendingInvoiceExitAction = action;
            document.getElementById('unsavedInvoiceModal').style.display = 'flex';
            return;
        }
        action();
    }

    async function unsavedInvoiceChoice(choice) {
        document.getElementById('unsavedInvoiceModal').style.display = 'none';
        if (choice === 'cancel') { pendingInvoiceExitAction = null; return; }
        if (choice === 'save') {
            const ok = await saveCurrentInvoice();
            if (!ok) { pendingInvoiceExitAction = null; return; } // save failed: stay put, nothing lost
        }
        const action = pendingInvoiceExitAction;
        pendingInvoiceExitAction = null;
        if (action) action();
    }

    function defaultInvoiceItemsForJob(job) {
        if (job.expenseItems && job.expenseItems.length > 0) {
            return job.expenseItems.map(it => ({
                desc: expenseCatLabel(it.category) + (it.note ? ' (' + it.note + ')' : ''),
                qty: '1',
                amount: parseVal(it.amount)
            }));
        }
        // Left blank on purpose: the job's "Scope of Work" field is often a long internal note,
        // not a client-ready line-item description, so it's never auto-filled here — you type a
        // short line-item description yourself. The invoice no longer shows the Scope text at all.
        return [{ desc: '', qty: '1', amount: parseVal(job.totalRevenue) }];
    }

    async function openInvoiceModal(jobId) {
        jobId = String(jobId);
        closeOtherTopModals('invoiceModal');
        document.getElementById('invoiceModal').style.display = 'flex';
        const container = document.getElementById('invoiceModalContent');
        if (container) container.innerHTML = `<div style="padding:30px 0; text-align:center; color:var(--text-muted);">${t('invoiceLoadingNote')}</div>`;

        // Re-sync straight from the server before showing anything. A phone that was
        // backgrounded, lost signal, or just came back online can otherwise keep showing
        // an outdated offline snapshot here — which looked exactly like a saved invoice
        // "disappearing" even though it was safely on the server the whole time.
        try {
            const serverDoc = await JOBS_DOC.get({ source: 'server' });
            if (serverDoc.exists && serverDoc.data().jobs) {
                const freshJobs = serverDoc.data().jobs;
                freshJobs.forEach(j => { j.id = String(j.id); });
                savedJobs = freshJobs;
            }
        } catch (e) { /* offline or unreachable — fall back to whatever's already in memory */ }

        const job = savedJobs.find(j => String(j.id) === jobId);
        if (!job) { if (container) container.innerHTML = ''; return; }
        const seq = jobId.replace(/\D/g, '').slice(-4).padStart(4, '0') || '0001';
        invoiceState = {
            jobId,
            savedId: null, // set once this draft has been saved (via saveCurrentInvoice) — lets "Save" update it in place instead of creating a duplicate
            docType: 'INVOICE',
            invoiceNo: `${companyInvoicePrefix()}-${new Date().getFullYear()}-${seq}`,
            invoiceDate: isoDate(new Date()),
            items: defaultInvoiceItemsForJob(job),
            credits: [], // each: { label: string, amount: number } — named deductions, e.g. "PVC Trim Credit — Not Installed"
            note: '',
            showPaymentMethod: false,
            paymentMethodText: t('invoicePaymentMethodPlaceholder'),
            showFollowUp: false,
            followUpText: job.followUpDate || '',
            showValidity: false,
            validityText: t('invoiceValidityPlaceholder'),
            // Defaults to whatever the job's actual recorded payments say, but it's just a
            // starting point — you can tick/untick the "PAID IN FULL" mark yourself on the
            // invoice screen, and that choice is what actually shows and gets saved/printed.
            paidMark: jobRemaining(job) <= 0.005
        };
        invoiceStateSnapshot = JSON.stringify(invoiceState);
        renderInvoiceModalContent();
    }

    // Closes the modal outright — only ever called once there's nothing unsaved to lose (either
    // guardInvoiceExit already confirmed that, or the choice was explicitly "leave without saving").
    function closeInvoiceModal() {
        document.getElementById('invoiceModal').style.display = 'none';
        invoiceState = null;
        invoiceStateSnapshot = null;
    }

    // What the Close button (and anything else meaning to leave the invoice screen) actually
    // calls — asks first if there's an unsaved change, per the invoice screen's whole reason for
    // having this guard: an invoice gets typed up, sent to the client, and then closed before
    // remembering to hit "Save", silently losing it.
    function requestCloseInvoiceModal() { guardInvoiceExit(closeInvoiceModal); }

    // ---------- Saved invoices: a job can keep several (e.g. the original invoice plus a later
    // "Additional Work" one) so you can reopen and reprint any of them without retyping the items.
    // They live on the job itself (job.savedInvoices), persisted the same way every other job edit
    // is — through persistJobChange/saveSavedJobsData — so they sync and survive a refresh.
    // Saving an invoice used to read/modify/write the WHOLE shared jobs document straight from
    // the in-memory `savedJobs` array. If anything else touched that same document in between
    // (another open tab/device, or even this app's own realtime listener refreshing `savedJobs`
    // out from under this function at just the wrong moment), that blind overwrite could silently
    // wipe out the invoice that was just pushed onto it — it would show a "saved" toast, yet never
    // really land. A Firestore transaction fixes this: it re-reads the document fresh from the
    // server, applies only this one invoice change on top of THAT fresh copy, and writes it back
    // atomically — if someone else wrote in between, Firestore retries the transaction instead of
    // letting either side clobber the other.
    async function saveCurrentInvoice() {
        if (!invoiceState) return false;
        const jobId = invoiceState.jobId;
        const snapshot = JSON.parse(JSON.stringify(invoiceState));
        delete snapshot.jobId; delete snapshot.savedId;
        let targetId = invoiceState.savedId;

        try {
            await db.runTransaction(async (tx) => {
                const doc = await tx.get(JOBS_DOC);
                const freshJobs = (doc.exists && doc.data().jobs) ? doc.data().jobs : [];
                const idx = freshJobs.findIndex(j => String(j.id) === String(jobId));
                if (idx === -1) throw new Error('job-not-found');
                const job = freshJobs[idx];
                if (!job.savedInvoices) job.savedInvoices = [];
                const existingIdx = targetId ? job.savedInvoices.findIndex(inv => inv.id === targetId) : -1;
                if (existingIdx !== -1) {
                    job.savedInvoices[existingIdx] = { ...job.savedInvoices[existingIdx], ...snapshot, savedAt: new Date().toISOString() };
                } else {
                    targetId = newLedgerId();
                    job.savedInvoices.push({ ...snapshot, id: targetId, savedAt: new Date().toISOString() });
                }
                job.lastEditedBy = currentUserEmail;
                tx.set(JOBS_DOC, { jobs: freshJobs });
            });
        } catch (err) {
            alertSaveError(err);
            return false;
        }

        // Transaction succeeded — mirror the same change onto the local in-memory copy so the
        // screen is in sync immediately (the realtime listener will also confirm this shortly).
        invoiceState.savedId = targetId;
        const idxLocal = savedJobs.findIndex(j => String(j.id) === String(jobId));
        if (idxLocal !== -1) {
            const job = savedJobs[idxLocal];
            if (!job.savedInvoices) job.savedInvoices = [];
            const existingIdx = job.savedInvoices.findIndex(inv => inv.id === targetId);
            if (existingIdx !== -1) job.savedInvoices[existingIdx] = { ...job.savedInvoices[existingIdx], ...snapshot, savedAt: new Date().toISOString() };
            else job.savedInvoices.push({ ...snapshot, id: targetId, savedAt: new Date().toISOString() });
            job.lastEditedBy = currentUserEmail;
            logActivity('edit', job.clientName, `${t('activityInvoiceSaved')} ${invoiceState.invoiceNo}`);
        }

        // A successful write can still vanish if it never actually reached Firestore's server
        // (dropped connection, backgrounded tab, etc.) before the user navigated away — so the
        // "saved" toast is only shown once a direct server read confirms the invoice is really
        // there, instead of trusting the local/cached write blindly.
        try {
            const serverDoc = await JOBS_DOC.get({ source: 'server' });
            const serverJobs = (serverDoc.exists && serverDoc.data().jobs) ? serverDoc.data().jobs : [];
            const serverJob = serverJobs.find(j => String(j.id) === String(jobId));
            const confirmed = serverJob && (serverJob.savedInvoices || []).some(inv => inv.id === targetId);
            if (!confirmed) { alert(t('alertInvoiceSaveNotConfirmed')); return false; }
        } catch (e) {
            // Couldn't reach the server to verify (offline, etc.) — the write is still queued
            // locally and will sync once back online, so say that plainly instead of claiming success.
            // It's still a real save (queued to sync), so the "unsaved changes" guard should treat
            // it as clean and let the user leave if that's what they chose.
            invoiceStateSnapshot = JSON.stringify(invoiceState);
            showToast(t('invoiceSavedOfflineToast'));
            renderInvoiceModalContent();
            return true;
        }
        invoiceStateSnapshot = JSON.stringify(invoiceState);
        showToast(t('invoiceSavedToast'));
        renderInvoiceModalContent();
        return true;
    }

    function loadSavedInvoice(savedId) {
        if (!invoiceState) return;
        const job = savedJobs.find(j => String(j.id) === String(invoiceState.jobId));
        if (!job) return;
        const saved = (job.savedInvoices || []).find(inv => inv.id === savedId);
        if (!saved) return;
        const jobId = invoiceState.jobId;
        invoiceState = JSON.parse(JSON.stringify(saved));
        invoiceState.jobId = jobId;
        invoiceState.savedId = saved.id;
        if (!invoiceState.credits) invoiceState.credits = []; // older saved invoices, if any, predate the credits list
        if (invoiceState.paidMark === undefined) invoiceState.paidMark = jobRemaining(job) <= 0.005; // older saved invoices predate the manual mark — fall back to the job's actual payment status
        invoiceStateSnapshot = JSON.stringify(invoiceState);
        renderInvoiceModalContent();
    }

    // What the "Load" button actually calls — asks first if the invoice currently open has an
    // unsaved change that loading a different one would silently throw away.
    function requestLoadSavedInvoice(savedId) { guardInvoiceExit(() => loadSavedInvoice(savedId)); }

    // Quick visual look at a saved invoice exactly as it would print — without touching
    // whatever's currently open in the editor. Swaps invoiceState to the saved snapshot just
    // long enough to build the printable HTML, then puts the original state right back, so
    // an unsaved draft currently being edited is never disturbed.
    function viewSavedInvoice(savedId) {
        if (!invoiceState) return;
        const job = savedJobs.find(j => String(j.id) === String(invoiceState.jobId));
        if (!job) return;
        const saved = (job.savedInvoices || []).find(inv => inv.id === savedId);
        if (!saved) return;
        // Opened synchronously, before any other work, so mobile browsers don't treat the
        // eventual document.write() as a popup-blocker-worthy delayed open.
        const win = window.open('', '_blank');
        if (!win) { alert(t('alertSelectOneToPrint')); return; }
        const originalState = invoiceState;
        const jobId = invoiceState.jobId;
        const previewState = JSON.parse(JSON.stringify(saved));
        previewState.jobId = jobId;
        previewState.savedId = saved.id;
        if (!previewState.credits) previewState.credits = [];
        if (previewState.paidMark === undefined) previewState.paidMark = jobRemaining(job) <= 0.005;
        invoiceState = previewState;
        const html = buildInvoiceHtmlDoc(false);
        invoiceState = originalState; // restore immediately — this was only ever a peek
        if (!html) { win.close(); return; }
        win.document.open();
        win.document.write(html);
        win.document.close();
    }

    function startNewInvoiceDraft() {
        if (!invoiceState) return;
        openInvoiceModal(invoiceState.jobId);
    }

    // What the "+ New Invoice" button actually calls — same unsaved-changes check as closing
    // or loading a different one, since starting a fresh draft throws away the current one too.
    function requestStartNewInvoiceDraft() { guardInvoiceExit(startNewInvoiceDraft); }

    // Pulls the job's own "Scope of Work" text into the invoice's Note field — the same
    // "Use job description" action already offered when scheduling a visit (useJobScopeFor),
    // now available here too since the invoice no longer shows that text on its own.
    function useJobDescriptionForInvoice() {
        if (!invoiceState) return;
        const job = savedJobs.find(j => String(j.id) === String(invoiceState.jobId));
        if (!job) return;
        if (!job.clientDescription) { alert(t('alertJobHasNoScope')); return; }
        invoiceState.note = job.clientDescription;
        renderInvoiceModalContent();
    }

    async function deleteSavedInvoice(savedId) {
        if (!invoiceState) return;
        const idx = savedJobs.findIndex(j => String(j.id) === String(invoiceState.jobId));
        if (idx === -1) return;
        if (!confirm(t('confirmDeleteSavedInvoice'))) return;
        const job = savedJobs[idx];
        const backup = JSON.parse(JSON.stringify(job));
        job.savedInvoices = (job.savedInvoices || []).filter(inv => inv.id !== savedId);
        job.lastEditedBy = currentUserEmail;
        if (invoiceState.savedId === savedId) invoiceState.savedId = null; // keep editing it, just as an unsaved draft now
        const ok = await persistJobChange(idx, backup, t('activityInvoiceDeleted'));
        if (ok) renderInvoiceModalContent();
    }

    function addInvoiceItemRow() {
        if (!invoiceState) return;
        invoiceState.items.push({ desc: '', qty: '1', amount: 0 });
        renderInvoiceModalContent();
    }

    function removeInvoiceItemRow(index) {
        if (!invoiceState) return;
        invoiceState.items.splice(index, 1);
        renderInvoiceModalContent();
    }

    function updateInvoiceItemField(index, field, value) {
        if (!invoiceState) return;

        updateInvoiceTotalsDisplay();

    // Named deduction/credit lines (e.g. "PVC Trim Credit — Not Installed: -$250.00"), each
    // shown on its own row with its own label — replaces the old single generic "Credit/Adjustment"
    // amount, which couldn't say what a deduction was actually for.
    function addInvoiceCreditRow() {
        if (!invoiceState) return;
        invoiceState.credits.push({ label: '', amount: 0 });
        renderInvoiceModalContent();
    }

    function removeInvoiceCreditRow(index) {
        if (!invoiceState) return;
        invoiceState.credits.splice(index, 1);
        renderInvoiceModalContent();
    }

    function updateInvoiceCreditField(index, field, value) {
        if (!invoiceState) return;
        invoiceState.credits[index][field] = value;
        updateInvoiceTotalsDisplay();
    }

    function setInvoiceField(field, value) {
        if (!invoiceState) return;
        invoiceState[field] = value;
    }

    function toggleInvoiceOption(field, checked) {
        if (!invoiceState) return;
        invoiceState[field] = checked;
        renderInvoiceModalContent();
    }

    function invoiceSubtotal() {
        if (!invoiceState) return 0;
        return invoiceState.items.reduce((sum, it) => sum + parseVal(it.amount), 0);
    }

    function invoiceCreditsTotal() {
        if (!invoiceState) return 0;
        return (invoiceState.credits || []).reduce((sum, c) => sum + parseVal(c.amount), 0);
    }

    function updateInvoiceTotalsDisplay() {
        if (!invoiceState) return;
        const subtotal = invoiceSubtotal();
        const credit = invoiceCreditsTotal();
        const totalDue = subtotal - credit;
        const subEl = document.getElementById('invSubtotalDisplay');
        const totalEl = document.getElementById('invTotalDueDisplay');
        if (subEl) subEl.innerText = '$' + subtotal.toFixed(2);
        if (totalEl) totalEl.innerText = '$' + totalDue.toFixed(2);
        // The "PAID IN FULL" badge is NOT re-toggled here on purpose — it reflects the job's
        // actual recorded payments (set once when the screen opens), not whatever the invoice's
        // own items/credits happen to add up to while you're still editing them.
    }

    function invoiceDocTypeDisplay(docType) {
        if (docType === 'ESTIMATE') return t('invoiceTypeEstimate');
        if (docType === 'PROPOSAL') return t('invoiceTypeProposal');
        if (docType === 'ADDITIONAL_WORK') return t('invoiceAdditionalWorkTitle');
        return t('invoiceTitle');
    }

    function renderInvoiceModalContent() {
        const container = document.getElementById('invoiceModalContent');
        if (!container || !invoiceState) return;
        const job = savedJobs.find(j => String(j.id) === String(invoiceState.jobId));
        if (!job) { container.innerHTML = ''; return; }

        // "Additional Work" documents list discrete tasks, not quantities — matches the printed
        // reference layout (Description + Amount only, no Qty column).
        const hideQty = invoiceState.docType === 'ADDITIONAL_WORK';
        const itemsGridCols = hideQty ? '1fr 110px 40px' : '1fr 70px 110px 40px';

        const itemsHtml = invoiceState.items.map((it, index) => `
            <div class="tech-card" style="margin-bottom:8px;">
                <div class="invoice-item-grid" style="display:grid; grid-template-columns: ${itemsGridCols}; gap:10px; align-items:end;">
                    <div class="invoice-item-desc-cell">
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceColDesc')}</label>
                        <textarea rows="1" oninput="updateInvoiceItemField(${index}, 'desc', this.value); autoGrowTextarea(this);" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; resize:vertical; min-height:40px; font-family:inherit; font-size:0.9rem; line-height:1.4;">${escHtml(it.desc)}</textarea>
                    </div>
                    ${hideQty ? '' : `
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceColQty')}</label>
                        <input type="text" value="${escHtml(it.qty)}" onfocus="this.select()" oninput="updateInvoiceItemField(${index}, 'qty', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; text-align:center;">
                    </div>`}
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceColAmount')}</label>
                        <input type="text" value="${it.amount !== undefined ? it.amount : ''}" onfocus="this.select()" oninput="updateInvoiceItemField(${index}, 'amount', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; text-align:center;">
                    </div>
                    <div style="display:flex; align-items:stretch; height:40px;">
                        <button type="button" onclick="removeInvoiceItemRow(${index})" title="${t('invoiceRemoveItemBtn')}" style="background:rgba(225,29,72,0.15); color:#e11d48; border:1px solid rgba(225,29,72,0.4); padding:9px 0; border-radius:8px; width:100%; cursor:pointer; font-size:14px;">✕</button>
                    </div>
                </div>
            </div>
        `).join('');

        const creditsHtml = (invoiceState.credits || []).map((c, index) => `
            <div class="tech-card" style="margin-bottom:8px;">
                <div style="display:grid; grid-template-columns: 1fr 110px 40px; gap:10px; align-items:center;">
                    <div>
                        <input type="text" value="${escHtml(c.label)}" placeholder="${t('invoiceCreditNamePh')}" oninput="updateInvoiceCreditField(${index}, 'label', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%;">
                    </div>
                    <div>
                        <input type="text" value="${c.amount !== undefined ? c.amount : ''}" onfocus="this.select()" oninput="updateInvoiceCreditField(${index}, 'amount', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; text-align:center;">
                    </div>
                    <div>
                        <button type="button" onclick="removeInvoiceCreditRow(${index})" title="${t('invoiceRemoveItemBtn')}" style="background:rgba(225,29,72,0.15); color:#e11d48; border:1px solid rgba(225,29,72,0.4); padding:9px 0; border-radius:8px; width:100%; cursor:pointer; font-size:14px;">✕</button>
                    </div>
                </div>
            </div>
        `).join('');

        const subtotal = invoiceSubtotal();
        const credit = invoiceCreditsTotal();
        const totalDue = subtotal - credit;
        // "PAID IN FULL" starts out set automatically from the job's actual recorded payments
        // (jobRemaining), but it's a manual mark from here on — you tick/untick it yourself on
        // this screen, and that choice (invoiceState.paidMark) is what actually shows and prints.
        if (invoiceState.paidMark === undefined) invoiceState.paidMark = jobRemaining(job) <= 0.005;
        const isJobPaid = !!invoiceState.paidMark;

        const savedInvoices = job.savedInvoices || [];
        const savedListHtml = savedInvoices.length === 0
            ? `<div style="font-size:0.8rem; color:var(--text-muted); padding:8px 0;">${t('invoiceNoSavedInvoices')}</div>`
            : savedInvoices.map(inv => {
                const invSubtotal = (inv.items || []).reduce((s, it) => s + parseVal(it.amount), 0);
                const invCredits = (inv.credits || []).reduce((s, c) => s + parseVal(c.amount), 0);
                const invTotal = invSubtotal - invCredits;
                const isOpen = invoiceState.savedId === inv.id;
                return `
                <div class="tech-card" style="margin-bottom:6px; ${isOpen ? `border-color:#38bdf8;` : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                        <div style="font-size:0.8rem;">
                            <b>${escHtml(invoiceDocTypeDisplay(inv.docType))}</b> — ${escHtml(inv.invoiceNo)} (${escHtml(inv.invoiceDate)})
                            <span style="color:var(--text-muted);"> · $${invTotal.toFixed(2)}</span>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button type="button" class="secondary" onclick="viewSavedInvoice('${inv.id}')" style="padding:5px 10px; font-size:0.75rem; background:#0284c7;">👁️ ${t('invoiceViewBtn')}</button>
                            <button type="button" class="secondary" onclick="requestLoadSavedInvoice('${inv.id}')" style="padding:5px 10px; font-size:0.75rem;">${t('invoiceLoadBtn')}</button>
                            <button type="button" onclick="deleteSavedInvoice('${inv.id}')" style="padding:5px 10px; font-size:0.75rem; background:rgba(225,29,72,0.15); color:#e11d48; border:1px solid rgba(225,29,72,0.4); border-radius:8px; cursor:pointer;">${t('invoiceDeleteSavedBtn')}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');

        container.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h3 style="color:#38bdf8; font-size:0.95rem; margin:0;">${t('invoiceSavedInvoicesTitle')}</h3>
                ${savedInvoices.length > 0 ? `<button type="button" class="secondary" onclick="requestStartNewInvoiceDraft()" style="padding:5px 10px; font-size:0.75rem;">${t('invoiceNewDraftBtn')}</button>` : ''}
            </div>
            <div style="margin-bottom:16px;">${savedListHtml}</div>

            <div class="grid-3" style="margin-bottom:14px;">
                <div>
                    <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceTypeLabel')}</label>
                    <select onchange="setInvoiceField('docType', this.value); renderInvoiceModalContent();" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%;">
                        <option value="INVOICE" ${invoiceState.docType === 'INVOICE' ? 'selected' : ''}>${t('invoiceTitle')}</option>
                        <option value="ESTIMATE" ${invoiceState.docType === 'ESTIMATE' ? 'selected' : ''}>${t('invoiceTypeEstimate')}</option>
                        <option value="PROPOSAL" ${invoiceState.docType === 'PROPOSAL' ? 'selected' : ''}>${t('invoiceTypeProposal')}</option>
                        <option value="ADDITIONAL_WORK" ${invoiceState.docType === 'ADDITIONAL_WORK' ? 'selected' : ''}>${t('invoiceTypeAdditionalWork')}</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceNumberLbl')}</label>
                    <input type="text" value="${escHtml(invoiceState.invoiceNo)}" oninput="setInvoiceField('invoiceNo', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%;">
                </div>
                <div>
                    <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceDateLbl')}</label>
                    <input type="text" value="${escHtml(invoiceState.invoiceDate)}" oninput="setInvoiceField('invoiceDate', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%;">
                </div>
            </div>

            <div style="background:var(--panel-bg); border:1px solid var(--border-color); padding:12px 15px; border-radius:10px; margin-bottom:14px; font-size:0.85rem; line-height:1.8;">
                <div><b>${t('invoiceBillTo')}</b> ${escHtml(job.clientName)}</div>
                <div><b>${t('invoiceAddressLabel')}:</b> ${escHtml(job.clientAddress || '')}</div>
                <div><b>${t('invoicePhoneLabel')}:</b> ${escHtml(job.clientPhone || '')}</div>
            </div>

            <h3 style="color:#38bdf8; font-size:0.95rem; margin-bottom:10px;">${t('invoiceItemsTitle')}</h3>
            <div id="invoiceItemsContainer">${itemsHtml}</div>
            <button type="button" class="secondary" onclick="addInvoiceItemRow()" style="padding:6px 14px; font-size:0.8rem; margin-bottom:16px;">${t('invoiceAddItemBtn')}</button>

            <h3 style="color:#38bdf8; font-size:0.95rem; margin-bottom:10px;">${t('invoiceCreditLabel')}</h3>
            <div id="invoiceCreditsContainer">${creditsHtml}</div>
            <button type="button" class="secondary" onclick="addInvoiceCreditRow()" style="padding:6px 14px; font-size:0.8rem; margin-bottom:16px;">${t('invoiceAddCreditBtn')}</button>

            <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
                <div style="width:280px; font-size:0.85rem;">
                    <div style="display:flex; justify-content:space-between; padding:4px 0;">
                        <span>${t('invoiceSubtotalLabel')}</span><span id="invSubtotalDisplay">$${subtotal.toFixed(2)}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#2C6B45; color:#fff; border-radius:8px; padding:8px 12px; margin-top:6px; font-weight:700;">
                        <span>${t('invoiceTotalDueLabel')}</span><span id="invTotalDueDisplay">$${totalDue.toFixed(2)}</span>
                    </div>
                    <div id="invPaidBadge" style="display:${isJobPaid ? 'block' : 'none'}; text-align:center; color:#22c55e; font-weight:700; font-size:0.85rem; margin-top:8px; letter-spacing:0.5px;">${t('invoicePaidBadge')}</div>
                    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px;">
                        <input type="checkbox" id="invPaidMarkToggle" ${invoiceState.paidMark ? 'checked' : ''} onchange="toggleInvoiceOption('paidMark', this.checked)">
                        <label for="invPaidMarkToggle" style="font-size:0.8rem; color:var(--text-muted); cursor:pointer;">${t('invoicePaidMarkToggle')}</label>
                    </div>
                </div>
            </div>

            <h3 style="color:#38bdf8; font-size:0.95rem; margin-bottom:10px;">${t('invoiceOptionalFieldsTitle')}</h3>
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="invShowPayment" ${invoiceState.showPaymentMethod ? 'checked' : ''} onchange="toggleInvoiceOption('showPaymentMethod', this.checked)">
                    <label for="invShowPayment" style="font-size:0.85rem; min-width:150px;">${t('invoicePaymentMethodToggle')}</label>
                    ${invoiceState.showPaymentMethod ? `<input type="text" value="${escHtml(invoiceState.paymentMethodText)}" oninput="setInvoiceField('paymentMethodText', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:7px 10px; border-radius:8px; flex-grow:1;">` : ''}
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="invShowFollowUp" ${invoiceState.showFollowUp ? 'checked' : ''} onchange="toggleInvoiceOption('showFollowUp', this.checked)">
                    <label for="invShowFollowUp" style="font-size:0.85rem; min-width:150px;">${t('invoiceFollowUpToggle')}</label>
                    ${invoiceState.showFollowUp ? `<input type="text" value="${escHtml(invoiceState.followUpText)}" oninput="setInvoiceField('followUpText', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:7px 10px; border-radius:8px; flex-grow:1;">` : ''}
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="invShowValidity" ${invoiceState.showValidity ? 'checked' : ''} onchange="toggleInvoiceOption('showValidity', this.checked)">
                    <label for="invShowValidity" style="font-size:0.85rem; min-width:150px;">${t('invoiceValidityToggle')}</label>
                    ${invoiceState.showValidity ? `<input type="text" value="${escHtml(invoiceState.validityText)}" oninput="setInvoiceField('validityText', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:7px 10px; border-radius:8px; flex-grow:1;">` : ''}
                </div>
            </div>

            <div style="margin-bottom:18px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <label style="font-size:0.75rem; color:var(--text-muted); display:block;">${t('invoiceNoteLabel')}</label>
                    <button type="button" class="secondary" onclick="useJobDescriptionForInvoice()" style="padding:4px 10px; font-size:0.7rem;">${t('useJobScopeBtn')}</button>
                </div>
                <textarea rows="2" placeholder="${t('invoiceNotePlaceholder')}" oninput="setInvoiceField('note', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; resize:vertical;">${escHtml(invoiceState.note)}</textarea>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button type="button" onclick="saveCurrentInvoice()" style="padding:10px 20px; font-size:0.9rem; background:#38bdf8; color:#0a0e17; border:none; border-radius:8px; cursor:pointer; font-weight:700;">${t('invoiceSaveBtn')}</button>
                <button type="button" onclick="printInvoice()" style="padding:10px 20px; font-size:0.9rem; background:#2C6B45; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:700;">${t('invoicePrintBtn')}</button>
                <button type="button" onclick="sendInvoiceClientMessage()" style="padding:10px 20px; font-size:0.9rem; background:#7c3aed; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:700;">${t('invoiceSendMsgBtn')}</button>
            </div>
        `;
        // A saved item with a long description should open already expanded, not just grow the
        // next time someone types in it.
        container.querySelectorAll('.invoice-item-desc-cell textarea').forEach(autoGrowTextarea);
    }

    // Grows a textarea to fit its content instead of scrolling inside a cramped fixed-height box —
    // used for the invoice item Description field, which used to be a single-line input too
    // narrow to comfortably read or edit a longer line of text in.
    function autoGrowTextarea(el) {
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    }

    // Builds the full invoice HTML document — used both to print it (printInvoice) and to
    // rasterize it into a shareable image (shareInvoiceImageWithText). withPrintScript=true adds
    // the auto-print script, which only belongs in the real print popup, never in an offscreen render.
    function buildInvoiceHtmlDoc(withPrintScript) {
        const job = savedJobs.find(j => String(j.id) === String(invoiceState.jobId));
        if (!job) return null;

        const isAdditionalWork = invoiceState.docType === 'ADDITIONAL_WORK';
        const subtotal = invoiceSubtotal();
        const credits = invoiceState.credits || [];
        const creditsTotal = invoiceCreditsTotal();
        const totalDue = subtotal - creditsTotal;
        // Mirrors whatever the "PAID IN FULL" checkbox on the invoice screen is set to — same
        // manual mark, so what you see on screen is exactly what prints.
        const isPaid = !!invoiceState.paidMark;
        const accent = '#2C6B45';
        const companyName = companyDisplayName();
        const companyTagline = companyProfile.tagline || '';
        const companyLogo = companyProfile.logo || '';
        const footerLine = [...(companyProfile.phones || []), companyProfile.email].filter(Boolean).join('  |  ');
        // The site URL itself must not line-wrap: browsers treat "-" as a break point, so a
        // hyphenated domain (e.g. affordable-handyman-approach.com) was splitting mid-word
        // across two lines. Keeping it in one nowrap span lets it wrap as a whole unit instead.
        const websitePart = companyProfile.website ? `<span style="white-space:nowrap;">${escHtml(companyProfile.website)}</span>` : '';
        const footerParts = [footerLine, websitePart].filter(Boolean).join('   &bull;   ');

        // "Additional Work" lists discrete tasks (Description + Amount only, no # or Qty columns,
        // per the agreed reference layout); every other document type keeps the original 4-column
        // table (#, Description, Qty, Amount) completely unchanged.
        const itemsGridCols = isAdditionalWork ? '1fr 100px' : '40px 1fr 70px 100px';
        const itemsRowsHtml = invoiceState.items.map((it, i) => {
            const bg = i % 2 === 1 ? 'background:#F6F1E8;' : '';
            const cells = isAdditionalWork
                ? `<div>${escHtml(it.desc)}</div><div style="text-align:right;">$${parseVal(it.amount).toFixed(2)}</div>`
                : `<div>${i + 1}</div><div>${escHtml(it.desc)}</div><div style="text-align:center;">${escHtml(it.qty || '')}</div><div style="text-align:right;">$${parseVal(it.amount).toFixed(2)}</div>`;
            return `<div class="invoice-item-row" style="display:grid; grid-template-columns: ${itemsGridCols}; gap:10px; padding:10px 12px; font-size:12.5px; border-bottom:1px solid #E7E1D6; ${bg}">${cells}</div>`;
        }).join('');
        const itemsHeaderCells = isAdditionalWork
            ? `<div>${escHtml(t('invoiceColDesc')).toUpperCase()}</div><div style="text-align:right;">${escHtml(t('invoiceColAmount')).toUpperCase()}</div>`
            : `<div>${escHtml(t('invoiceColNum'))}</div><div>${escHtml(t('invoiceColDesc')).toUpperCase()}</div><div style="text-align:center;">${escHtml(t('invoiceColQty')).toUpperCase()}</div><div style="text-align:right;">${escHtml(t('invoiceColAmount')).toUpperCase()}</div>`;

        // Each named deduction gets its own row (e.g. "PVC Trim Credit — Not Installed: -$250.00")
        // instead of the old single generic "Credit/Adjustment" amount.
        const creditsRowsHtml = credits.map(c => `<div style="display:flex; justify-content:space-between; padding:6px 0; color:#B5432E;"><span>${escHtml(c.label || t('invoiceCreditLabel'))}</span><span>-$${parseVal(c.amount).toFixed(2)}</span></div>`).join('');

        const paymentMethodRow = invoiceState.showPaymentMethod ? `<div style="font-size:11.5px; color:#6B6257;"><b>${t('invoicePaymentMethodToggle')}:</b> ${escHtml(invoiceState.paymentMethodText)}</div>` : '';
        const followUpRow = invoiceState.showFollowUp ? `<div style="font-size:11.5px; color:#6B6257;"><b>${t('invoiceFollowUpToggle')}:</b> ${escHtml(invoiceState.followUpText)}</div>` : '';
        const validityRow = invoiceState.showValidity ? `<div style="display:flex; justify-content:flex-end;"><div style="font-size:11px; color:#6B6257; font-style:italic; width:300px; text-align:right;">${escHtml(invoiceState.validityText)}</div></div>` : '';
        const noteHeaderText = isAdditionalWork ? t('invoiceWorkNoteHeader') : t('invoiceNoteLabel');
        const noteBox = invoiceState.note ? `<div class="invoice-note" style="background:#F6F1E8; border:1px dashed ${accent}; border-radius:6px; padding:14px 16px;"><div style="font-weight:700; font-size:11.5px; letter-spacing:0.5px; margin-bottom:6px; color:${accent};">${escHtml(noteHeaderText).toUpperCase()}</div><div class="invoice-note-body" style="font-size:12.5px; line-height:1.7; color:#3A332B;">${escHtml(invoiceState.note).replace(/\n/g, '<br>')}</div></div>` : '';
        const logoHeaderHtml = companyLogo ? `<img src="${companyLogo}" style="width:70px; height:70px; object-fit:contain; flex-shrink:0;">` : '';
        const watermarkHtml = companyLogo ? `<img src="${companyLogo}" style="position:absolute; top:50%; left:50%; width:560px; height:560px; transform:translate(-50%,-50%); opacity:0.06; pointer-events:none;">` : '';
        // One stamp near the top of the page left the bottom half (items/totals/signature area)
        // with nothing showing it's paid. This builds the same translucent rotated "PAID IN FULL"
        // mark on demand — one copy sits absolutely near the top (as before); a second copy is
        // spliced into the content flow itself further down (not a fixed pixel offset from the
        // page top), so it lands in the lower portion of the actual content whether the invoice
        // is short or fills the whole page, instead of being clipped off by the page's
        // overflow:hidden when a short invoice doesn't reach a hardcoded offset.
        const paidStampMark = (top) => `<div style="position:absolute; top:${top}; left:0; width:100%; text-align:center; z-index:5; transform:rotate(-18deg); color:rgba(220,38,38,0.32); font-family: Arial, Helvetica, sans-serif; font-weight:800; font-size:54px; letter-spacing:4px; white-space:nowrap; pointer-events:none;">${escHtml(t('invoicePaidStamp')).toUpperCase()}</div>`;
        const paidStampHtml = isPaid ? paidStampMark('260px') : '';
        const paidStampBottomHtml = isPaid ? `<div style="position:relative; height:0; overflow:visible;">${paidStampMark('-30px')}</div>` : '';

        // Title block: "Additional Work" gets a centered title + subtitle (matching the reference
        // design); every other type keeps its original right-aligned title + invoice#/date block.
        const titleBlockHtml = isAdditionalWork
            ? `<div style="text-align:center; margin-top:2px;">
                 <div class="ui" style="font-size:26px; font-weight:700; letter-spacing:1.5px; color:#241F1A;">${escHtml(t('invoiceAdditionalWorkTitle')).toUpperCase()}</div>
                 <div class="ui" style="font-size:12px; color:#6B6257; margin-top:2px;">${escHtml(t('invoiceAdditionalWorkSubtitle'))}</div>
               </div>`
            : `<div style="text-align:right;">
                 <div class="ui" style="font-size:30px; font-weight:700; letter-spacing:2px; color:${accent};">${escHtml(invoiceDocTypeDisplay(invoiceState.docType)).toUpperCase()}</div>
                 <div class="ui" style="font-size:12px; color:#6B6257; margin-top:4px;">${escHtml(t('invoiceNumberLbl'))}: <span style="color:#241F1A; font-weight:600;">${escHtml(invoiceState.invoiceNo)}</span></div>
                 <div class="ui" style="font-size:12px; color:#6B6257;">${escHtml(t('invoiceDateLbl'))}: <span style="color:#241F1A; font-weight:600;">${escHtml(invoiceState.invoiceDate)}</span></div>
               </div>`;

        // Client/Scope info block: "Additional Work" uses the plain two-column text row from the
        // reference (Client/Scope left, Invoice Type/Balance Due right, no address or phone line);
        // every other type keeps the original layout with the big colored balance-due box.
        const infoBlockHtml = isAdditionalWork
            ? `<div class="invoice-infoblock" style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:24px;">
                 <div class="ui" style="font-size:13px; line-height:1.9;">
                   <div><b>${escHtml(t('invoiceClientLabel'))}</b> ${escHtml(job.clientName)}</div>
                 </div>
                 <div class="ui" style="font-size:13px; line-height:1.9;">
                   <div><b>${escHtml(t('invoiceTypeLabel'))}:</b> ${escHtml(t('invoiceTypeAdditionalWork'))}</div>
                   <div><b>${escHtml(t('invoiceBalanceDue'))}:</b> $${totalDue.toFixed(2)}${isPaid ? ` — <span style="color:#16a34a; font-weight:700;">✅ ${escHtml(t('invoicePaidStamp')).toUpperCase()}</span>` : ''}</div>
                 </div>
               </div>`
            : `<div class="invoice-infoblock" style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:24px;">

    // Renders the invoice to a PNG image off-screen (via html2canvas, in a hidden iframe so the
    // real styling/layout is reused as-is) and hands it to the device's native Share sheet
    // together with the message text, so WhatsApp/Mail/Messages/etc. get the picture AND the
    // text together in one share, instead of two separate manual steps.
    async function shareInvoiceImageWithText(text, filenameBase) {
        if (!invoiceState) return false;
        if (typeof html2canvas === 'undefined' || !navigator.share || !navigator.canShare) { alert(t('alertShareNotSupported')); return false; }
        const html = buildInvoiceHtmlDoc(false);
        if (!html) return false;

        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:fixed; left:-10000px; top:0; width:900px; height:1200px; border:0; visibility:hidden;';
        document.body.appendChild(iframe);
        try {
            await new Promise((resolve, reject) => {
                iframe.onload = resolve;
                iframe.onerror = () => reject(new Error('iframe load failed'));
                iframe.srcdoc = html;
                setTimeout(() => reject(new Error('timeout')), 8000);
            });
            await new Promise(r => setTimeout(r, 150));   // let any <img> (logo/watermark data URLs) finish painting
            const target = iframe.contentDocument.querySelector('.invoice-page');
            if (!target) return false;
            const canvas = await html2canvas(target, { backgroundColor: '#FDFBF6', scale: 2, useCORS: true });
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) return false;
            const file = new File([blob], `${filenameBase || 'invoice'}.png`, { type: 'image/png' });
            if (!navigator.canShare({ files: [file] })) { alert(t('alertShareNotSupported')); return false; }
            await navigator.share({ files: [file], text });
            return true;
        } catch (e) {
            if (e && e.name !== 'AbortError') { console.error('shareInvoiceImageWithText error:', e); alert(t('alertShareNotSupported')); }  // AbortError = user just cancelled the share sheet, not a real failure
            return false;
        } finally {
            iframe.remove();
        }
    }

        try {
            const nameSlug = (c.job.clientName || 'client').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'client';
            await shareInvoiceImageWithText(text, `${companyFileSlug()}_Invoice_${nameSlug}`);

    // Logos keep their own compression step (separate from compressImageToBase64) so they stay
    // PNG — a logo often has a transparent background, and converting to JPEG would flatten
    // that to solid white.
    function compressLogoToBase64(file, maxDim = 500) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                        else { width = Math.round(width * maxDim / height); height = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ---------- Period Lock ("closing the books"): once a date range has been reviewed and
    // confirmed correct, lock it so a job dated inside it can no longer be edited or deleted by
    // accident — protects historical numbers from being quietly changed after the fact. A job can
    // still be freely added/edited/deleted OUTSIDE any locked range. Unlocking is always possible
    // (nothing is ever truly stuck), it just takes a deliberate second step (confirm + delete). ----------
    function isDateLocked(dateStr) {
        if (!dateStr) return false;
        return lockedPeriods.some(p => (!p.dateFrom || dateStr >= p.dateFrom) && (!p.dateTo || dateStr <= p.dateTo));
    }
    // The specific locked period a date falls in (for a clear error message naming the range).
    function lockedPeriodFor(dateStr) {
        if (!dateStr) return null;
        return lockedPeriods.find(p => (!p.dateFrom || dateStr >= p.dateFrom) && (!p.dateTo || dateStr <= p.dateTo)) || null;
    }
    function openPeriodLockModal() {
        closeOtherTopModals('periodLockModal');
        document.getElementById('periodLockModal').style.display = 'flex';
        document.getElementById('plFrom').value = '';
        document.getElementById('plTo').value = '';
        document.getElementById('plNote').value = '';
        renderPeriodLockContent();
    }
    function closePeriodLockModal() { document.getElementById('periodLockModal').style.display = 'none'; }

    async function addPeriodLock() {
        const dateFrom = document.getElementById('plFrom').value;
        const dateTo = document.getElementById('plTo').value;
        const note = document.getElementById('plNote').value.trim();
        if (!dateFrom || !dateTo) { alert(t('alertPeriodLockDatesRequired')); return; }
        if (dateFrom > dateTo) { alert(t('alertPeriodLockDateOrder')); return; }

        // Flag any job in range that's missing material cost / technicians / dates, so a period
        // never gets locked with silently-incomplete numbers baked into it (the user can still
        // confirm anyway if it's genuinely meant to be $0).
        const jobsInRange = savedJobs.filter(j => j.startDate && j.startDate >= dateFrom && j.startDate <= dateTo && j.jobStatus !== 'ملغي');
        const incomplete = jobsInRange.filter(j => !(j.technicians && j.technicians.length) || parseVal(j.materialCost) === 0 && (j.materialEntries || []).length === 0);
        if (incomplete.length > 0) {
            const names = incomplete.slice(0, 8).map(j => j.clientName || '?').join('، ');
            const msg = t('confirmPeriodLockIncomplete').replace('{n}', incomplete.length).replace('{names}', names);
            if (!confirm(msg)) return;
        }

        const entry = { id: Date.now().toString() + Math.random().toString(36).substr(2, 5), dateFrom, dateTo, note, lockedBy: currentUserEmail || '?', lockedAt: new Date().toISOString() };
        try {
            lockedPeriods.unshift(entry);
            await LOCKED_PERIODS_DOC.set({ entries: lockedPeriods });
            document.getElementById('plFrom').value = '';
            document.getElementById('plTo').value = '';
            document.getElementById('plNote').value = '';
            renderPeriodLockContent();
        } catch (err) {
            lockedPeriods = lockedPeriods.filter(x => x !== entry);
            alertSaveError(err);
        }
    }

    async function unlockPeriod(id) {
        if (!confirm(t('confirmUnlockPeriod'))) return;
        const backup = lockedPeriods.find(p => p.id === id);
        lockedPeriods = lockedPeriods.filter(p => p.id !== id);
        renderPeriodLockContent();
        try {
            await LOCKED_PERIODS_DOC.set({ entries: lockedPeriods });
        } catch (err) {
            if (backup) lockedPeriods.unshift(backup);
            renderPeriodLockContent();
            alertSaveError(err);
        }
    }

    function renderPeriodLockContent() {
        const container = document.getElementById('periodLockContent');
        if (lockedPeriods.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noLockedPeriodsYet')}</p>`;
            return;
        }
        const sorted = [...lockedPeriods].sort((a, b) => (b.dateFrom || '').localeCompare(a.dateFrom || ''));
        let html = '<table style="width:100%; border-collapse:collapse;"><tbody>';
        sorted.forEach(p => {
            html += `<tr style="border-top:1px solid var(--border-color);">
                <td style="padding:6px; font-weight:700; color:#38bdf8; white-space:nowrap;">${escHtml(p.dateFrom)} → ${escHtml(p.dateTo)}</td>
                <td style="padding:6px; font-size:0.78rem; color:var(--text-muted);">${escHtml(p.note || '')}</td>
                <td style="padding:6px;"><button class="danger" onclick="unlockPeriod('${p.id}')" style="padding:3px 8px; font-size:0.72rem;">🔓 ${t('unlockBtn')}</button></td>

        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ---------- Bank Reconciliation: compares what the app has recorded as actually received in
    // a date range (the dated client payments, job.receipts — the same figures the technician
    // percentage-pay math already uses, so it's never a guess) against what really landed in the
    // bank, which the user types in by hand. A mismatch is a signal something wasn't logged (or
    // was logged with the wrong date), not an error on its own. ----------
    function openBankReconModal() {
        closeOtherTopModals('bankReconModal');
        document.getElementById('bankReconModal').style.display = 'flex';
        document.getElementById('brFrom').value = document.getElementById('ceFilterFrom').value || '';
        document.getElementById('brTo').value = document.getElementById('ceFilterTo').value || '';
        document.getElementById('brActualDeposit').value = '';
        renderBankReconContent();
    }
    function closeBankReconModal() { document.getElementById('bankReconModal').style.display = 'none'; }

    function renderBankReconContent() {
        const container = document.getElementById('bankReconContent');
        const dateFrom = document.getElementById('brFrom').value;
        const dateTo = document.getElementById('brTo').value;
        if (!dateFrom && !dateTo) {
            container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('alertPickWeekFirst')}</p>`;
            return;
        }
        // Every dated client payment across every job, in range — exactly what should have hit
        // the bank, independent of which job it belongs to.
        let appTotal = 0;
        const rows = [];
        savedJobs.forEach(job => {
            (job.receipts || []).forEach(r => {
                if ((!dateFrom || r.date >= dateFrom) && (!dateTo || r.date <= dateTo)) {
                    appTotal += parseVal(r.amount);
                    rows.push({ date: r.date, client: job.clientName || '', amount: parseVal(r.amount) });
                }
            });
        });
        appTotal = round2(appTotal);
        const actualRaw = document.getElementById('brActualDeposit').value.trim();
        const hasActual = actualRaw !== '';
        const actual = parseVal(actualRaw);
        const diff = round2(actual - appTotal);

        let html = `<div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:14px; margin:10px 0;">
            <div class="summary-line">${t('bankReconAppTotalLabel')} <b style="color:#38bdf8;">$${appTotal.toFixed(2)}</b></div>`;
        if (hasActual) {
            html += `<div class="summary-line">${t('bankReconActualLabel')} <b>$${actual.toFixed(2)}</b></div>
                <div class="summary-highlight"><span>${t('bankReconDiffLabel')}</span><b style="color:${Math.abs(diff) < 0.01 ? '#34d399' : '#f87171'};">$${diff.toFixed(2)}</b></div>`;
            html += `<div class="note-box" style="margin-top:8px; border-color:${Math.abs(diff) < 0.01 ? 'var(--success)' : 'var(--danger)'};">${Math.abs(diff) < 0.01 ? t('bankReconMatchMsg') : t('bankReconMismatchMsg')}</div>`;
        }
        html += '</div>';

        if (rows.length === 0) {
            html += `<p style="text-align:center; color:var(--text-muted); padding:10px;">${t('noWithdrawalsMatchFilter')}</p>`;
        } else {
            rows.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            html += `<h4 style="color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">${t('bankReconPaymentsListTitle')} (${rows.length})</h4>
            <table style="width:100%; border-collapse:collapse;"><tbody>`;
            rows.forEach(r => {
                html += `<tr style="border-top:1px solid var(--border-color);">
                    <td style="padding:5px; font-size:0.78rem; color:var(--text-muted); white-space:nowrap;">${escHtml(r.date || '')}</td>
                    <td style="padding:5px; font-size:0.8rem;">${escHtml(r.client)}</td>
                    <td style="padding:5px; font-weight:700; color:#34d399; text-align:end;">$${r.amount.toFixed(2)}</td>
                </tr>`;
            });
            html += '</tbody></table>';
        }
        container.innerHTML = html;
    }

    function renderCompanyAccountContent() {
        const container = document.getElementById('companyAccountContent');

        // The full waterfall, aggregated across every job: revenue in, materials and
        // technician dues out, the 40/40/20 split, then the company's own general
        // expenses (not tied to any one job) out of its 20% share. This is the ALL-TIME
        // picture — always computed, used as the main view with no date filter, and always
        // shown as a one-line reference total at the end even when a period is picked.
        let totalReceived = 0, totalMaterials = 0, totalTechDues = 0, totalShareS = 0, totalShareM = 0, totalIncome = 0;
        savedJobs.forEach(job => {
            const { totalTechDues: dues, shareS, shareM, companyNet } = jobNet(job);
            totalReceived += parseVal(job.amountReceived);
            totalMaterials += parseVal(job.materialCost);
            totalTechDues += dues;
            totalShareS += shareS;
            totalShareM += shareM;
            totalIncome += companyNet;
        });
        let totalGeneralExpenses = 0;
        companyExpenses.forEach(e => { totalGeneralExpenses += parseVal(e.amount); });
        const remaining = totalIncome - totalGeneralExpenses;

        const dateFrom = document.getElementById('ceFilterFrom').value;
        const dateTo = document.getElementById('ceFilterTo').value;
        const hasDateFilter = !!(dateFrom || dateTo);

        let html = '';
        if (hasDateFilter) {
            // With a period picked, the main box becomes THAT period's own full waterfall — same
            // shape as the all-time view below (Received → Materials → Tech Dues → S/M/Company
            // split → general expenses → Net), not just the final net line, so this doubles as a
            // proper P&L statement for the period, not only a balance check.
            const { totalShareCompany: periodIncome, totalReceived: periodReceived, totalMaterials: periodMaterials, totalTechDues: periodTechDues } = computeSAndMPeriodShare(dateFrom, dateTo);
            const periodSpent = round2(companyExpenses
                .filter(e => (!dateFrom || (e.date && e.date >= dateFrom)) && (!dateTo || (e.date && e.date <= dateTo)))
                .reduce((s, e) => s + parseVal(e.amount), 0));
            const periodRemaining = round2(periodIncome - periodSpent);
            html += `<div class="note-box" style="margin-bottom:10px;">${t('companyPeriodNote')}</div>
            <div style="background:var(--card-dark); border:1px solid #38bdf8; border-radius:8px; padding:14px; margin-bottom:14px;">
                <div style="color:#38bdf8; font-weight:700; margin-bottom:8px;">${t('partnerPeriodLabel')}</div>
                <div class="summary-line">${t('cwTotalReceived')} <b>$${periodReceived.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwMaterials')} <b style="color:#f87171;">-$${periodMaterials.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwTechDues')} <b style="color:#f87171;">-$${periodTechDues.toFixed(2)}</b></div>
                <div class="summary-line" style="border-top:1px dashed var(--border-color); margin-top:4px; padding-top:4px;">${t('cwNetIncomeLabel')} <b style="color:#34d399;">$${periodIncome.toFixed(2)}</b></div>
                <div class="summary-line">${t('totalWithdrawnLabel')} <b style="color:#f87171;">-$${periodSpent.toFixed(2)}</b></div>
                <div class="summary-highlight"><span>${t('remainingBalanceLabel')}</span><b style="color:${periodRemaining < 0 ? '#f87171' : '#fbbf24'};">$${periodRemaining.toFixed(2)}</b></div>
            </div>`;
        } else {
            html += `<div style="background:var(--card-dark); border:1px solid var(--border-color); border-radius:8px; padding:14px; margin-bottom:18px;">
                <div class="summary-line">${t('cwTotalReceived')} <b>$${totalReceived.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwMaterials')} <b style="color:#f87171;">-$${totalMaterials.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwTechDues')} <b style="color:#f87171;">-$${totalTechDues.toFixed(2)}</b></div>
                <div class="summary-line" style="border-top:1px dashed var(--border-color); margin-top:4px; padding-top:4px;">${t('cwShareS')} <b style="color:#34d399;">$${totalShareS.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwShareM')} <b style="color:#34d399;">$${totalShareM.toFixed(2)}</b></div>
                <div class="summary-line">${t('cwCompanyShare')} <b style="color:#fbbf24;">$${totalIncome.toFixed(2)}</b></div>
                <div class="summary-line">${t('totalWithdrawnLabel')} <b style="color:#f87171;">-$${totalGeneralExpenses.toFixed(2)}</b></div>
                <div class="summary-highlight"><span>${t('remainingBalanceLabel')}</span><b style="color:${remaining < 0 ? '#f87171' : '#fbbf24'};">$${remaining.toFixed(2)}</b></div>
            </div>`;
        }

        // Always shown, whichever view is primary above — the lifetime total of every general
        // expense ever logged for the company, as a fixed reference point.
        html += `<div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:18px; padding-bottom:10px; border-bottom:1px dashed var(--border-color);">${t('cwAllTimeExpensesLabel')} <b style="color:#f87171;">$${totalGeneralExpenses.toFixed(2)}</b></div>`;

        if (companyExpenses.length === 0) {
            html += `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noWithdrawalsYet')}</p>`;
        } else {
            const dateFrom = document.getElementById('ceFilterFrom').value;
            const dateTo = document.getElementById('ceFilterTo').value;
            const filtered = companyExpenses
                .map((e, i) => ({ ...e, _origIndex: i }))
                .filter(e => {
                    const matchFrom = !dateFrom || (e.date && e.date >= dateFrom);
                    const matchTo = !dateTo || (e.date && e.date <= dateTo);
                    return matchFrom && matchTo;
                });

            html += `<h4 style="color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">${t('withdrawalHistoryTitle')} (${filtered.length})</h4>`;
            if (filtered.length === 0) {
                html += `<p style="text-align:center; color:var(--text-muted); padding:15px;">${t('noWithdrawalsMatchFilter')}</p>`;
            } else {
                html += '<table style="width:100%; border-collapse:collapse;"><tbody>';
                filtered.forEach(e => {
                    html += `<tr style="border-top:1px solid var(--border-color);">
                        <td style="padding:6px; font-size:0.78rem; color:var(--text-muted); white-space:nowrap;">${e.date || ''}</td>
                        <td style="padding:6px; font-weight:700; color:#38bdf8;">${expenseCatLabel(e.category)}</td>
                        <td style="padding:6px; color:#f87171; font-weight:700;">$${parseVal(e.amount).toFixed(2)}</td>
                        <td style="padding:6px; font-size:0.78rem; color:var(--text-muted);">${e.note || ''}</td>
                        <td style="padding:6px;"><button class="danger" onclick="deleteCompanyExpense(${e._origIndex})" style="padding:3px 8px; font-size:0.72rem;">${t('deleteBtn')}</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
        }
        container.innerHTML = html;
    }
