    function populateCountryCodeSelect(selectId, defaultCode) {
        const sel = document.getElementById(selectId);
        const keep = defaultCode || sel.value || '1';
        sel.innerHTML = getCountryCodes().map(c => `<option value="${c.code}">${c.label}</option>`).join('');
        sel.value = keep;
    }
    populateCountryCodeSelect('clientCountryCode', '1');
    populateCountryCodeSelect('newTechCountryCode', '1');

    // Builds a full international number from a selected country code + whatever the person
    // typed, instead of guessing the country from the digit count (which always assumed US).
    function buildFullPhone(countryCode, localNumber) {
        let digits = String(localNumber).replace(/[^\d]/g, '');
        digits = digits.replace(/^0+/, ''); // many countries prefix local numbers with a 0 that's dropped internationally
        if (!digits) return '';
        if (countryCode === 'other') return digits; // person typed the code as part of the number itself
        return countryCode + digits;
    }

    // Best-effort split of a stored full number back into {code, local} for editing —
    // matches against our known list, longest code first so e.g. 971 isn't misread as 97+1.
    function splitPhoneForEdit(fullPhone) {
        const digits = String(fullPhone || '').replace(/[^\d]/g, '');
        if (!digits) return { code: '1', local: '' };
        const sorted = getCountryCodes().filter(c => c.code !== 'other').sort((a, b) => b.code.length - a.code.length);
        for (const c of sorted) {
            if (digits.startsWith(c.code)) return { code: c.code, local: digits.slice(c.code.length) };
        }
        return { code: 'other', local: digits };
    }

    function escJs(str) { return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    /* ---------------- Contacts ---------------- */
    function normalizePhoneDigits(p) { return (p || '').replace(/\D/g, ''); }

    // A match on phone digits is decisive; if neither has a phone, fall back to an
    // exact (case-insensitive) name match.
    function findDuplicateContact(name, phone, excludeId) {
        const normPhone = normalizePhoneDigits(phone);
        return contacts.find(c => {
            if (c.id === excludeId) return false;
            if (normPhone && normalizePhoneDigits(c.phone)) return normalizePhoneDigits(c.phone) === normPhone;
            return c.name.trim().toLowerCase() === (name || '').trim().toLowerCase();
        });
    }

            address: document.getElementById('contactAddress').value.trim(),
            note: document.getElementById('contactNote').value.trim(),

        try {
            if (editingContactId) {
                const idx = contacts.findIndex(c => c.id === editingContactId);
                if (idx !== -1) contacts[idx] = { ...contacts[idx], ...fields };
            } else {
                contacts.unshift({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), ...fields });

    // Scans every job on record and adds any client not already a contact — matched the
    // same way manual duplicate-checking works (phone first, name as a fallback) — so
    // running it twice never creates copies.
    async function importContactsFromJobs() {
        let addedCount = 0;
        savedJobs.forEach(job => {
            if (!job.clientName) return;
            if (findDuplicateContact(job.clientName, job.clientPhone, null)) return;
            contacts.unshift({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5) + addedCount,
                name: job.clientName, phone: job.clientPhone || '', email: job.clientEmail || '',
                address: job.clientAddress || '', company: '', note: '', by: currentUserEmail || '?'
            });
            addedCount++;
        });
        if (addedCount === 0) { alert(t('noNewContactsToImport')); return; }
        try {
            await CONTACTS_DOC.set({ entries: contacts });
            renderContacts();
            alert(t('importedContactsCount').replace('{n}', addedCount));
        } catch (err) { alert(t('alertJobSaveFailed')); }
    }

    function avatarColorFor(name) {
        let hash = 0;
        for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);

    function openTechPaymentEdit(at) {
        const p = techPayments.find(x => x.at === at);
        if (!p) return;
        editingPaymentAt = at;
        techPaymentName = p.name;
        document.getElementById('techPaymentTitleEl').textContent = t('techPaymentEditTitle');
        document.getElementById('techPaymentNameLabel').textContent = p.name;
        document.getElementById('techPaymentAmount').value = parseVal(p.amount);
        document.getElementById('techPaymentDate').value = p.date || isoDate(new Date());

        document.getElementById('techPaymentModal').style.display = 'flex';

    async function saveTechPayment() {
        const amount = parseVal(document.getElementById('techPaymentAmount').value);
        const date = document.getElementById('techPaymentDate').value;
        const note = document.getElementById('techPaymentNote').value.trim();
        if (amount <= 0) { alert(t('alertWithdrawalAmountRequired')); return; }

        if (editingPaymentAt) {   // editing an existing payment: same record, new amount / date / note
            const idx = techPayments.findIndex(x => x.at === editingPaymentAt);
            if (idx === -1) { closeTechPaymentModal(); renderTechGuideContent(); return; }
            const backup = { ...techPayments[idx] };
            techPayments[idx] = { ...backup, amount, date, note, editedBy: currentUserEmail || '?', editedAt: new Date().toISOString() };
            try {
                await TECH_PAYMENTS_DOC.set({ entries: techPayments });
                logActivity('edit', backup.name || '', `${t('guidePaymentsTitle')}: $${parseVal(backup.amount).toFixed(2)} (${backup.date || ''}) → $${amount.toFixed(2)} (${date})`);
            } catch (err) {
                techPayments[idx] = backup;
                alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')');
                return;
            }
            closeTechPaymentModal();
            renderTechGuideContent();
            return;
        }

        const entry = { name: techPaymentName, amount, date, note, by: currentUserEmail || '?', at: new Date().toISOString() };
        try {
            techPayments.unshift(entry);
            await TECH_PAYMENTS_DOC.set({ entries: techPayments });
            closeTechPaymentModal();
            renderTechGuideContent();
        } catch (err) {
            techPayments = techPayments.filter(x => x !== entry);   // the save failed: don't keep a payment that was never stored
            alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')');
        }
    }

    function openJobOverlay(jobId) {

    // What the day editor looks like right now, to tell whether something was changed and not saved.
    function scheduleEditorState() {
        return { date: document.getElementById('editScheduleDayLabel').value, time: document.getElementById('esTime').value,
                 note: document.getElementById('esNote').value, team: [...document.querySelectorAll('.es-team-check:checked')].map(c => c.value).sort().join('|') };
    }
    function scheduleEditorDirty() {
        if (!editScheduleSnap) return false;
        const now = scheduleEditorState();
        return now.date !== editScheduleSnap.date || now.time !== editScheduleSnap.time || now.note !== editScheduleSnap.note || now.team !== editScheduleSnap.team;
    }
    function goFullEdit(jobId) { closeEditScheduleModal(); openJobOverlay(jobId); }
    function requestFullEdit(jobId) {
        if (scheduleEditorDirty()) { pendingFullEditJobId = jobId; document.getElementById('unsavedScheduleModal').style.display = 'flex'; return; }
        goFullEdit(jobId);
    }
    async function unsavedChoice(choice) {
        document.getElementById('unsavedScheduleModal').style.display = 'none';
        if (choice === 'back') return;
        const jobId = pendingFullEditJobId;
        if (choice === 'save' && !(await saveEditSchedule())) return;   // saving failed: stay in the day editor
        goFullEdit(jobId);
    }

    function openEditScheduleModal(jobId, date) {
        const job = savedJobs.find(j => j.id === jobId);
        if (!job) return;
        editScheduleJobId = jobId;
        editScheduleOrigDate = date;
        const entries = getScheduleEntries(job);
        const entry = entries.find(e => e.date === date) || { date, time: '', team: [] };

        document.getElementById('editScheduleClientLabel').textContent = job.clientName || '';
        document.getElementById('editScheduleDayLabel').value = entry.date || '';
        document.getElementById('esTime').value = entry.time || '';
        document.getElementById('esNote').value = entry.note || '';

        const checkedTeam = entry.team || [];
        const names = ['SAMER', 'MOHAMED', ...getUniqueRegisteredTechnicians(), ...checkedTeam];
        const uniqueNames = [...new Set(names)];
        document.getElementById('esTeamCheckboxes').innerHTML = uniqueNames.map(name => `
            <label style="display:flex; align-items:center; gap:5px; font-size:0.82rem; cursor:pointer;">
                <input type="checkbox" class="es-team-check" value="${name}" ${checkedTeam.includes(name) ? 'checked' : ''}> ${name}
            </label>`).join('');

        const removeBtn = document.getElementById('esRemoveDayBtn');
        removeBtn.style.display = entries.length > 1 ? 'block' : 'none';
        removeBtn.onclick = () => removeScheduleDay(jobId, date);

    async function removeScheduleDay(jobId, date) {
        if (!confirm(t('confirmRemoveDay'))) return;
        const idx = savedJobs.findIndex(j => j.id === jobId);
        if (idx === -1) return;
        const entries = getScheduleEntries(savedJobs[idx]).filter(e => e.date !== date);
        savedJobs[idx].dailySchedule = entries;
        savedJobs[idx].lastEditedBy = currentUserEmail;
        try {
            await saveSavedJobsData();
            logActivity('edit', savedJobs[idx].clientName, t('activityRemovedDay') + ' ' + date);
        } catch (e) { alert(t('alertJobSaveFailed')); return; }
        closeEditScheduleModal();
        renderWeeklyBoard();
        refreshGuideIfOpen();
    }

    async function saveEditSchedule() {
        const idx = savedJobs.findIndex(j => j.id === editScheduleJobId);
        if (idx === -1) return false;
        const newDate = document.getElementById('editScheduleDayLabel').value;
        const newTime = document.getElementById('esTime').value;
        const newNote = document.getElementById('esNote').value.trim();
        const newTeam = Array.from(document.querySelectorAll('.es-team-check:checked')).map(cb => cb.value);

        // Drop the entry being edited, then add it back at (possibly) its new date —
        // this both handles "just changed the time/team" and "moved this day elsewhere"
        // without ever touching this job's OTHER scheduled days.
        const backup = JSON.parse(JSON.stringify(savedJobs[idx]));
        const original = getScheduleEntries(savedJobs[idx]).find(e => e.date === editScheduleOrigDate) || {};
        const entries = getScheduleEntries(savedJobs[idx]).filter(e => e.date !== editScheduleOrigDate);
        entries.push({ ...original, date: newDate, time: newTime, team: newTeam, note: newNote, dayOrder: 0 });
        savedJobs[idx].dailySchedule = entries;
        savedJobs[idx].lastEditedBy = currentUserEmail;
        try {
            await saveSavedJobsData();
            logActivity('edit', savedJobs[idx].clientName, t('activityScheduleUpdated') + ` ${newDate} ${newTime} (${newTeam.join(', ')})`);
        } catch (e) { savedJobs[idx] = backup; alert(t('alertJobSaveFailed')); return false; }
        closeEditScheduleModal();
        renderWeeklyBoard();
        refreshGuideIfOpen();
        return true;
    }

    // Fills a visit's note from the job's own Scope of Work — the person can still edit or clear it afterwards.
    // 'qs' = Quick Schedule (job picked from the dropdown); 'es' = the day editor (job already known).
    function useJobScopeFor(which) {
        let job = null;
        if (which === 'qs') {
            if (quickScheduleMode !== 'existing') { alert(t('alertPickJobFirst')); return; }
            job = savedJobs.find(j => j.id === document.getElementById('qsExistingJobSelect').value);
        } else {
            job = savedJobs.find(j => j.id === editScheduleJobId);
        }
        if (!job) { alert(t('alertPickJobFirst')); return; }
        if (!job.clientDescription) { alert(t('alertJobHasNoScope')); return; }
        document.getElementById(which === 'qs' ? 'qsNote' : 'esNote').value = job.clientDescription;
        // Copying the scope into the day editor is a change like any other, so the unsaved-changes check (which compares values) still catches it.
    }

    async function saveQuickSchedule() {
        const time = document.getElementById('qsTime').value;
        const note = document.getElementById('qsNote').value.trim();
        const team = Array.from(document.querySelectorAll('.qs-team-check:checked')).map(cb => cb.value);

        if (quickScheduleMode === 'new') {
            const clientName = document.getElementById('qsClientName').value.trim();
            if (!clientName) { alert(t('alertClientNameRequired')); return; }
            const newJob = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                clientName,
                clientPhone: '',
                jobStatus: 'شغال',
                clientAddress: document.getElementById('qsClientAddress').value.trim(),
                clientDescription: '',
                startDate: quickScheduleDay,
                endDate: quickScheduleDay,
                dailySchedule: [{ date: quickScheduleDay, time, team, note, dayOrder: 0 }],
                totalRevenue: 0, amountReceived: 0, amountRemaining: 0,
                followUpDate: '', materialCost: 0, extraExpenses: 0,
                expenseItems: [], technicians: [],
                createdBy: currentUserEmail, lastEditedBy: currentUserEmail
            };
            savedJobs.unshift(newJob);
            try {
                await saveSavedJobsData();
                logActivity('add', clientName);
            } catch (err) { alert(t('alertJobSaveFailed')); return; }
        } else {
            const jobId = document.getElementById('qsExistingJobSelect').value;
            if (!jobId) { return; }
            const idx = savedJobs.findIndex(j => j.id === jobId);
            if (idx === -1) return;
            // Adds/updates just THIS day's entry — a job already scheduled on other days
            // (maybe with a different tech) keeps those days untouched. The job's official
            // record date (startDate, used in Log & Reports) is never touched either.
            upsertScheduleEntry(savedJobs[idx], quickScheduleDay, time, team, note);
            savedJobs[idx].lastEditedBy = currentUserEmail;
            try {
                await saveSavedJobsData();
                logActivity('edit', savedJobs[idx].clientName, t('activityScheduleUpdated') + ` ${quickScheduleDay} ${time} (${team.join(', ')})`);
            } catch (err) { alert(t('alertJobSaveFailed')); return; }
        }

        closeQuickScheduleModal();
        refreshAllViews();
        renderWeeklyBoard();
    }

    async function saveAppointment() {
        const clientName = document.getElementById('apptClientName').value.trim();
        if (!clientName) { alert(t('alertClientNameRequired')); return; }

        const fields = {
            clientName,
            clientPhone: document.getElementById('apptClientPhone').value.trim(),
            clientEmail: document.getElementById('apptClientEmail').value.trim(),
            clientAddress: document.getElementById('apptClientAddress').value.trim(),
            requestedDate: document.getElementById('apptDate').value,
            requestedTime: document.getElementById('apptTime').value,
            services: Array.from(document.querySelectorAll('.appt-service-check:checked')).map(cb => cb.value),
            note: document.getElementById('apptNote').value.trim(),
            photos: JSON.parse(JSON.stringify(currentApptPhotos)),
            by: currentUserEmail || '?'
        };

        try {
            if (editingApptId) {
                const idx = appointments.findIndex(a => a.id === editingApptId);
                if (idx !== -1) appointments[idx] = { ...appointments[idx], ...fields };
            } else {
                appointments.unshift({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), ...fields });
            }
            await APPOINTMENTS_DOC.set({ entries: appointments });
            resetAppointmentForm();
            renderAppointments();
        } catch (err) {
            alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')');
        }
    }

        appointments = appointments.filter(a => a.id !== id);
        try { await APPOINTMENTS_DOC.set({ entries: appointments }); renderAppointments(); }
        catch (err) { alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')'); }
    }

    // Pulls an appointment's details straight into a fresh job entry form, then removes
    // it from the pending list — no retyping the client's name/phone/address.
    async function convertAppointmentToJob(id) {
        const appt = appointments.find(a => a.id === id);
        if (!appt) return;

        const servicesLine = (appt.services && appt.services.length > 0) ? `${t('apptServicesLabel')} ${appt.services.join(', ')}` : '';
        const newJob = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            clientName: appt.clientName || '',
            clientPhone: appt.clientPhone || '',
            clientEmail: appt.clientEmail || '',
            jobStatus: 'شغال',
            clientAddress: appt.clientAddress || '',
            clientDescription: [servicesLine, appt.note || ''].filter(Boolean).join('\n'),
            startDate: appt.requestedDate || '',
            endDate: appt.requestedDate || '',
            dailySchedule: appt.requestedDate ? [{ date: appt.requestedDate, time: appt.requestedTime || '', team: [], dayOrder: 0 }] : [],
            totalRevenue: 0, amountReceived: 0, amountRemaining: 0,
            followUpDate: '', materialCost: 0, extraExpenses: 0,
            expenseItems: [], technicians: [],
            photos: JSON.parse(JSON.stringify(appt.photos || [])),
            createdBy: currentUserEmail, lastEditedBy: currentUserEmail
        };

        savedJobs.unshift(newJob);
        appointments = appointments.filter(a => a.id !== id);
        try {
            await saveSavedJobsData();
            await APPOINTMENTS_DOC.set({ entries: appointments });
            logActivity('add', newJob.clientName);
        } catch (e) {
            alert(t('alertJobSaveFailed'));
            return;
        }

        refreshAllViews();
        editJob(newJob.id); // opens it pre-filled, in edit mode, so refining it later never creates a duplicate
        switchScreen('entry');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

            const serviceTags = (appt.services && appt.services.length > 0)
                ? `<div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:5px;">${appt.services.map(s => `<span style="background:rgba(14,165,233,0.15); color:#38bdf8; border-radius:6px; padding:2px 8px; font-size:0.72rem;">${s}</span>`).join('')}</div>`
                : '';
            html += `<div class="tech-card">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">

                        <span style="font-size:0.78rem; color:#38bdf8;">${appt.requestedDate || t('noDateSet')} ${appt.requestedTime || ''}</span>
                        ${serviceTags}
                        ${appt.note ? `<div style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">${appt.note}</div>` : ''}
                    </div>

                        <button class="success" onclick="convertAppointmentToJob('${appt.id}')" style="padding:6px 12px; font-size:0.78rem;">${t('convertToJobBtn')}</button>
                        <button class="secondary" onclick="editAppointment('${appt.id}')" style="padding:6px 10px; font-size:0.78rem; background:#0284c7;">${t('editBtn')}</button>
                        <button class="danger" onclick="deleteAppointment('${appt.id}')" style="padding:6px 10px; font-size:0.78rem;">${t('deleteBtn')}</button>
                    </div>

        });
        container.innerHTML = html;
    }

    /* ---------------- Weekly Work Board ---------------- */
    // The Weekly Board organizes work by its OWN scheduling date, separate from the job's
    // official record date (startDate) used in reports — so reordering a job's day here
    // never changes the date shown in Log & Reports. Falls back to startDate only for
    // older jobs saved before this field existed.
    function effectiveScheduleDate(job) { return job.scheduledDate || job.startDate || ''; }

    // A job can now span several days, with a different team on each — e.g. Nathan works
    // Mon-Tue, then Oscar picks it up Wed-Thu, all under the same job/price. job.dailySchedule
    // is the source of truth going forward: [{date, time, team, dayOrder}, ...]. Falls back to
    // the old single-date/assignedTeam fields for jobs saved before this existed.
    function getScheduleEntries(job) {
        if (job.dailySchedule && job.dailySchedule.length > 0) return job.dailySchedule;
        const d = effectiveScheduleDate(job);
        if (!d) return [];
        return [{ date: d, time: job.scheduledTime || '', team: job.assignedTeam || (job.technicians || []).map(tc => tc.name).filter(Boolean), dayOrder: 0 }];
    }

    // Adds or updates (for the same date) one day's entry, without touching any other day
    // already scheduled for this job.
    function upsertScheduleEntry(job, date, time, team, note) {
        const entries = getScheduleEntries(job).map(e => ({ ...e })); // clone, since getScheduleEntries may synthesize from legacy fields
        const idx = entries.findIndex(e => e.date === date);
        if (idx !== -1) { entries[idx].time = time; entries[idx].team = team; entries[idx].note = note; }
        else { entries.push({ date, time, team, note, dayOrder: entries.filter(e => e.date === date).length }); }
        job.dailySchedule = entries;
        // Keep the legacy fields roughly in sync too, so anything not yet updated to read
        // dailySchedule (e.g. an older cached page) still shows something reasonable.
        job.scheduledDate = entries[0].date;
        job.scheduledTime = entries[0].time;
        job.assignedTeam = entries[0].team;
    }

    let weeklyBoardOffset = 0; // 0 = this week, -1 = previous week, +1 = next week
    let showAllPendingMode = false;
    let dragJobId = null;

    // Week starts on Monday.
    function getWeekRange(offset) {
        // The board is a day-to-day planning tool: "This Week" (offset 0) is a fixed 7-day window
        // starting TOMORROW — today's own work already has its place in the "Jobs Today?" sheet, so the
        // board is for what's coming next. Any other week (Last Week, or one reached with the arrows) is
        // a full calendar week, Monday..Sunday, for looking back or planning further ahead.
        if (offset === 0) {
            const start = addDaysISO(isoDate(new Date()), 1);
            const days = [];
            for (let i = 0; i < 7; i++) days.push(new Date(addDaysISO(start, i) + 'T00:00:00'));
            return days;
        }
        const w = weekOf(isoDate(new Date()), offset);
        const days = [];
        for (let i = 0; i < 7; i++) days.push(new Date(addDaysISO(w.start, i) + 'T00:00:00'));   // Mon .. Sun
        return days;
    }

    function shiftWeek(direction) {
        weeklyBoardOffset = (direction === 0) ? 0 : weeklyBoardOffset + direction;
        renderWeeklyBoard();
    }
    // Jumps straight to last week (relative to today), the same way "This Week" always jumps straight to 0 —
    // regardless of which week is currently being browsed.
    function goToLastWeek() { weeklyBoardOffset = -1; renderWeeklyBoard(); }

    function toggleAllPendingMode() {
        showAllPendingMode = !showAllPendingMode;
        document.getElementById('showAllPendingBtn').style.background = showAllPendingMode ? 'var(--primary)' : '';
        renderWeeklyBoard();
    }

    // Sorts a day's jobs: manual drag order first (dayOrder), then by scheduled time,
    // then jobs with no time at all go last.
    function sortDayEntries(pairs) {
        return [...pairs].sort((a, b) => {
            const orderA = a.entry.dayOrder !== undefined ? a.entry.dayOrder : 999;
            const orderB = b.entry.dayOrder !== undefined ? b.entry.dayOrder : 999;
            if (orderA !== orderB) return orderA - orderB;
            const timeA = a.entry.time || '99:99';
            const timeB = b.entry.time || '99:99';
            return timeA.localeCompare(timeB);
        });
    }

    // Reassigns dayOrder for every (job, day) entry sharing the dropped-into day.
    async function handleJobDrop(event, dateStr, targetJobId) {
        event.preventDefault();
        if (!dragJobId || dragJobId === targetJobId) return;
        const activeJobs = savedJobs.filter(j => j.jobStatus !== 'خلص');
        let pairs = [];
        activeJobs.forEach(job => { getScheduleEntries(job).forEach(entry => { if (entry.date === dateStr) pairs.push({ job, entry }); }); });
        pairs = sortDayEntries(pairs);
        const draggedIndex = pairs.findIndex(p => p.job.id === dragJobId);
        const targetIndex = pairs.findIndex(p => p.job.id === targetJobId);
        if (draggedIndex === -1 || targetIndex === -1) return;

        const reordered = [...pairs];
        const [moved] = reordered.splice(draggedIndex, 1);
        reordered.splice(targetIndex, 0, moved);
        reordered.forEach((pair, i) => {
            const jobIdx = savedJobs.findIndex(j => j.id === pair.job.id);
            if (jobIdx === -1) return;
            const entries = getScheduleEntries(savedJobs[jobIdx]).map(e => ({ ...e }));
            const entryIdx = entries.findIndex(e => e.date === dateStr);
            if (entryIdx !== -1) { entries[entryIdx].dayOrder = i; savedJobs[jobIdx].dailySchedule = entries; }
        });

        dragJobId = null;
        try { await saveSavedJobsData(); } catch (e) { console.error(e); }
        renderWeeklyBoard();
    }

    function renderWeeklyBoard() {
        const dayNamesAr = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
        const dayNamesEn = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const dayNames = currentLang === 'ar' ? dayNamesAr : dayNamesEn;
        const activeJobs = savedJobs.filter(j => j.jobStatus !== 'خلص');
        const todayStr = isoDate(new Date());

        if (showAllPendingMode) {
            document.getElementById('weeklyRangeLabel').textContent = t('allPendingSubtitle');
            let pairs = [];
            activeJobs.forEach(job => {
                const entries = getScheduleEntries(job);
                if (entries.length === 0) { pairs.push({ job, entry: { date: '', time: '', team: [] } }); }
                else entries.forEach(entry => pairs.push({ job, entry }));
            });
            pairs.sort((a, b) => (a.entry.date || '9999').localeCompare(b.entry.date || '9999'));
            let html = '';
            if (pairs.length === 0) {
                html = `<div style="padding:12px 14px; color:var(--text-muted); font-size:0.82rem;">${t('noJobsThisDay')}</div>`;
            } else {
                pairs.forEach(({ job, entry }) => {
                    const isOverdue = entry.date && entry.date < todayStr;
                    html += renderJobCard(job, entry, isOverdue);
                });
            }
            document.getElementById('weeklyBoardContent').innerHTML = html;
            return;
        }

        const days = getWeekRange(weeklyBoardOffset);
        document.getElementById('weeklyRangeLabel').innerHTML = ltrRange(isoDate(days[0]), isoDate(days[days.length - 1]));

        let html = '';
        days.forEach(d => {
            const dateStr = isoDate(d);
            let pairs = [];
            activeJobs.forEach(job => { getScheduleEntries(job).forEach(entry => { if (entry.date === dateStr) pairs.push({ job, entry }); }); });
            pairs = sortDayEntries(pairs);
            const isToday = dateStr === todayStr;
            html += `<div style="margin-bottom:14px; border:1px solid var(--border-color); border-radius:10px; overflow:hidden;">
                <div style="background:${isToday ? 'rgba(14,165,233,0.15)' : 'var(--panel-bg)'}; padding:8px 14px; font-weight:700; color:${isToday ? '#38bdf8' : 'var(--text-muted)'}; display:flex; justify-content:space-between; align-items:center;">
                    <span>${dayNames[d.getDay() === 0 ? 6 : d.getDay() - 1]} — ${dateStr}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:400; font-size:0.78rem;">${pairs.length} ${t('jobsWord')}</span>
                        <button class="success" onclick="openQuickScheduleModal('${dateStr}')" style="padding:3px 10px; font-size:0.72rem;">+ ${t('qsAddBtn')}</button>
                    </div>
                </div>
                <div style="padding:10px 14px 4px;" ondragover="event.preventDefault();" ondrop="handleJobDrop(event, '${dateStr}', '${pairs[0] ? pairs[0].job.id : ''}')">`;
            if (pairs.length === 0) {
                html += `<div style="padding:6px 0 10px; color:var(--text-muted); font-size:0.82rem;">${t('noJobsThisDay')}</div>`;
            } else {
                pairs.forEach(({ job, entry }) => { html += renderJobCard(job, entry, false); });
            }
            html += '</div></div>';
        });
        document.getElementById('weeklyBoardContent').innerHTML = html;
    }

    function openSendScheduleModal() {
        // Smart default: today, or tomorrow if it's already past 5pm, plus 6 more days —
        // the user can still widen or narrow this before sending.

    function setLogDateRange(preset) {
        const fromEl = document.getElementById('filterDateFrom');
        const toEl = document.getElementById('filterDateTo');
        const today = new Date();
        if (preset === 'week' || preset === 'lastweek') {
            const w = weekOf(isoDate(today), preset === 'week' ? 0 : -1);   // Monday to Sunday of this week, or the one before
            fromEl.value = w.start; toEl.value = w.end;
        }
        filterJobs();
    }

    function shiftGuideWeek(dir) {
        const fromEl = document.getElementById('guideDateFrom'), toEl = document.getElementById('guideDateTo');
        const base = mondayOf(fromEl.value || isoDate(new Date()));
        const w = weekOf(base, dir);
        fromEl.value = w.start; toEl.value = w.end;
        renderTechGuideContent();
    }

    function setGuideDateRange(preset) {
        const fromEl = document.getElementById('guideDateFrom');
        const toEl = document.getElementById('guideDateTo');
        const today = new Date();
        const iso = d => isoDate(d);
        if (preset === 'today') {
            fromEl.value = iso(today); toEl.value = iso(today);
        } else if (preset === 'week' || preset === 'lastweek') {
            // Weeks run Monday to Sunday (the whole week, so a Monday never collapses to a single day).
            const w = weekOf(iso(today), preset === 'week' ? 0 : -1);
            fromEl.value = w.start; toEl.value = w.end;
        } else {
            fromEl.value = ''; toEl.value = '';
        }
        renderTechGuideContent();
    }

    // ONE place that works out, per technician, what they EARNED on each job.
    // The Technicians Guide table AND the printed technician report both use it, so they can never disagree.
    // With a date range set, a job's dues are prorated by the share of the technician's scheduled days
    // on that job that fall inside the range. What they were PAID comes only from the dated 💵 payments.
    // ---------- Percentage dues from the money actually received in a period, not the job's whole total ----------
    function isPercentType(type) { return type === 'فني لوحده (%60)' || type === 'نسبة (50%)' || type === 'نسبة مخصصة'; }
    function percentOf(tech) {
        if (tech.type === 'فني لوحده (%60)') return 0.6;
        if (tech.type === 'نسبة (50%)') return 0.5;
        return (tech.customPercent !== undefined ? parseVal(tech.customPercent) : 50) / 100;
    }
    function inRangeSum(arr, dateFrom, dateTo) {
        return round2((arr || []).filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo)).reduce((s, e) => s + parseVal(e.amount), 0));
    }
    // The base for a percentage technician's pay IN A GIVEN PERIOD: only the client payments and material
    // invoices actually DATED inside that period (never the job's running totals, and never an undated legacy
    // amount, exactly like the dated ledgers already work). If materials outspend receipts that period, the
    // base is zero for that period — it is not carried into the next one.
    function percentBaseForPeriod(job, dateFrom, dateTo) {
        const recv = inRangeSum(job.receipts, dateFrom, dateTo);
        const mat = inRangeSum(job.materialEntries, dateFrom, dateTo);
        return Math.max(0, round2(recv - mat));
    }

    // A stand-in for the job currently open in the form, built from what's on screen right now (not yet
    // saved). Lets the money-status panel and the Guide-identical stats function react as you type, without
    // needing a second copy of the calculation logic.
    function currentEditingJobSnapshot() {
        const id = document.getElementById('editingJobId').value;
        const original = id ? savedJobs.find(j => j.id === id) : null;
        return {
            id: id || '__unsaved__',
            amountReceived: parseVal(document.getElementById('amountReceived').value),
            materialCost: parseVal(document.getElementById('materialCost').value),
            extraExpenses: parseVal(document.getElementById('extraExpenses').value),
            receipts: currentReceipts,
            materialEntries: currentMaterialEntries,
            technicians: technicians,
            clientName: document.getElementById('clientName').value,
            dailySchedule: original ? original.dailySchedule : [],
            scheduledDate: original ? original.scheduledDate : undefined,
            assignedTeam: original ? original.assignedTeam : undefined,
            scheduledTime: original ? original.scheduledTime : undefined,
            startDate: original ? original.startDate : document.getElementById('startDate').value,
            endDate: original ? original.endDate : document.getElementById('endDate').value
        };
    }
    // Runs computeTechPeriodStats with the OPEN job replaced by its live, unsaved state — so the job screen's
    // panel and the Technicians Guide always agree, because they run through the exact same function.
    function techStatsWithLiveJob(dateFrom, dateTo) {
        const snap = currentEditingJobSnapshot();
        const backup = savedJobs;
        savedJobs = backup.filter(j => j.id !== snap.id).concat([snap]);
        try { return computeTechPeriodStats(dateFrom, dateTo); }
        finally { savedJobs = backup; }
    }
    // Days this technician is scheduled on THIS job that collide with a day he's also scheduled on another
    // job — the usual sign that a daily/fixed amount is about to be counted for the same day twice.
    function techScheduleOverlaps(techName, thisJobId) {
        if (!thisJobId || !techName) return [];
        const thisJob = savedJobs.find(j => j.id === thisJobId);
        if (!thisJob) return [];
        const myDates = new Set(getScheduleEntries(thisJob).filter(e => (e.team || []).includes(techName)).map(e => e.date));
        if (myDates.size === 0) return [];
        const hits = [];
        savedJobs.forEach(job => {
            if (job.id === thisJobId) return;
            getScheduleEntries(job).forEach(e => {
                if (!(e.team || []).includes(techName) || !myDates.has(e.date)) return;
                const otherTech = (job.technicians || []).find(t => t.name === techName);
                const otherAmount = round2((otherTech && otherTech.dailyAlloc || []).filter(d => d.date === e.date).reduce((s, d) => s + parseVal(d.amount), 0));
                hits.push({ date: e.date, jobName: job.clientName || '', jobId: job.id, otherAmount });
            });
        });
        return hits.sort((a, b) => a.date.localeCompare(b.date));
    }

    function computeTechPeriodStats(dateFrom, dateTo) {
        const hasDateFilter = !!(dateFrom || dateTo);
        const stats = {};
        savedJobs.forEach(job => {
            const entries = getScheduleEntries(job);
            (job.technicians || []).forEach(tech => {
                if (!tech.name) return;
                const fullDues = calculateJobTechDues(tech, job.amountReceived, job.materialCost);
                // Weeks typed on the job win: a week belongs to the period when its Monday is inside it. No splitting.
                const manualWeeks = (tech.weeks || []).filter(w => w && w.weekStart);
                const reimbEntries = techReimbEntriesInRange(tech, dateFrom, dateTo);
                const reimbSum = round2(reimbEntries.reduce((s, e) => s + parseVal(e.amount), 0));
                if (manualWeeks.length > 0) {
                    const counted = manualWeeks.filter(w => (!dateFrom || w.weekStart >= dateFrom) && (!dateTo || w.weekStart <= dateTo));
                    if (hasDateFilter && counted.length === 0 && reimbSum <= 0.005) return;
                    const manualDues = round2(counted.reduce((s, w) => s + parseVal(w.amount), 0) + reimbSum);
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += manualDues;
                    stats[tech.name].jobs.push({ job, tech, dues: manualDues, fullDues, fraction: 1, daysIn: 0, daysAll: 0, dates: [], manual: true, weeks: counted, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                // A fixed/daily/hourly technician's day-by-day allocations (his own flat day rate split across
                // whichever jobs he worked that day) win next — same idea as typed weeks, at day granularity,
                // and cross-job aware via techScheduleOverlaps() below. Never used for percentage pay, which
                // already follows the period's money.
                const dailyEntries = isPercentType(tech.type) ? [] : (tech.dailyAlloc || []).filter(e => e && e.date);
                if (dailyEntries.length > 0) {
                    const countedDaily = dailyEntries.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo));
                    const dailyDues = round2(countedDaily.reduce((s, e) => s + parseVal(e.amount), 0));
                    if (hasDateFilter && dailyDues <= 0.005 && reimbSum <= 0.005) return;
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += dailyDues + reimbSum;
                    stats[tech.name].jobs.push({ job, tech, dues: round2(dailyDues + reimbSum), fullDues, dailyManual: true, dailyEntries: countedDaily, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                // Percentage technicians: with a period picked, pay follows the DATED client money for that
                // period (not the schedule) — see percentBaseForPeriod. Without a period, or for any other
                // pay type, dues still follow the schedule days as before.
                if (hasDateFilter && isPercentType(tech.type)) {
                    const periodRecv = inRangeSum(job.receipts, dateFrom, dateTo);
                    const periodMat = inRangeSum(job.materialEntries, dateFrom, dateTo);
                    const periodBase = Math.max(0, round2(periodRecv - periodMat));
                    const pct = percentOf(tech);
                    const wageDues = round2(periodBase * pct);
                    if (wageDues <= 0.005 && reimbSum <= 0.005) return;
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += wageDues + reimbSum;
                    stats[tech.name].jobs.push({ job, tech, dues: round2(wageDues + reimbSum), fullDues, isPercentPeriod: true, periodRecv, periodMat, periodBase, pct: Math.round(pct * 100), legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                let fraction = 1, daysIn = 0, daysAll = 0, dates = [];
                if (hasDateFilter) {
                    const allDates = entries.filter(e => (e.team || []).includes(tech.name));
                    if (allDates.length === 0 && reimbSum <= 0.005) return;
                    if (allDates.length > 0) {
                        const inPeriod = allDates.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo));
                        if (inPeriod.length === 0 && reimbSum <= 0.005) return;
                        fraction = allDates.length ? inPeriod.length / allDates.length : 0;
                        daysIn = inPeriod.length; daysAll = allDates.length; dates = allDates.map(e => e.date);
                    } else { fraction = 0; }   // no scheduled days in range, but there IS a reimbursement dated inside it
                }
                const wageDues = round2(fullDues * fraction);
                if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                stats[tech.name].dues += wageDues + reimbSum;
                stats[tech.name].jobs.push({ job, tech, dues: round2(wageDues + reimbSum), fullDues, fraction, daysIn, daysAll, dates, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
            });
        });
        return stats;
    }

    // Payments logged with the 💵 button (dated, per technician) that fall inside the range.
    function techPaymentsInPeriod(name, dateFrom, dateTo) {
        return techPayments.filter(p => p.name === name &&
            (!dateFrom || (p.date && p.date >= dateFrom)) && (!dateTo || (p.date && p.date <= dateTo)));
    }

    function showTechDetails(name) {
        const sel = document.getElementById('guideTechFilter');
        sel.value = name;
        renderTechGuideContent();
        const d = document.querySelector('#techGuideContent .tg-detail');
        if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function deleteTechPayment(at) {
        const idx = techPayments.findIndex(p => p.at === at);
        if (idx === -1) return;
        if (!confirm(t('confirmDeleteTechPayment'))) return;
        const removed = techPayments[idx];
        techPayments.splice(idx, 1);
        try {
            await TECH_PAYMENTS_DOC.set({ entries: techPayments });
            logActivity('delete', removed.name || '', `${t('guidePaymentsTitle')}: $${parseVal(removed.amount).toFixed(2)} (${removed.date || ''})`);
        } catch (err) {
            techPayments.splice(idx, 0, removed);
            alert(t('alertJobSaveFailed') + ' (' + (err && err.message ? err.message : 'unknown error') + ')');
        }
        renderTechGuideContent();
    }

    // Everything about ONE technician in the selected period: the jobs behind his dues, and his payments.
    function renderTechDetailHtml(name, stats, dateFrom, dateTo) {
        const s = stats[name];
        const jobs = s ? s.jobs.slice().sort((a, b) => (a.job.startDate || '').localeCompare(b.job.startDate || '')) : [];
        const pays = techPaymentsInPeriod(name, dateFrom, dateTo).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const noDates = !dateFrom && !dateTo;
        const legacyTotal = round2(jobs.reduce((s, j) => s + (j.legacyPaid || 0), 0));
        let h = '<div class="tg-detail">';
        if (legacyTotal > 0) h += `<div class="note-box" style="margin-bottom:10px;">${t('guideLegacyTotal').replace('{a}', ltrAmt(legacyTotal))}</div>`;
        h += `<h4>${t(noDates ? 'guideJobsTitleAll' : 'guideJobsTitle')} (${jobs.length})</h4>`;
        if (jobs.length === 0) h += `<div class="tg-empty">${t('guideNoJobsInPeriod')}</div>`;
        jobs.forEach(j => {
            h += `<div class="tg-detail-row"><span class="tg-d-date">${escHtml(j.job.startDate || '')}</span><span class="tg-d-main"><button type="button" onclick="openJobOverlay('${jsArg(j.job.id)}')" style="background:none; border:none; padding:0; margin:0; font:inherit; font-weight:700; color:#38bdf8; text-decoration:underline; cursor:pointer;">${escHtml(j.job.clientName || '')}</button> <small style="color:var(--text-muted);">${techTypeLabel(j.tech.type)}</small>${j.manual ? `<div class="ag-meta" style="color:#34d399;">📆 ${t('guideManualNote')}: ${j.weeks.map(w => escHtml(w.weekStart) + ' ' + ltrAmt(w.amount)).join(' · ')}</div>` : ''}${j.dailyManual ? `<div class="ag-meta" style="color:#a78bfa;">📅 ${t('dailyAllocNote')}: ${j.dailyEntries.map(e => escHtml(e.date) + ' ' + ltrAmt(e.amount)).join(' · ')}</div>` : ''}${j.isPercentPeriod ? `<div class="ag-meta" style="color:#38bdf8;">${t('tmsMoneyBaseNote').replace('{recv}', ltrAmt(j.periodRecv)).replace('{mat}', ltrAmt(j.periodMat)).replace('{base}', ltrAmt(j.periodBase)).replace('{pct}', j.pct)}</div>` : ''}${(!j.isPercentPeriod && !j.dailyManual && j.fraction < 0.9999) ? `<div class="ag-meta" style="color:#fbbf24;">${t('guideProrateNote').replace('{a}', j.daysIn).replace('{b}', j.daysAll).replace('{full}', '<span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">$' + j.fullDues.toFixed(2) + '</span>')}</div>` : ''}${(!j.isPercentPeriod && !j.dailyManual && j.fraction < 0.9999) ? `<div class="ag-meta">${t('guideEditDaysHint')}</div><div class="ag-actions">${j.dates.filter(d => (!dateFrom || d >= dateFrom) && (!dateTo || d <= dateTo)).sort().map(d => `<button class="secondary" onclick="openEditScheduleModal('${jsArg(j.job.id)}', '${jsArg(d)}')">📅 ${escHtml(d)}</button>`).join('')}</div>` : ''}${j.legacyPaid > 0 ? `<div class="ag-meta">${t('guideLegacyPaid').replace('{a}', ltrAmt(j.legacyPaid))}</div>` : ''}${j.reimbEntries && j.reimbEntries.length > 0 ? `<div class="ag-meta" style="color:#fb923c;">🧾 ${t('reimbTitle')}: ${j.reimbEntries.map(e => escHtml(e.date) + ' ' + ltrAmt(e.amount)).join(' · ')}</div>` : ''}</span><strong style="color:#fbbf24;">$${j.dues.toFixed(2)}</strong></div>`;
        });
        h += `<h4 style="margin-top:14px;">${t(noDates ? 'guidePaymentsTitleAll' : 'guidePaymentsTitle')} (${pays.length})</h4>`;
        if (pays.length === 0) h += `<div class="tg-empty">${t('guideNoPaymentsInPeriod')}</div>`;
        pays.forEach(p => {
            h += `<div class="tg-detail-row"><span class="tg-d-date">${escHtml(p.date || '')}</span><span class="tg-d-main">${escHtml(p.note || '')}</span><strong style="color:#34d399;">$${parseVal(p.amount).toFixed(2)}</strong><button class="secondary" onclick="openTechPaymentEdit('${jsArg(p.at || '')}')" style="padding:3px 9px; font-size:0.72rem;">${t('editBtn')}</button><button class="danger" onclick="deleteTechPayment('${escJs(p.at || '')}')" style="padding:3px 9px; font-size:0.72rem;">${t('deleteBtn')}</button></div>`;
        });
        return h + '</div>';
    }

    function renderTechGuideContent() {
        const container = document.getElementById('techGuideContent');
        const dateFrom = document.getElementById('guideDateFrom').value;
        const dateTo = document.getElementById('guideDateTo').value;
        const hasDateFilter = !!(dateFrom || dateTo);
        const periodLabel = (hasDateFilter ? `<div class="note-box" style="margin-bottom:10px;">${t('guidePeriodNote')}</div>` : '')
            + `<div class="note-box" style="margin-bottom:10px;">${t('guidePaidNote')}</div>`;

        const stats = computeTechPeriodStats(dateFrom, dateTo);
        const allNames = new Set([...Object.keys(stats), ...Object.keys(technicianPhones)]);
        // Technician picker next to the dates: pick one to see only him, with all his data underneath.
        const techSel = document.getElementById('guideTechFilter');
        const previouslySelected = techSel ? techSel.value : '';
        if (techSel) {
            const sortedNames = [...allNames].sort((a, b) => a.localeCompare(b));
            techSel.innerHTML = `<option value="">${t('allTechs')}</option>` + sortedNames.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
            techSel.value = sortedNames.includes(previouslySelected) ? previouslySelected : '';
        }
        const selectedTech = techSel ? techSel.value : '';
        const shownNames = selectedTech ? [selectedTech] : [...allNames];
        if (allNames.size === 0) { container.innerHTML = periodLabel + `<p style="text-align:center; color:var(--text-muted); padding:20px;">${t('guideEmpty')}</p>`; return; }

        let html = periodLabel + `<table style="width:100%; border-collapse:collapse; margin-top:10px;"><thead><tr><th>${t('guideThName')}</th><th>${t('guideThPhone')}</th><th>${t('guideThDuesInPeriod')}</th><th>${t('guideThPaidInPeriod')}</th><th>${t('guideThRemainingInPeriod')}</th><th>${t('guideThActions')}</th></tr></thead><tbody>`;
        shownNames.forEach(name => {
            const dues = stats[name] ? stats[name].dues : 0;
            const paidInPeriod = techPaymentsInPeriod(name, dateFrom, dateTo).reduce((sum, p) => sum + parseVal(p.amount), 0);
            const remainingInPeriod = dues - paidInPeriod;
            const rawPhone = technicianPhones[name] || '';
            const phoneDisplay = rawPhone ? (() => { const { code, local } = splitPhoneForEdit(rawPhone); return code === 'other' ? rawPhone : `+${code} ${local}`; })() : t('guideNA');
            const phoneHtml = rawPhone ? `<span dir="ltr" style="unicode-bidi:isolate; display:inline-block;">${phoneDisplay}</span>` : phoneDisplay;
            html += `<tr><td data-label=""><strong>${name}</strong></td><td data-label="${t('guideThPhone')}">${phoneHtml}</td>
                <td data-label="${t('guideThDuesInPeriod')}" style="color:#fbbf24; font-weight:700;">$${dues.toFixed(2)}</td>
                <td data-label="${t('guideThPaidInPeriod')}" style="color:#34d399; font-weight:700;">$${paidInPeriod.toFixed(2)}</td>
                <td data-label="${t('guideThRemainingInPeriod')}" style="color:${remainingInPeriod > 0 ? '#f87171' : '#94a3b8'}; font-weight:700;">$${remainingInPeriod.toFixed(2)}</td>
                <td data-label="" class="tg-actions-cell"><div class="tg-actions">
                    <button class="secondary" onclick="showTechDetails('${jsArg(name)}')" style="padding:4px 8px; font-size:0.75rem; background:#475569;">🔎 ${t('guideDetailsBtn')}</button>
                    <button class="secondary" onclick="openTechPaymentPrompt('${escJs(name)}')" style="padding:4px 8px; font-size:0.75rem; background:#7c3aed;">💵</button>
                    <button class="secondary" onclick="sendWhatsAppTech('${escJs(name)}', '${escJs(rawPhone)}', ${dues})" style="padding:4px 8px; font-size:0.75rem; background:#059669;">${t('guideWhatsAppBtn')}</button>
                    <button class="secondary" onclick="printTechnicianReport('${escJs(name)}')" style="padding:4px 8px; font-size:0.75rem; background:#0ea5e9;">${t('printReportBtn')}</button>
                    <button class="secondary" onclick="openEditTechnicianModal('${escJs(name)}')" style="padding:4px 8px; font-size:0.75rem; background:#0284c7;">${t('editBtn')}</button>
                    <button class="danger" onclick="deleteTechnicianFromDirectory('${escJs(name)}')" style="padding:4px 8px; font-size:0.75rem;">${t('deleteBtn')}</button>
                </div></td></tr>`;
        });
        html += '</tbody></table>';
        if (selectedTech) html += renderTechDetailHtml(selectedTech, stats, dateFrom, dateTo);
        container.innerHTML = html;
    }

    function updateTechDropdownFilter() {
        const select = document.getElementById('filterTech');
        select.innerHTML = `<option value="">${t('allTechs')}</option>`;
        getUniqueRegisteredTechnicians().forEach(name => {
            const opt = document.createElement('option'); opt.value = name; opt.innerText = name; select.appendChild(opt);
        });
    }

    function clearDateFilter() {
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        filterJobs();
    }

    function jobMatchesCurrentFilters(job) {
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const statusVal = document.getElementById('filterStatus').value;
        const actualTechVal = document.getElementById('filterTech').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;

        const matchSearch = (job.clientName && job.clientName.toLowerCase().includes(searchVal)) ||
                            (job.clientPhone && job.clientPhone.toLowerCase().includes(searchVal)) ||
                            (job.clientAddress && job.clientAddress.toLowerCase().includes(searchVal));
        const matchTech = !actualTechVal || (job.technicians || []).some(tech => tech.name === actualTechVal);
        const matchStatus = !statusVal || job.jobStatus === statusVal;
        const rem = jobRemaining(job);
        const matchDebt = !onlyShowDebt || rem > 0;
        // A job matches the date range if its start date falls within [from, to], OR if
        // any technician actually worked on it (via the Weekly Board) during that range —
        // a job started earlier but worked on this week should still show up this week.
        const jobDate = job.startDate || '';
        const matchStartDate = (!dateFrom || (jobDate && jobDate >= dateFrom)) && (!dateTo || (jobDate && jobDate <= dateTo));
        const scheduleDates = getScheduleEntries(job).map(e => e.date);
        const matchScheduleDate = scheduleDates.some(d => (!dateFrom || d >= dateFrom) && (!dateTo || d <= dateTo));
        const matchDate = !dateFrom && !dateTo ? true : (matchStartDate || matchScheduleDate);

        return matchSearch && matchTech && matchStatus && matchDebt && matchDate;
    }

    // Every job currently matching the search/status/technician/date filters — this is
    // what's actually visible in the table, and what the stat cards now total up.
    function getFilteredJobs() { return savedJobs.filter(jobMatchesCurrentFilters); }

    function filterJobs() {
        document.querySelectorAll('#jobsTableBody tr').forEach(row => {
            const jobId = row.getAttribute('data-id');
            if (!jobId) return;
            const job = savedJobs.find(j => j.id === jobId);
            if (!job) return;
            row.style.display = jobMatchesCurrentFilters(job) ? '' : 'none';
        });
        safeCall(updateGlobalStats);
    }

    // Numbers are now assembled with an explicit country code when entered (buildFullPhone),
    // so this just cleans stray formatting characters — it no longer guesses a country.
    function normalizePhone(phone) {
        if (!phone) return '';
        return String(phone).replace(/[^\d]/g, '');
    }

    function sendWhatsAppTech(name, phone, dues) {
        const normalized = normalizePhone(phone);
        if (!normalized) { alert(t('alertPhoneUnavailable')); return; }
        const msg = currentLang === 'ar'
            ? `مرحباً بك يا ${name}، إجمالي المستحقات الخاصة بك حتى الآن هو: $${dues.toFixed(2)}`
            : `Hi ${name}, your total dues so far are: $${dues.toFixed(2)}`;
        window.open(`https://wa.me/${normalized}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function sendWhatsAppShareSM() {
        let totalShareS = 0, totalShareM = 0;
        savedJobs.forEach(job => { const { shareS, shareM } = jobNet(job); totalShareS += shareS; totalShareM += shareM; });
        const msg = currentLang === 'ar'
            ? `تقرير حصص الأرباح:\nحصة S (40%): $${totalShareS.toFixed(2)}\nحصة M (40%): $${totalShareM.toFixed(2)}`
            : `Profit Share Report:\nS Share (40%): $${totalShareS.toFixed(2)}\nM Share (40%): $${totalShareM.toFixed(2)}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
