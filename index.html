    // ONE place that works out, per technician, what they EARNED on each job.
    // The Technicians Guide table AND the printed technician report both use it, so they can never disagree.
    // With a date range set, a job's dues are prorated by the share of the technician's scheduled days
    // on that job that fall inside the range. What they were PAID comes only from the dated 💵 payments.
    // ---------- Percentage dues from the money actually received in a period, not the job's whole total ----------
    function isPercentType(type) { return type === 'فني لوحده (%60)' || type === 'نسبة (50%)' || type === 'نسبة مخصصة'; }
    function percentOf(tech) {
        if (tech.type === 'فني لوحده (%60)') return 0.6;
        if (tech.type === 'نسبة (50%)') return 0.5;
        return (tech.customPercent !== undefined ? parseVal(tech.customPercent) : 50) / 100;
    }
    function inRangeSum(arr, dateFrom, dateTo) {
        return round2((arr || []).filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo)).reduce((s, e) => s + parseVal(e.amount), 0));
    }
    // The base for a percentage technician's pay IN A GIVEN PERIOD: only the client payments and material
    // invoices actually DATED inside that period (never the job's running totals, and never an undated legacy
    // amount, exactly like the dated ledgers already work). If materials outspend receipts that period, the
    // base is zero for that period — it is not carried into the next one.
    function percentBaseForPeriod(job, dateFrom, dateTo) {
        const recv = inRangeSum(job.receipts, dateFrom, dateTo);
        const mat = inRangeSum(job.materialEntries, dateFrom, dateTo);
        return Math.max(0, round2(recv - mat));
    }

    // Period-scoped S & M share: the same dated-money-in-the-period approach as a percentage
    // technician's pay (percentBaseForPeriod), net of the SAME period-scoped technician dues
    // already shown in this guide's own table (via computeTechPeriodStats) — so "Send S & M
    // Share" reflects ONLY the selected week, not every job's all-time totals. With no date
    // filter this reduces to the exact same all-time numbers it always showed.
    function computeSAndMPeriodShare(dateFrom, dateTo) {
        const hasDateFilter = !!(dateFrom || dateTo);
        const techStats = computeTechPeriodStats(dateFrom, dateTo);
        const jobPeriodTechDues = {};
        Object.values(techStats).forEach(s => s.jobs.forEach(j => {
            jobPeriodTechDues[j.job.id] = round2((jobPeriodTechDues[j.job.id] || 0) + j.dues);
        }));
        // Bonuses (🎁) are a company expense, so they come off net profit before the S/M split —
        // same treatment as technician dues. A bonus tied to a specific job comes off THAT job's
        // own net (at that job's own split ratio); a bonus with no job comes off the combined
        // total at the company's default 40/40 ratio, since there's no specific job's ratio to use.
        const bonusesInRange = techBonuses.filter(b => (!dateFrom || b.date >= dateFrom) && (!dateTo || b.date <= dateTo));
        const jobPeriodBonus = {};
        let generalBonusTotal = 0;
        bonusesInRange.forEach(b => {
            if (b.jobId) jobPeriodBonus[b.jobId] = round2((jobPeriodBonus[b.jobId] || 0) + parseVal(b.amount));
            else generalBonusTotal += parseVal(b.amount);
        });
        let totalShareS = 0, totalShareM = 0, totalShareCompany = 0;
        // Raw period totals (received / materials / tech dues) — not needed for the split math
        // above, but kept so a P&L-style report can show the full waterfall (Revenue → Materials
        // → Tech Dues → Net → Split), not just the final per-partner shares.
        let totalReceived = 0, totalMaterials = 0, totalTechDues = 0;
        // Per-job breakdown — what THIS job alone contributed to S's, M's and the company's
        // share in the period — so a report can show "which job gave how much", not just one
        // combined total. The company's cut also has that job's own extraExpenses taken off it,
        // same as jobNet()'s companyNet — extraExpenses has no date of its own, so it's always
        // applied in full, the same simplification used everywhere else in the app.
        const jobBreakdown = [];
        savedJobs.forEach(job => {
            const periodRecv = hasDateFilter ? inRangeSum(job.receipts, dateFrom, dateTo) : parseVal(job.amountReceived);
            const periodMat = hasDateFilter ? inRangeSum(job.materialEntries, dateFrom, dateTo) : parseVal(job.materialCost);
            const periodBase = hasDateFilter ? percentBaseForPeriod(job, dateFrom, dateTo) : round2(parseVal(job.amountReceived) - parseVal(job.materialCost));
            const techDues = hasDateFilter ? (jobPeriodTechDues[job.id] || 0) : jobNet(job).totalTechDues;
            totalReceived += periodRecv;
            totalMaterials += periodMat;
            totalTechDues += techDues;
            const bonusForJob = jobPeriodBonus[job.id] || 0;
            const netForSplit = round2(periodBase - techDues - bonusForJob);
            const ratio = jobSplitRatio(job);
            const jobShareS = round2(netForSplit * ratio.s);
            const jobShareM = round2(netForSplit * ratio.m);
            const jobShareCompany = round2(netForSplit * ratio.company - parseVal(job.extraExpenses));
            totalShareS += netForSplit * ratio.s;
            totalShareM += netForSplit * ratio.m;
            totalShareCompany += jobShareCompany;
            if (Math.abs(jobShareS) > 0.005 || Math.abs(jobShareM) > 0.005 || Math.abs(jobShareCompany) > 0.005) {
                jobBreakdown.push({ job, shareS: jobShareS, shareM: jobShareM, shareCompany: jobShareCompany });
            }
        });
        if (generalBonusTotal > 0.005) {
            const generalBonusCutS = round2(generalBonusTotal * 0.4);
            const generalBonusCutM = round2(generalBonusTotal * 0.4);
            totalShareS -= generalBonusCutS;
            totalShareM -= generalBonusCutM;
            jobBreakdown.push({ job: null, generalBonus: true, shareS: -generalBonusCutS, shareM: -generalBonusCutM, shareCompany: 0 });
        }
        return {
            totalShareS: round2(totalShareS), totalShareM: round2(totalShareM), totalShareCompany: round2(totalShareCompany), jobBreakdown,
            totalReceived: round2(totalReceived), totalMaterials: round2(totalMaterials), totalTechDues: round2(totalTechDues)
        };
    }

    // A stand-in for the job currently open in the form, built from what's on screen right now (not yet
    // saved). Lets the money-status panel and the Guide-identical stats function react as you type, without
    // needing a second copy of the calculation logic.
    function currentEditingJobSnapshot() {
        const id = document.getElementById('editingJobId').value;
        const original = id ? savedJobs.find(j => j.id === id) : null;
        return {
            id: id || '__unsaved__',
            amountReceived: parseVal(document.getElementById('amountReceived').value),
            materialCost: parseVal(document.getElementById('materialCost').value),
            extraExpenses: parseVal(document.getElementById('extraExpenses').value),
            receipts: currentReceipts,
            materialEntries: currentMaterialEntries,
            technicians: technicians,
            clientName: document.getElementById('clientName').value,
            dailySchedule: original ? original.dailySchedule : [],
            scheduledDate: original ? original.scheduledDate : undefined,
            assignedTeam: original ? original.assignedTeam : undefined,
            scheduledTime: original ? original.scheduledTime : undefined,
            startDate: original ? original.startDate : document.getElementById('startDate').value,
            endDate: original ? original.endDate : document.getElementById('endDate').value
        };
    }
    // Runs computeTechPeriodStats with the OPEN job replaced by its live, unsaved state — so the job screen's
    // panel and the Technicians Guide always agree, because they run through the exact same function.
    function techStatsWithLiveJob(dateFrom, dateTo) {
        const snap = currentEditingJobSnapshot();
        const backup = savedJobs;
        savedJobs = backup.filter(j => j.id !== snap.id).concat([snap]);
        try { return computeTechPeriodStats(dateFrom, dateTo); }
        finally { savedJobs = backup; }
    }
    // Days this technician is scheduled on THIS job that collide with a day he's also scheduled on another
    // job — the usual sign that a daily/fixed amount is about to be counted for the same day twice.
    function techScheduleOverlaps(techName, thisJobId) {
        if (!thisJobId || !techName) return [];
        const thisJob = savedJobs.find(j => j.id === thisJobId);
        if (!thisJob) return [];
        const myDates = new Set(getScheduleEntries(thisJob).filter(e => (e.team || []).includes(techName)).map(e => e.date));
        if (myDates.size === 0) return [];
        const hits = [];
        savedJobs.forEach(job => {
            if (job.id === thisJobId) return;
            getScheduleEntries(job).forEach(e => {
                if (!(e.team || []).includes(techName) || !myDates.has(e.date)) return;
                const otherTech = (job.technicians || []).find(t => t.name === techName);
                const otherAmount = round2((otherTech && otherTech.dailyAlloc || []).filter(d => d.date === e.date).reduce((s, d) => s + parseVal(d.amount), 0));
                hits.push({ date: e.date, jobName: job.clientName || '', jobId: job.id, otherAmount });
            });
        });
        return hits.sort((a, b) => a.date.localeCompare(b.date));
    }

    function computeTechPeriodStats(dateFrom, dateTo) {
        const hasDateFilter = !!(dateFrom || dateTo);
        const stats = {};
        savedJobs.forEach(job => {
            const entries = getScheduleEntries(job);
            (job.technicians || []).forEach(tech => {
                if (!tech.name) return;
                const fullDues = calculateJobTechDues(tech, job.amountReceived, job.materialCost);
                // Weeks typed on the job win: a week belongs to the period when its Monday is inside it. No splitting.
                const manualWeeks = (tech.weeks || []).filter(w => w && w.weekStart);
                const reimbEntries = techReimbEntriesInRange(tech, dateFrom, dateTo);
                const reimbSum = round2(reimbEntries.reduce((s, e) => s + parseVal(e.amount), 0));
                if (manualWeeks.length > 0) {
                    const counted = manualWeeks.filter(w => (!dateFrom || w.weekStart >= dateFrom) && (!dateTo || w.weekStart <= dateTo));
                    if (hasDateFilter && counted.length === 0 && reimbSum <= 0.005) return;
                    const manualDues = round2(counted.reduce((s, w) => s + parseVal(w.amount), 0) + reimbSum);
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += manualDues;
                    stats[tech.name].jobs.push({ job, tech, dues: manualDues, fullDues, fraction: 1, daysIn: 0, daysAll: 0, dates: [], manual: true, weeks: counted, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                // A fixed/daily/hourly technician's day-by-day allocations (his own flat day rate split across
                // whichever jobs he worked that day) win next — same idea as typed weeks, at day granularity,
                // and cross-job aware via techScheduleOverlaps() below. Never used for percentage pay, which
                // already follows the period's money.
                const dailyEntries = isPercentType(tech.type) ? [] : (tech.dailyAlloc || []).filter(e => e && e.date);
                if (dailyEntries.length > 0) {
                    // Once a technician is on the day-by-day money plan for this job, every day he was
                    // actually scheduled/on the team (Weekly Board) should show up here — not just the
                    // days someone has already typed a 📅 amount for. A scheduled day with no amount yet
                    // still shows, at $0, so it's visible as "still needs an amount" instead of silently
                    // disappearing from the period as if he never worked it.
                    const scheduledDates = Array.from(new Set(entries.filter(e => (e.team || []).includes(tech.name)).map(e => e.date)));
                    const byDate = {};
                    dailyEntries.forEach(e => { byDate[e.date] = round2((byDate[e.date] || 0) + parseVal(e.amount)); });
                    scheduledDates.forEach(d => { if (!(d in byDate)) byDate[d] = 0; });
                    const allDaily = Object.keys(byDate).sort().map(date => ({ date, amount: byDate[date] }));
                    const countedDaily = allDaily.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo));
                    const dailyDues = round2(countedDaily.reduce((s, e) => s + parseVal(e.amount), 0));
                    if (hasDateFilter && countedDaily.length === 0 && reimbSum <= 0.005) return;
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += dailyDues + reimbSum;
                    stats[tech.name].jobs.push({ job, tech, dues: round2(dailyDues + reimbSum), fullDues, dailyManual: true, dailyEntries: countedDaily, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                // Percentage technicians: with a period picked, pay follows the DATED client money for that
                // period (not the schedule) — see percentBaseForPeriod. Without a period, or for any other
                // pay type, dues still follow the schedule days as before.
                if (hasDateFilter && isPercentType(tech.type)) {
                    const periodRecv = inRangeSum(job.receipts, dateFrom, dateTo);
                    const periodMat = inRangeSum(job.materialEntries, dateFrom, dateTo);
                    const periodBase = Math.max(0, round2(periodRecv - periodMat));
                    const pct = percentOf(tech);
                    const wageDues = round2(periodBase * pct);
                    if (wageDues <= 0.005 && reimbSum <= 0.005) return;
                    if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                    stats[tech.name].dues += wageDues + reimbSum;
                    stats[tech.name].jobs.push({ job, tech, dues: round2(wageDues + reimbSum), fullDues, isPercentPeriod: true, periodRecv, periodMat, periodBase, pct: Math.round(pct * 100), legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
                    return;
                }
                let fraction = 1, daysIn = 0, daysAll = 0, dates = [];
                if (hasDateFilter) {
                    const allDates = entries.filter(e => (e.team || []).includes(tech.name));
                    if (allDates.length === 0 && reimbSum <= 0.005) return;
                    if (allDates.length > 0) {
                        const inPeriod = allDates.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo));
                        if (inPeriod.length === 0 && reimbSum <= 0.005) return;
                        fraction = allDates.length ? inPeriod.length / allDates.length : 0;
                        daysIn = inPeriod.length; daysAll = allDates.length; dates = allDates.map(e => e.date);
                    } else { fraction = 0; }   // no scheduled days in range, but there IS a reimbursement dated inside it
                }
                const wageDues = round2(fullDues * fraction);
                if (!stats[tech.name]) stats[tech.name] = { dues: 0, jobs: [] };
                stats[tech.name].dues += wageDues + reimbSum;
                stats[tech.name].jobs.push({ job, tech, dues: round2(wageDues + reimbSum), fullDues, fraction, daysIn, daysAll, dates, legacyPaid: parseVal(tech.paid), reimbSum, reimbEntries });
            });
        });
        return stats;
    }

    // Payments logged with the 💵 button (dated, per technician) that fall inside the range.
    // Scoped by settleDate — which week's account this payment closes — not by the day it was
    // actually handed over (p.date). A catch-up payment made this week for an older unpaid week
    // is tagged with that older week's date, so it no longer bleeds into this week's "Remaining
    // in Period". Old payments recorded before this field existed have no settleDate, so they
    // fall back to their own payment date exactly as before.
    function techPaymentsInPeriod(name, dateFrom, dateTo) {
        return techPayments.filter(p => {
            const d = p.settleDate || p.date;
            return p.name === name && (!dateFrom || (d && d >= dateFrom)) && (!dateTo || (d && d <= dateTo));
        });
    }

    // Payments tagged with a specific jobId (made from the job-screen "Pay" button) — lets us
    // show "paid so far ON THIS JOB" per technician, separate from his all-time totals.
    function techPaymentsForJob(jobId, name) {
        return techPayments.filter(p => String(p.jobId) === String(jobId) && p.name === name);
    }
    function techPaidOnJob(jobId, name) {
        return round2(techPaymentsForJob(jobId, name).reduce((s, p) => s + parseVal(p.amount), 0));
    }

    function showTechDetails(name) {
        const sel = document.getElementById('guideTechFilter');
        sel.value = name;
        renderTechGuideContent();
        const d = document.querySelector('#techGuideContent .tg-detail');
        if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function deleteTechPayment(at) {
        const idx = techPayments.findIndex(p => p.at === at);
        if (idx === -1) return;
        if (!confirm(t('confirmDeleteTechPayment'))) return;
        const removed = techPayments[idx];
        techPayments.splice(idx, 1);
        try {
            await TECH_PAYMENTS_DOC.set({ entries: techPayments });
            logActivity('delete', removed.name || '', `${t('guidePaymentsTitle')}: $${parseVal(removed.amount).toFixed(2)} (${removed.date || ''})`);
        } catch (err) {
            techPayments.splice(idx, 0, removed);
            alertSaveError(err);
        }
        renderTechGuideContent();
        safeCall(renderTechnicians);
        safeCall(renderJobPayModalIfOpen);
        safeCall(renderTechPartnerReportContentIfOpen);
        safeCall(renderPartnerReportContentIfOpen);
    }

    // ---------- Technician bonuses: a reward on top of normal job dues (🎁), shown as its own
    // line in the report so it's clear it's a bonus and not pay for extra work. It's scoped to
    // the period by its own date (it's new money for whichever week it's given in), combines
    // into the same total as that week's dues so it can be paid out in one go, and — since it's
    // a reward the company is giving, not job income — it comes off net profit before the S/M
    // split (optionally against one specific job's own split ratio, if tied to a job). ----------
    let techBonusName = '';
    let editingBonusAt = '';
    function openTechBonusPrompt(name) {
        editingBonusAt = '';
        techBonusName = name;
        document.getElementById('techBonusTitleEl').textContent = t('techBonusTitle');
        document.getElementById('techBonusNameLabel').textContent = name;
        document.getElementById('techBonusAmount').value = '';
        document.getElementById('techBonusDate').value = isoDate(new Date());
        document.getElementById('techBonusNote').value = '';
        const jobSel = document.getElementById('techBonusJobSelect');
        const jobs = jobsWhereTech(name);
        jobSel.innerHTML = `<option value="">${t('techBonusJobNone')}</option>` +
            jobs.map(j => `<option value="${escHtml(j.id)}">${escHtml(j.clientName || '')}${j.startDate ? ' — ' + escHtml(j.startDate) : ''}</option>`).join('');
        jobSel.value = '';
        document.getElementById('techBonusModal').style.display = 'flex';
    }
    function openTechBonusEdit(at) {
        const b = techBonuses.find(x => x.at === at);
        if (!b) return;
        editingBonusAt = at;
        techBonusName = b.name;
        document.getElementById('techBonusTitleEl').textContent = t('techBonusTitle');
        document.getElementById('techBonusNameLabel').textContent = b.name;
        document.getElementById('techBonusAmount').value = parseVal(b.amount);
        document.getElementById('techBonusDate').value = b.date || isoDate(new Date());
        document.getElementById('techBonusNote').value = b.note || '';
        const jobSel = document.getElementById('techBonusJobSelect');
        const jobs = jobsWhereTech(b.name);
        jobSel.innerHTML = `<option value="">${t('techBonusJobNone')}</option>` +
            jobs.map(j => `<option value="${escHtml(j.id)}">${escHtml(j.clientName || '')}${j.startDate ? ' — ' + escHtml(j.startDate) : ''}</option>`).join('');
        jobSel.value = b.jobId || '';
        document.getElementById('techBonusModal').style.display = 'flex';
    }
    function closeTechBonusModal() { document.getElementById('techBonusModal').style.display = 'none'; editingBonusAt = ''; }

    async function saveTechBonus() {
        const amount = parseVal(document.getElementById('techBonusAmount').value);
        const date = document.getElementById('techBonusDate').value;
        const note = document.getElementById('techBonusNote').value.trim();
        const jobId = document.getElementById('techBonusJobSelect').value || null;
        if (amount <= 0) { alert(t('alertBonusAmountRequired')); return; }
        const job = jobId ? savedJobs.find(j => String(j.id) === String(jobId)) : null;

        if (editingBonusAt) {
            const idx = techBonuses.findIndex(x => x.at === editingBonusAt);
            if (idx === -1) { closeTechBonusModal(); renderTechGuideContent(); return; }
            const backup = { ...techBonuses[idx] };
            techBonuses[idx] = { ...backup, amount, date, note, jobId, jobClientName: job ? (job.clientName || '') : '', editedBy: currentUserEmail || '?', editedAt: new Date().toISOString() };
            try {
                await TECH_BONUSES_DOC.set({ entries: techBonuses });
                logActivity('edit', backup.name || '', `${t('techBonusTitle')}: $${parseVal(backup.amount).toFixed(2)} (${backup.date || ''}) → $${amount.toFixed(2)} (${date})`);
            } catch (err) {
                techBonuses[idx] = backup;
                alertSaveError(err);
                return;
            }
            closeTechBonusModal();
            renderTechGuideContent();
            return;
        }

        const entry = { name: techBonusName, amount, date, note, jobId, jobClientName: job ? (job.clientName || '') : '', by: currentUserEmail || '?', at: new Date().toISOString() };
        try {
            techBonuses.unshift(entry);
            await TECH_BONUSES_DOC.set({ entries: techBonuses });
            logActivity('add', techBonusName, `${t('techBonusTitle')}: $${amount.toFixed(2)}`);
            closeTechBonusModal();
            renderTechGuideContent();
        } catch (err) {
            techBonuses = techBonuses.filter(x => x !== entry);
            alertSaveError(err);
        }
    }

    async function deleteTechBonus(at) {
        const idx = techBonuses.findIndex(b => b.at === at);
        if (idx === -1) return;
        if (!confirm(t('confirmDeleteTechBonus'))) return;
        const removed = techBonuses[idx];
        techBonuses.splice(idx, 1);
        try {
            await TECH_BONUSES_DOC.set({ entries: techBonuses });
            logActivity('delete', removed.name || '', `${t('techBonusTitle')}: $${parseVal(removed.amount).toFixed(2)} (${removed.date || ''})`);
        } catch (err) {
            techBonuses.splice(idx, 0, removed);
            alertSaveError(err);
        }
        renderTechGuideContent();
    }

    // Bonuses logged with the 🎁 button that fall inside the range, scoped by their own date
    // (the week they were given in) — same idea as techPaymentsInPeriod, for bonuses instead of payments.
    function techBonusesInPeriod(name, dateFrom, dateTo) {
        return techBonuses.filter(b => b.name === name &&
            (!dateFrom || (b.date && b.date >= dateFrom)) && (!dateTo || (b.date && b.date <= dateTo)));
    }
    function techBonusTotalInPeriod(name, dateFrom, dateTo) {
        return round2(techBonusesInPeriod(name, dateFrom, dateTo).reduce((s, b) => s + parseVal(b.amount), 0));
    }

    function renderJobPayModalIfOpen() {
        if (document.getElementById('jobPayModal').style.display === 'flex') renderJobPayModal();
    }
    function renderTechPartnerReportContentIfOpen() {
        if (document.getElementById('techPartnerReportModal').style.display === 'flex') renderTechPartnerReportContent();
    }
    // Logs a payment for whoever's selected in this report, without leaving the screen — same
    // payments ledger the Technicians Guide's 💵 button writes to (techPayments), so it comes
    // straight off "Paid" / "Remaining" here too, whether this person was paid as a technician
    // or as a partner.
    function payTechPartnerReportPerson() {
        const name = document.getElementById('techPartnerReportSelect').value;
        if (!name) { alert(t('noTechPartnerJobs')); return; }
        openTechPaymentPrompt(name);
    }

    // ===== Job-screen "Pay" modal: pay technicians out of THIS job's collected money, =====
    // ===== then see what's left to split between company/partner by the job's ratio.  =====
    let jobPayCurrentJobId = null;

    function openJobPayModal(jobId) {
        jobId = String(jobId);
        const job = savedJobs.find(j => String(j.id) === jobId);
        if (!job) return;
        jobPayCurrentJobId = jobId;
        closeOtherTopModals('jobPayModal');
        document.getElementById('jobPayModal').style.display = 'flex';
        renderJobPayModal();
    }
    function closeJobPayModal() {
        document.getElementById('jobPayModal').style.display = 'none';
        jobPayCurrentJobId = null;
    }

    function renderJobPayModal() {
        const job = savedJobs.find(j => String(j.id) === String(jobPayCurrentJobId));
        if (!job) { closeJobPayModal(); return; }

        document.getElementById('jobPayClientLine').textContent = `${job.clientName || ''}${job.startDate ? ' — ' + job.startDate : ''}`;

        const received = parseVal(job.amountReceived);
        const technicians = job.technicians || [];

        // Per-technician: full dues on this job, how much of that has already been paid
        // FROM THIS JOB specifically (tagged payments), and what's left for this job.
        let totalPaidOnJobAllTechs = 0;
        const techRows = technicians.map((tech, idx) => {
            const dues = calculateJobTechDuesWithReimbursement(tech, job.amountReceived, job.materialCost);
            const paidOnJob = techPaidOnJob(job.id, tech.name || '');
            totalPaidOnJobAllTechs += paidOnJob;
            const remainingOnJob = round2(dues - paidOnJob);
            const payments = techPaymentsForJob(job.id, tech.name || '').slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const paymentsHtml = payments.map(p => `
                <div class="ledger-row" style="font-size:0.75rem;">
                    <span>${escHtml(p.date || '')}</span>
                    <strong style="color:#34d399;">${ltrAmt(p.amount)}</strong>
                    <span class="ledger-note">${escHtml(p.note || '')}</span>
                    <button type="button" class="ledger-del" onclick="deleteTechPayment('${p.at}')">🗑</button>
                </div>`).join('');
            return `
                <div style="border:1px solid var(--border-color); border-radius:10px; padding:10px 12px; margin-bottom:10px;">
                    <div style="font-weight:700; margin-bottom:6px;">👷 ${escHtml(tech.name || '?')}</div>
                    <div style="font-size:0.8rem; display:flex; flex-wrap:wrap; gap:14px; margin-bottom:8px;">
                        <span>${t('jobPayDuesLabel')} <strong style="color:#fbbf24;">${ltrAmt(dues)}</strong></span>
                        <span>${t('jobPayPaidOnJobLabel')} <strong style="color:#34d399;">${ltrAmt(paidOnJob)}</strong></span>
                        <span>${t('jobPayRemainingOnJobLabel')} <strong style="color:${remainingOnJob > 0.005 ? '#f87171' : '#34d399'};">${ltrAmt(remainingOnJob)}</strong></span>
                    </div>
                    ${paymentsHtml}
                    <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
                        <input type="text" id="jobPayAmount-${idx}" placeholder="0" value="${remainingOnJob > 0.005 ? remainingOnJob.toFixed(2) : ''}" onfocus="this.select()" style="width:110px;">
                        <input type="date" id="jobPayDate-${idx}" value="${isoDate(new Date())}" style="width:140px;">
                        <input type="text" id="jobPayNote-${idx}" data-i18n-ph="companyExpenseNotePh" style="flex:1; min-width:120px;">
                        <button class="success" style="padding:7px 12px; font-size:0.8rem;" onclick="addJobTechPayment('${idx}')" data-i18n="jobPayRecordBtn"></button>
                    </div>
                </div>`;
        }).join('') || `<p style="text-align:center; color:var(--text-muted); padding:10px;">${t('noTechData')}</p>`;

        document.getElementById('jobPayTechList').innerHTML = techRows;

        // Partners get the exact same due/paid/remaining/record-a-payment treatment as technicians,
        // using the SAME payments ledger (tagged by jobId + name) — it's just "money paid to a
        // person for this job", whether that person is a technician or a profit-share partner.
        const { extraShares } = jobNet(job);
        const partnersList = (job.extraPartners || []).filter(p => parseVal(p.percent) > 0.005);
        const partnerRows = partnersList.map((p, idx) => {
            const share = extraShares.find(x => (x.name || '').trim() === (p.name || '').trim());
            const due = share ? share.amount : 0;
            const paidOnJob = techPaidOnJob(job.id, p.name || '');
            const remainingOnJob = round2(due - paidOnJob);
            const payments = techPaymentsForJob(job.id, p.name || '').slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const paymentsHtml = payments.map(pay => `
                <div class="ledger-row" style="font-size:0.75rem;">
                    <span>${escHtml(pay.date || '')}</span>
                    <strong style="color:#34d399;">${ltrAmt(pay.amount)}</strong>
                    <span class="ledger-note">${escHtml(pay.note || '')}</span>
                    <button type="button" class="ledger-del" onclick="deleteTechPayment('${pay.at}')">🗑</button>
                </div>`).join('');
            return `
                <div style="border:1px solid var(--border-color); border-radius:10px; padding:10px 12px; margin-bottom:10px;">
                    <div style="font-weight:700; margin-bottom:6px;">🤝 ${escHtml(p.name || '?')} (${Math.round(parseVal(p.percent))}%)</div>

        // right now", not the job's final total profit, so it supports weekly check-ins

        const ratio = jobSplitRatio(job);
        const shareS = round2(cashAvailable * ratio.s);

        const companyShare = round2(cashAvailable * ratio.company);
        const extraRows = (job.extraPartners || []).filter(p => parseVal(p.percent) > 0.005).map(p => {

    function jobMatchesCurrentFilters(job) {
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const statusVal = document.getElementById('filterStatus').value;
        const actualTechVal = document.getElementById('filterTech').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;

        const matchSearch = (job.clientName && job.clientName.toLowerCase().includes(searchVal)) ||
                            (job.clientPhone && job.clientPhone.toLowerCase().includes(searchVal)) ||
                            (job.clientAddress && job.clientAddress.toLowerCase().includes(searchVal));
        const matchTech = !actualTechVal || (job.technicians || []).some(tech => tech.name === actualTechVal);
        const matchStatus = !statusVal || job.jobStatus === statusVal;
        const rem = jobRemaining(job);
        const matchDebt = !onlyShowDebt || rem > 0;
        // A job matches the date range if its start date falls within [from, to], OR if
        // any technician actually worked on it (via the Weekly Board) during that range —
        // a job started earlier but worked on this week should still show up this week.
        const jobDate = job.startDate || '';
        const matchStartDate = (!dateFrom || (jobDate && jobDate >= dateFrom)) && (!dateTo || (jobDate && jobDate <= dateTo));
        const scheduleDates = getScheduleEntries(job).map(e => e.date);
        const matchScheduleDate = scheduleDates.some(d => (!dateFrom || d >= dateFrom) && (!dateTo || d <= dateTo));
        const matchDate = !dateFrom && !dateTo ? true : (matchStartDate || matchScheduleDate);

        return matchSearch && matchTech && matchStatus && matchDebt && matchDate;
    }

    // Every job currently matching the search/status/technician/date filters — this is
    // what's actually visible in the table, and what the stat cards now total up.
    function getFilteredJobs() { return savedJobs.filter(jobMatchesCurrentFilters); }

    function filterJobs() {
        document.querySelectorAll('#jobsTableBody tr').forEach(row => {
            const jobId = row.getAttribute('data-id');
            if (!jobId) return;
            const job = savedJobs.find(j => j.id === jobId);
            if (!job) return;
            row.style.display = jobMatchesCurrentFilters(job) ? '' : 'none';
        });
        safeCall(updateGlobalStats);
    }

    // Numbers are now assembled with an explicit country code when entered (buildFullPhone),
    // so this just cleans stray formatting characters — it no longer guesses a country.
    function normalizePhone(phone) {
        if (!phone) return '';
        return String(phone).replace(/[^\d]/g, '');
    }

    function sendWhatsAppTech(name, phone, dues, bonus) {
        const normalized = normalizePhone(phone);
        if (!normalized) { alert(t('alertPhoneUnavailable')); return; }
        bonus = parseVal(bonus);
        // The basic calculation and the bonus are always shown as two separate lines (never
        // blended into one number) so the technician can tell a reward from his regular pay.
        const bonusLine = bonus > 0.005
            ? (currentLang === 'ar' ? `\n🎁 بونس: $${bonus.toFixed(2)}\nالإجمالي: $${(dues + bonus).toFixed(2)}` : `\n🎁 Bonus: $${bonus.toFixed(2)}\nTotal: $${(dues + bonus).toFixed(2)}`)
            : '';
        const msg = currentLang === 'ar'
            ? `مرحباً بك يا ${name}، إجمالي المستحقات الخاصة بك حتى الآن هو: $${dues.toFixed(2)}${bonusLine}`
            : `Hi ${name}, your total dues so far are: $${dues.toFixed(2)}${bonusLine}`;
        window.open(`https://wa.me/${normalized}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Sends ONE person's (or the company's) share on its own, with a line per job showing what
    // THAT job alone contributed — never bundled with anyone else's number into one message.
    // dateFromId/dateToId point at whichever screen's own date filter is currently showing
    // (the S & M Account screen's wdFilterFrom/wdFilterTo, or the Company Account screen's
    // ceFilterFrom/ceFilterTo) — same period math as that screen's own figures either way.
    function sendWhatsAppSharePartner(partner, dateFromId, dateToId) {
        const dateFrom = document.getElementById(dateFromId).value;
        const dateTo = document.getElementById(dateToId).value;
        const hasDateFilter = !!(dateFrom || dateTo);
        const { totalShareS, totalShareM, totalShareCompany, jobBreakdown } = computeSAndMPeriodShare(dateFrom, dateTo);
        const amount = partner === 'M' ? totalShareM : (partner === 'Company' ? totalShareCompany : totalShareS);
        const partnerLabel = partner === 'Company' ? t('statShareCompany') : partner;
        const periodLine = hasDateFilter
            ? (currentLang === 'ar' ? `\nالفترة: ${dateFrom || '...'} → ${dateTo || '...'}` : `\nPeriod: ${dateFrom || '...'} → ${dateTo || '...'}`)
            : '';
        // One line per job showing what THAT job alone contributed to this share — so it's
        // clear which job gave how much, not just one combined total.
        const lines = (jobBreakdown || []).map(b => {
            const amt = partner === 'M' ? b.shareM : (partner === 'Company' ? b.shareCompany : b.shareS);
            if (Math.abs(amt) < 0.005) return null;
            const label = b.generalBonus
                ? (currentLang === 'ar' ? 'بونص عام' : 'General bonus')
                : `${b.job.clientName || ''}${b.job.startDate ? ' (' + b.job.startDate + ')' : ''}`;
            return `${label}: $${amt.toFixed(2)}`;
        }).filter(Boolean);
        const totalLabel = currentLang === 'ar' ? 'الإجمالي' : 'Total';
        const parts = [`${currentLang === 'ar' ? 'تقرير حصة ' + partnerLabel : partnerLabel + ' Share Report'}:${periodLine}`, ...lines, `${totalLabel}: $${amount.toFixed(2)}`];
        const msg = parts.join('\n');
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Sends S and M's shares together in one message, each with its own per-job breakdown —
    // for when the two of them are fine getting the same message (unlike the separate S-only /
    // M-only buttons, which exist so each can be sent privately to just that one person).
    function sendWhatsAppShareCombined(dateFromId, dateToId) {
        const dateFrom = document.getElementById(dateFromId).value;
        const dateTo = document.getElementById(dateToId).value;
        const hasDateFilter = !!(dateFrom || dateTo);
        const { totalShareS, totalShareM, jobBreakdown } = computeSAndMPeriodShare(dateFrom, dateTo);
        const periodLine = hasDateFilter
            ? (currentLang === 'ar' ? `\nالفترة: ${dateFrom || '...'} → ${dateTo || '...'}` : `\nPeriod: ${dateFrom || '...'} → ${dateTo || '...'}`)
            : '';
        const buildLines = key => (jobBreakdown || []).map(b => {
            const amt = b[key];
            if (Math.abs(amt) < 0.005) return null;
            const label = b.generalBonus
                ? (currentLang === 'ar' ? 'بونص عام' : 'General bonus')
                : `${b.job.clientName || ''}${b.job.startDate ? ' (' + b.job.startDate + ')' : ''}`;
            return `${label}: $${amt.toFixed(2)}`;
        }).filter(Boolean);
        const totalLabel = currentLang === 'ar' ? 'الإجمالي' : 'Total';
        const sLabel = currentLang === 'ar' ? 'حصة S' : 'S Share';
        const mLabel = currentLang === 'ar' ? 'حصة M' : 'M Share';
        const parts = [
            `${currentLang === 'ar' ? 'تقرير حصص الأرباح' : 'Profit Share Report'}:${periodLine}`,
            '', `${sLabel}:`, ...buildLines('shareS'), `${totalLabel}: $${totalShareS.toFixed(2)}`,
            '', `${mLabel}:`, ...buildLines('shareM'), `${totalLabel}: $${totalShareM.toFixed(2)}`
        ];
        const msg = parts.join('\n');
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
