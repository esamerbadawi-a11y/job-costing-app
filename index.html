        document.getElementById('addAppointmentTitle').innerText = t('addAppointmentTitle');
        document.getElementById('saveAppointmentBtnLabel').innerText = t('saveAppointmentBtn');
    }

    async function saveAppointment() {
        const clientName = document.getElementById('apptClientName').value.trim();
        if (!clientName) { alert(t('alertClientNameRequired')); return; }

        const fields = {
            clientName,
            clientPhone: document.getElementById('apptClientPhone').value.trim(),
            clientEmail: document.getElementById('apptClientEmail').value.trim(),
            clientAddress: document.getElementById('apptClientAddress').value.trim(),
            requestedDate: document.getElementById('apptDate').value,
            requestedTime: document.getElementById('apptTime').value,
            services: Array.from(document.querySelectorAll('.appt-service-check:checked')).map(cb => cb.value),
            note: document.getElementById('apptNote').value.trim(),
            photos: JSON.parse(JSON.stringify(currentApptPhotos)),
            by: currentUserEmail || '?'
        };

        try {
            if (editingApptId) {
                const idx = appointments.findIndex(a => a.id === editingApptId);
                if (idx !== -1) appointments[idx] = { ...appointments[idx], ...fields };
            } else {
                appointments.unshift({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), ...fields });
            }
            await APPOINTMENTS_DOC.set({ entries: appointments });
            resetAppointmentForm();
            renderAppointments();
        } catch (err) {
            alertSaveError(err);
        }
    }

    async function deleteAppointment(id) {
        if (!confirm(t('confirmDeleteAppointment'))) return;
        appointments = appointments.filter(a => a.id !== id);
        try { await APPOINTMENTS_DOC.set({ entries: appointments }); renderAppointments(); }
        catch (err) { alertSaveError(err); }
    }

    // Pulls an appointment's details straight into a fresh job entry form, then removes
    // it from the pending list — no retyping the client's name/phone/address.
    async function convertAppointmentToJob(id) {
        const appt = appointments.find(a => a.id === id);
        if (!appt) return;

        const servicesLine = (appt.services && appt.services.length > 0) ? `${t('apptServicesLabel')} ${appt.services.join(', ')}` : '';
        const newJob = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            clientName: appt.clientName || '',
            clientPhone: appt.clientPhone || '',
            clientEmail: appt.clientEmail || '',
            jobStatus: 'شغال',
            clientAddress: appt.clientAddress || '',
            clientDescription: [servicesLine, appt.note || ''].filter(Boolean).join('\n'),
            startDate: appt.requestedDate || '',
            endDate: appt.requestedDate || '',
            dailySchedule: appt.requestedDate ? [{ date: appt.requestedDate, time: appt.requestedTime || '', team: [], dayOrder: 0 }] : [],
            totalRevenue: parseVal(appt.quotedPrice) || 0, amountReceived: 0, amountRemaining: 0,
            followUpDate: '', materialCost: 0, extraExpenses: 0,
            expenseItems: [], technicians: [],
            photos: JSON.parse(JSON.stringify(appt.photos || [])),
            createdBy: currentUserEmail, lastEditedBy: currentUserEmail
        };

        savedJobs.unshift(newJob);
        appointments = appointments.filter(a => a.id !== id);
        try {
            await saveSavedJobsData();
            await APPOINTMENTS_DOC.set({ entries: appointments });
            logActivity('add', newJob.clientName);
        } catch (e) {
            alert(t('alertJobSaveFailed'));
            return;
        }

        refreshAllViews();
        editJob(newJob.id); // opens it pre-filled, in edit mode, so refining it later never creates a duplicate
        switchScreen('entry');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // The opposite of convertAppointmentToJob — for a job that was created by mistake and
    // should've stayed a pending appointment. Only allowed while the job carries ZERO real
    // financial activity (nothing received, no materials/expenses, no technicians or
    // payments attached) — otherwise undoing it would silently throw away real money
    // already recorded. On success it goes back to Appointments in its plain, basic shape
    // (name/phone/address/date/note only) — none of the job-only fields carry over.
    async function revertJobToAppointment(id) {
        const job = savedJobs.find(j => j.id === id);
        if (!job) return;

        const reasons = [];
        if (Math.abs(parseVal(job.amountReceived)) > 0.005) reasons.push(t('revertBlockReasonAmount'));
        if (Math.abs(parseVal(job.materialCost)) > 0.005) reasons.push(t('revertBlockReasonMaterial'));
        if (Math.abs(parseVal(job.extraExpenses)) > 0.005) reasons.push(t('revertBlockReasonExtraExp'));
        if ((job.technicians || []).length > 0) reasons.push(t('revertBlockReasonTechs'));
        if ((job.expenseItems || []).length > 0) reasons.push(t('revertBlockReasonExpenseItems'));
        if (techPayments.some(p => p.jobId === job.id)) reasons.push(t('revertBlockReasonPayments'));
        if (techBonuses.some(b => b.jobId === job.id)) reasons.push(t('revertBlockReasonBonuses'));

        if (reasons.length > 0) {
            alert(t('alertRevertBlockedTitle') + '\n\n' + reasons.map(r => '• ' + r).join('\n'));
            return;
        }

        if (!confirm(t('confirmRevertToAppointment'))) return;

        const newAppt = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            clientName: job.clientName || '',
            clientPhone: job.clientPhone || '',
            clientEmail: job.clientEmail || '',
            clientAddress: job.clientAddress || '',
            requestedDate: job.startDate || '',
            requestedTime: (job.dailySchedule && job.dailySchedule[0] && job.dailySchedule[0].time) || '',
            services: [],
            note: ''
            // Deliberately plain/basic: no clientDescription, no dailySchedule, no photos,
            // no status — exactly like a freshly-created appointment, nothing job-only kept.
        };

        savedJobs = savedJobs.filter(j => j.id !== id);
        appointments.unshift(newAppt);
        try {
            await saveSavedJobsData();
            await APPOINTMENTS_DOC.set({ entries: appointments });
            logActivity('delete', job.clientName, t('activityRevertedToAppointment'));
        } catch (err) {
            alertSaveError(err);
            return;
        }

        refreshAllViews();
    }

    /* ---------------- Follow-up marking (🔔) ---------------- */
    let followUpReasonApptId = '';
    const FOLLOW_UP_BADGE_KEYS = { quote_sent: 'followUpBadgeQuoteSent', visited_waiting: 'followUpBadgeVisitedWaiting', called_no_answer: 'followUpBadgeCalledNoAnswer', appointment_reminder: 'followUpBadgeApptReminder', other: 'followUpBadgeOther' };
    function followUpReasonBadgeKey(reason) { return FOLLOW_UP_BADGE_KEYS[reason] || FOLLOW_UP_BADGE_KEYS.other; }
    function openFollowUpReasonModal(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        followUpReasonApptId = apptId;
        document.getElementById('followUpReasonSelect').value = appt.followUpReason || 'quote_sent';
        document.getElementById('followUpReasonNote').value = appt.followUpReasonNote || '';
        document.getElementById('followUpReasonModal').style.display = 'flex';
    }
    function closeFollowUpReasonModal() { document.getElementById('followUpReasonModal').style.display = 'none'; }
    async function saveFollowUpReason() {
        const appt = appointments.find(a => a.id === followUpReasonApptId);
        if (!appt) return;
        const prevState = { followUpNeeded: appt.followUpNeeded, followUpReason: appt.followUpReason, followUpReasonNote: appt.followUpReasonNote };
        appt.followUpNeeded = true;
        appt.followUpReason = document.getElementById('followUpReasonSelect').value;
        appt.followUpReasonNote = document.getElementById('followUpReasonNote').value.trim();
        try {
            await APPOINTMENTS_DOC.set({ entries: appointments });
            closeFollowUpReasonModal();
            renderAppointments();
        } catch (err) { Object.assign(appt, prevState); alertSaveError(err); }
    }
    // "Done" clears the flag (and the AI context) once the client has responded — doesn't delete
    // the reason/note, so re-marking it later (if they go quiet again) reopens the picker pre-filled.
    async function clearFollowUp(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        const wasNeeded = appt.followUpNeeded;
        appt.followUpNeeded = false;
        try { await APPOINTMENTS_DOC.set({ entries: appointments }); renderAppointments(); }
        catch (err) { appt.followUpNeeded = wasNeeded; alertSaveError(err); }
    }

    /* ---------------- Appointment price quotes (🏷️) ----------------
       An appointment can carry a quoted total price + an optional itemized breakdown
       (appt.quotedPrice / appt.quoteItems / appt.quoteNote / appt.quotePhotos), built here
       and either sent as a quick AI message (reusing the aiReminderCtx/msgKind infra, same
       as 'followup') or as a formal printable document (buildAppointmentQuoteHtmlDoc below,
       mirroring buildInvoiceHtmlDoc's standalone-HTML-in-a-new-tab approach). Once sent, the
       price carries over into convertAppointmentToJob's totalRevenue. */
    let quoteApptId = '';
    let quoteItemsState = [];
    // null = the form on screen is a brand-new, not-yet-saved quote. Once Save/Send succeeds (or
    // "Load" pulls up an existing one), this holds that entry's id in appt.savedQuotes, so the
    // next Save updates that same entry instead of creating a duplicate — same role invoiceState's
    // own savedId plays for invoices.
    let quoteDraftSavedId = null;

    // A starting suggestion for a brand-new quote's number — company initials + the full date
    // it's being drafted on + the last 4 digits of the appointment's own id, e.g.
    // "AHAA-20261009-9606". It's just a default in an editable field, exactly like the invoice
    // number: the user can change it before saving if they want something else.
    function suggestQuoteNumber(apptId) {
        const seq = String(apptId).replace(/\D/g, '').slice(-4).padStart(4, '0') || '0001';
        return `${companyInvoicePrefix()}-${isoDate(new Date()).replace(/-/g, '')}-${seq}`;
    }

    // Appointments that got a quote BEFORE the saved-quotes list existed only have the old
    // top-level fields (quotedPrice/quoteItems/etc.) with nothing in appt.savedQuotes — which
    // made them look "deleted" once the list UI shipped, since the list only ever reads
    // savedQuotes. This folds that legacy quote into a proper savedQuotes entry, once, the
    // first time the screen opens for that appointment, and persists it so it's permanent.
    function migrateLegacyQuoteIfNeeded(appt) {
        if ((appt.savedQuotes || []).length > 0) return; // already has saved entries, nothing to migrate
        const hasLegacyQuote = appt.quotedPrice || (appt.quoteItems && appt.quoteItems.length > 0);
        if (!hasLegacyQuote) return;
        appt.savedQuotes = [{
            id: newLedgerId(),
            quoteNumber: appt.quoteNumber || suggestQuoteNumber(appt.id),
            quotedPrice: appt.quotedPrice || 0,
            items: appt.quoteItems || [],
            note: appt.quoteNote || '',
            photos: appt.quotePhotos || [],
            savedAt: appt.quoteSentAt || new Date().toISOString(),
            sentAt: appt.quoteSentAt || null
        }];
        safeCall(() => { APPOINTMENTS_DOC.set({ entries: appointments }); });
    }

    function openAppointmentQuoteModal(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        appt.savedQuotes = appt.savedQuotes || [];
        migrateLegacyQuoteIfNeeded(appt);
        quoteApptId = apptId;
        document.getElementById('quoteClientLine').textContent = appt.clientName || '';
        startNewQuoteDraft(apptId); // every open starts a fresh, blank quote — exactly like opening the Invoice screen; pick a saved one from the list above to continue editing it instead
        closeOtherTopModals('appointmentsListModal'); // keep the appointments list open underneath, just like the follow-up picker does
        document.getElementById('appointmentQuoteModal').style.display = 'flex';
    }
    function closeAppointmentQuoteModal() {
        document.getElementById('appointmentQuoteModal').style.display = 'none';
        quoteApptId = '';
        quoteDraftSavedId = null;
    }
    function onQuotePriceInput() { updateQuoteItemsTotalDisplay(); }

    // Clears the form back to a blank, unsaved quote (new suggested number, no price/items/note/
    // photos) without closing the modal — same job "+ New Invoice" does for invoices.
    function startNewQuoteDraft(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        quoteDraftSavedId = null;
        document.getElementById('quoteNumberInput').value = suggestQuoteNumber(apptId);
        document.getElementById('quotePriceInput').value = '';
        quoteItemsState = [];
        renderQuoteItemsTable();
        document.getElementById('quoteNoteInput').value = '';
        document.getElementById('quoteAiInstructions').value = '';
        currentQuotePhotos = [];
        renderPhotoGallery(currentQuotePhotos, 'quotePhotoGallery');
        renderQuoteSavedList(apptId);
    }

    // Loads one previously-saved quote (from appt.savedQuotes) into the form for further editing
    // — does NOT touch the appointment's own fields until Save/Send is pressed again, same as
    // loadSavedInvoice only changing the draft, not the job, until it's saved.
    function loadSavedQuote(apptId, savedId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        const saved = (appt.savedQuotes || []).find(q => q.id === savedId);
        if (!saved) return;
        quoteDraftSavedId = saved.id;
        document.getElementById('quoteNumberInput').value = saved.quoteNumber || suggestQuoteNumber(apptId);
        document.getElementById('quotePriceInput').value = saved.quotedPrice || '';
        quoteItemsState = JSON.parse(JSON.stringify(saved.items || []));
        renderQuoteItemsTable();
        document.getElementById('quoteNoteInput').value = saved.note || '';
        document.getElementById('quoteAiInstructions').value = '';
        currentQuotePhotos = JSON.parse(JSON.stringify(saved.photos || []));
        renderPhotoGallery(currentQuotePhotos, 'quotePhotoGallery');
        renderQuoteSavedList(apptId); // refresh the highlighted/selected entry
    }

    async function deleteSavedQuote(apptId, savedId) {
        if (!confirm(t('confirmDeleteSavedQuote'))) return;
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        const prevList = appt.savedQuotes;
        appt.savedQuotes = (appt.savedQuotes || []).filter(q => q.id !== savedId);
        try {
            await APPOINTMENTS_DOC.set({ entries: appointments });
            logActivity('delete', appt.clientName, t('activityQuoteDeleted'));
        } catch (err) { appt.savedQuotes = prevList; alertSaveError(err); return; }
        if (quoteDraftSavedId === savedId) startNewQuoteDraft(apptId); // the entry being edited just got deleted — fall back to a blank draft instead of an orphaned one
        renderQuoteSavedList(apptId);
        safeCall(renderAppointments);
    }

    // Quick look at a SAVED version exactly as it was when saved — not the live draft — same role
    // viewSavedInvoice plays for a saved invoice.
    function viewSavedQuote(apptId, savedId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        const saved = (appt.savedQuotes || []).find(q => q.id === savedId);
        if (!saved) return;
        const win = window.open('', '_blank');
        const snapshotAppt = Object.assign({}, appt, {
            quoteNumber: saved.quoteNumber, quotedPrice: saved.quotedPrice, quoteItems: saved.items, quoteNote: saved.note
        });
        const html = buildAppointmentQuoteHtmlDoc(snapshotAppt);
        if (win) { win.document.write(html); win.document.close(); }
    }

    function renderQuoteSavedList(apptId) {
        const container = document.getElementById('quoteSavedListContainer');
        if (!container) return;
        const appt = appointments.find(a => a.id === apptId);
        const saved = (appt && appt.savedQuotes) || [];
        if (saved.length === 0) { container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); padding:8px 0;">${t('quoteNoSavedQuotes')}</div>`; return; }
        container.innerHTML = saved.map(q => `
            <div class="tech-card" style="margin-bottom:6px; ${quoteDraftSavedId === q.id ? 'border-color:#38bdf8;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                    <div style="font-size:0.8rem;">
                        <b>${escHtml(q.quoteNumber || '')}</b>
                        <span style="color:var(--text-muted);"> · $${parseVal(q.quotedPrice).toFixed(2)}</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="secondary" onclick="viewSavedQuote('${apptId}', '${q.id}')" style="padding:5px 10px; font-size:0.75rem; background:#0284c7;">👁️ ${t('invoiceViewBtn')}</button>
                        <button type="button" class="secondary" onclick="loadSavedQuote('${apptId}', '${q.id}')" style="padding:5px 10px; font-size:0.75rem;">${t('invoiceLoadBtn')}</button>
                        <button type="button" onclick="deleteSavedQuote('${apptId}', '${q.id}')" style="padding:5px 10px; font-size:0.75rem; background:rgba(225,29,72,0.15); color:#e11d48; border:1px solid rgba(225,29,72,0.4); border-radius:8px; cursor:pointer;">${t('quoteDeleteSavedBtn')}</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // A running "items so far" total, shown right under the breakdown table, so a mismatch
    // (like deleting a row and forgetting to make up the difference elsewhere) is obvious at a
    // glance instead of something you only notice after sending the quote.
    function updateQuoteItemsTotalDisplay() {
        const el = document.getElementById('quoteItemsTotalDisplay');
        if (!el) return;
        const price = parseVal(document.getElementById('quotePriceInput').value);
        const itemsSum = quoteItemsState.reduce((s, it) => s + parseVal(it.amount), 0);
        const diff = Math.round((price - itemsSum) * 100) / 100;
        let statusHtml;
        if (quoteItemsState.length === 0) {
            el.style.background = 'transparent'; el.style.border = 'none'; el.innerHTML = ''; return;
        } else if (Math.abs(diff) < 0.005) {
            el.style.background = 'rgba(22,163,74,0.14)'; el.style.border = '1px solid #16a34a';
            statusHtml = `<span style="color:#4ade80;">${t('quoteItemsTotalMatch')}</span>`;
        } else if (diff > 0) {
            el.style.background = 'rgba(217,119,6,0.14)'; el.style.border = '1px solid var(--warning)';
            statusHtml = `<span style="color:#fbbf24;">$${diff.toFixed(2)} ${t('quoteItemsTotalShort')}</span>`;
        } else {
            el.style.background = 'rgba(225,29,72,0.14)'; el.style.border = '1px solid #e11d48';
            statusHtml = `<span style="color:#f87171;">$${Math.abs(diff).toFixed(2)} ${t('quoteItemsTotalOver')}</span>`;
        }
        el.innerHTML = `${t('quoteItemsTotalLabel')} $${itemsSum.toFixed(2)} / $${price.toFixed(2)} — ${statusHtml}`;
    }

    function renderQuoteItemsTable() {
        const container = document.getElementById('quoteItemsContainer');
        if (!container) return;
        if (quoteItemsState.length === 0) { container.innerHTML = `<div style="font-size:0.78rem; color:var(--text-muted); padding:6px 0;">${t('quoteNoItemsYet')}</div>`; safeCall(updateQuoteItemsTotalDisplay); return; }
        container.innerHTML = quoteItemsState.map((it, index) => `
            <div class="tech-card" style="margin-bottom:8px;">
                <div style="display:grid; grid-template-columns: 1fr 110px 40px; gap:10px; align-items:end;">
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceColDesc')}</label>
                        <input type="text" value="${escHtml(it.desc)}" oninput="updateQuoteItemField(${index}, 'desc', this.value)" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%;">
                    </div>
                    <div>
                        <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; display:block;">${t('invoiceColAmount')}</label>
                        <input type="text" value="${it.amount !== undefined ? it.amount : ''}" onfocus="this.select()" oninput="updateQuoteItemField(${index}, 'amount', this.value); updateQuoteItemsTotalDisplay();" style="background:#11141d; color:#fff; border:1px solid var(--border-color); padding:9px 12px; border-radius:8px; width:100%; text-align:center;">
                    </div>
                    <div style="display:flex; align-items:stretch; height:40px;">
                        <button type="button" onclick="removeQuoteItemRow(${index})" style="background:rgba(225,29,72,0.15); color:#e11d48; border:1px solid rgba(225,29,72,0.4); padding:9px 0; border-radius:8px; width:100%; cursor:pointer; font-size:14px;">✕</button>
                    </div>
                </div>
            </div>
        `).join('');
        safeCall(updateQuoteItemsTotalDisplay);
    }
    function updateQuoteItemField(index, field, value) { if (quoteItemsState[index]) quoteItemsState[index][field] = value; }
    function addQuoteItemRow() { quoteItemsState.push({ desc: '', amount: '' }); renderQuoteItemsTable(); }
    function removeQuoteItemRow(index) { quoteItemsState.splice(index, 1); renderQuoteItemsTable(); }

    // Sends the quote photo + the already-entered total price to the AI, asking it to split
    // that exact total into a believable itemized breakdown based on what's visible in the
    // photo — replacing whatever rows were there before. Amounts are normalized (the last
    // item absorbs any rounding cents) so they always sum to exactly the entered price.
    async function analyzeQuotePhotoAndSplit(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = '';
        if (!file) return;
        const apiKey = getGeminiApiKey();
        if (!apiKey) { alert(t('aiNoKeyNote')); return; }
        const price = parseVal(document.getElementById('quotePriceInput').value);
        if (!price) { alert(t('alertQuoteNeedsPrice')); return; }

        const btn = document.getElementById('quoteAnalyzePhotoBtn');
        const originalLabel = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = t('quoteAnalyzingPhoto');

        const instructions = (document.getElementById('quoteAiInstructions').value || '').trim();
        try {
            const dataUrl = await compressImageToBase64(file);
            const base64Data = dataUrl.split(',')[1];
            const instructionsLine = instructions
                ? (currentLang === 'ar' ? ` خد بالك كمان من التوجيه ده من صاحب الشغل: ${instructions}.` : ` Also follow this instruction from the business owner: ${instructions}.`)
                : '';
            const promptText = (currentLang === 'ar'
                ? `اتفرج على صورة موقع شغل الصيانة/المقاولات دي، وقسّم السعر الإجمالي $${price.toFixed(2)} على بنود منطقية حسب اللي شايفه (تصليحات، خامات، تشطيب، إلخ)، بحيث مجموع البنود يساوي $${price.toFixed(2)} بالظبط.${instructionsLine} رجّعلي JSON فقط، من غير أي نص تاني ولا \`\`\`، بالشكل ده: [{"desc":"وصف البند","amount":123.45}, ...]`
                : `Look at this handyman/contracting job-site photo and split the total price $${price.toFixed(2)} into logical line items based on what's visible (repairs, materials, finishing, etc.), so the items sum to exactly $${price.toFixed(2)}.${instructionsLine} Return ONLY JSON, no other text and no \`\`\`, in this shape: [{"desc":"item description","amount":123.45}, ...]`);

            const resultText = await aiGenerate(apiKey, [{ inlineData: { mimeType: 'image/jpeg', data: base64Data } }, { text: promptText }]);
            const parsed = parseAndNormalizeQuoteItemsJson(resultText, price);

            quoteItemsState = parsed;
            renderQuoteItemsTable();

            currentQuotePhotos.push({ data: dataUrl, addedAt: new Date().toISOString() });
            renderPhotoGallery(currentQuotePhotos, 'quotePhotoGallery');
        } catch (err) {
            const msg = (err && err.message) ? err.message : String(err);
            if (/401|403|UNAUTHENTICATED|PERMISSION|API key/i.test(msg)) { try { localStorage.removeItem('geminiApiKey'); } catch (e) {} }
            alert(t('alertAiFailed') + ' (' + msg + ')');
        } finally {
            btn.disabled = false; btn.innerHTML = originalLabel;
        }
    }

    // Shared by analyzeQuotePhotoAndSplit and adjustQuoteItemsWithAI: strips a stray ``` fence
    // if the model added one anyway, parses the JSON array, and normalizes amounts so they sum
    // to exactly the entered price (the last item absorbs any rounding cents).
    function parseAndNormalizeQuoteItemsJson(resultText, price) {
        const jsonText = resultText.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
        let parsed = JSON.parse(jsonText);
        if (!Array.isArray(parsed)) throw new Error('not an array');
        parsed = parsed.map(it => ({ desc: String((it && it.desc) || '').trim(), amount: parseVal(it && it.amount) })).filter(it => it.desc);
        if (parsed.length === 0) throw new Error('empty breakdown');
        const sum = parsed.reduce((s, it) => s + it.amount, 0);
        const diff = price - sum;
        if (Math.abs(diff) > 0.001) parsed[parsed.length - 1].amount = Math.round((parsed[parsed.length - 1].amount + diff) * 100) / 100;
        return parsed;
    }

    // Lets the user tell the AI what to change about the breakdown already on screen (reorder,
    // rename, merge/split items, shift amounts around) WITHOUT needing a new photo — text-only,
    // working off the current price + items + whatever instruction was typed.
    async function adjustQuoteItemsWithAI() {
        const apiKey = getGeminiApiKey();
        if (!apiKey) { alert(t('aiNoKeyNote')); return; }
        const price = parseVal(document.getElementById('quotePriceInput').value);
        if (!price) { alert(t('alertQuoteNeedsPrice')); return; }
        const instructions = (document.getElementById('quoteAiInstructions').value || '').trim();
        if (!instructions && quoteItemsState.length === 0) { alert(t('alertQuoteAdjustNeedsInput')); return; }

        const btn = document.getElementById('quoteAdjustAiBtn');
        const originalLabel = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = t('quoteAdjusting');

        try {
            const currentItemsJson = JSON.stringify(quoteItemsState.map(it => ({ desc: it.desc, amount: parseVal(it.amount) })));
            const promptText = currentLang === 'ar'
                ? `دي تفاصيل عرض سعر شغل صيانة/مقاولات حاليًا (JSON): ${currentItemsJson}. السعر الإجمالي ثابت عند $${price.toFixed(2)}. عدّل البنود دي حسب التوجيه ده من صاحب الشغل: "${instructions}"، مع إنك تخلي مجموع البنود يساوي $${price.toFixed(2)} بالظبط. رجّعلي JSON فقط، من غير أي نص تاني ولا \`\`\`، بالشكل ده: [{"desc":"وصف البند","amount":123.45}, ...]`
                : `Here is the current price breakdown for a handyman/contracting quote (JSON): ${currentItemsJson}. The total price is fixed at $${price.toFixed(2)}. Adjust these items per this instruction from the business owner: "${instructions}", keeping the items summing to exactly $${price.toFixed(2)}. Return ONLY JSON, no other text and no \`\`\`, in this shape: [{"desc":"item description","amount":123.45}, ...]`;

            const resultText = await aiGenerate(apiKey, promptText);
            const parsed = parseAndNormalizeQuoteItemsJson(resultText, price);
            quoteItemsState = parsed;
            renderQuoteItemsTable();
        } catch (err) {
            const msg = (err && err.message) ? err.message : String(err);
            if (/401|403|UNAUTHENTICATED|PERMISSION|API key/i.test(msg)) { try { localStorage.removeItem('geminiApiKey'); } catch (e) {} }
            alert(t('alertAiFailed') + ' (' + msg + ')');
        } finally {
            btn.disabled = false; btn.innerHTML = originalLabel;
        }
    }

    // Persists price/items/note/photos onto the appointment itself. Returns true/false so the
    // send functions below know whether it's safe to go on and actually send.
    // Saves the form on screen both as "the appointment's current quote" (appt.quotedPrice/
    // quoteItems/quoteNote/quotePhotos/quoteNumber — what the card badge, convertAppointmentToJob,
    // and the quick-message AI prompt all read) AND as an entry in appt.savedQuotes (the
    // View/Load/Delete history) — updating the entry in place if quoteDraftSavedId is already
    // set, or creating a new one otherwise. Same two-part role saveCurrentInvoice plays for
    // invoices (invoiceState.savedId + job.savedInvoices), just without the Firestore transaction
    // since appointments are saved as one simple document, same as everywhere else in this screen.
    async function saveAppointmentQuote(apptId, showSavedToast) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return false;
        const prevAppt = JSON.parse(JSON.stringify({ quotedPrice: appt.quotedPrice, quoteItems: appt.quoteItems, quoteNote: appt.quoteNote, quotePhotos: appt.quotePhotos, quoteNumber: appt.quoteNumber, savedQuotes: appt.savedQuotes }));

        const quoteNumber = document.getElementById('quoteNumberInput').value.trim() || suggestQuoteNumber(apptId);
        const quotedPrice = parseVal(document.getElementById('quotePriceInput').value);
        const items = quoteItemsState.map(it => ({ desc: (it.desc || '').trim(), amount: parseVal(it.amount) })).filter(it => it.desc || it.amount);
        const note = document.getElementById('quoteNoteInput').value.trim();
        const photos = JSON.parse(JSON.stringify(currentQuotePhotos));

        appt.quoteNumber = quoteNumber;
        appt.quotedPrice = quotedPrice;
        appt.quoteItems = items;
        appt.quoteNote = note;
        appt.quotePhotos = photos;

        appt.savedQuotes = appt.savedQuotes || [];
        const existingIdx = quoteDraftSavedId ? appt.savedQuotes.findIndex(q => q.id === quoteDraftSavedId) : -1;
        if (existingIdx !== -1) {
            appt.savedQuotes[existingIdx] = { ...appt.savedQuotes[existingIdx], quoteNumber, quotedPrice, items, note, photos, savedAt: new Date().toISOString() };
        } else {
            quoteDraftSavedId = newLedgerId();
            appt.savedQuotes.push({ id: quoteDraftSavedId, quoteNumber, quotedPrice, items, note, photos, savedAt: new Date().toISOString() });
        }

        try {
            await APPOINTMENTS_DOC.set({ entries: appointments });
            logActivity('edit', appt.clientName, `${t('activityQuoteSaved')} ${quoteNumber}`);
            safeCall(renderAppointments);
            safeCall(() => renderQuoteSavedList(apptId));
            if (showSavedToast) showToast(t('quoteSavedToast'));
            return true;
        } catch (err) {
            Object.assign(appt, prevAppt);
            alert(t('alertQuoteSaveFailed'));
            return false;
        }
    }

    // Quick path: save the quote fields, then open the same AI-composer modal used for payment
    // reminders/follow-ups/thank-yous — msgKind 'quote' drives buildQuotePrompt/buildFallbackQuote.
    async function sendAppointmentQuoteMessage(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        if (!parseVal(document.getElementById('quotePriceInput').value)) { alert(t('alertQuoteNeedsPrice')); return; }
        const ok = await saveAppointmentQuote(apptId, false);
        if (!ok) return;
        closeAppointmentQuoteModal();

        aiReminderCtx = { job: appt, rem: 0, daysOverdue: null, apiKey: getGeminiApiKey(), run: 0, mode: 'ai', msgKind: 'quote', fromInvoice: false, apptId: appt.id, savedQuoteId: quoteDraftSavedId };
        document.getElementById('aiReminderLang').value = currentLang === 'ar' ? 'ar' : 'en';
        document.getElementById('aiReminderJob').textContent = `${appt.clientName || ''} — $${parseVal(appt.quotedPrice).toFixed(2)}`;
        document.getElementById('aiReminderText').value = '';
        document.getElementById('aiCustomInstructions').value = '';
        document.getElementById('aiShareBtn').style.display = 'none';
        document.getElementById('aiCallBtn').style.display = appt.clientPhone ? '' : 'none';
        document.getElementById('aiReminderModal').style.display = 'flex';
        if (!aiReminderCtx.apiKey) { useTemplateReminder('aiNoKeyNote'); return; }
        await regenerateAiReminder();
    }

    // Formal path: save the quote fields, then open a standalone printable "ESTIMATE" document
    // in a new tab — same convention as printInvoice()/viewSavedInvoice() (open the tab
    // synchronously first, so phone browsers never treat the later document.write as a popup).
    async function sendAppointmentQuoteDocument(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        if (!parseVal(document.getElementById('quotePriceInput').value)) { alert(t('alertQuoteNeedsPrice')); return; }
        const win = window.open('', '_blank');
        const ok = await saveAppointmentQuote(apptId, false);
        if (!ok) { if (win) win.close(); return; }

        const html = buildAppointmentQuoteHtmlDoc(appt);
        if (win) { win.document.write(html); win.document.close(); }

        appt.quoteSentAt = new Date().toISOString();
        // Stamp the sent time on the matching saved-quote entry too, so its history row carries
        // it (saveAppointmentQuote, just above, already upserted this exact entry).
        const sentEntry = (appt.savedQuotes || []).find(q => q.id === quoteDraftSavedId);
        if (sentEntry) sentEntry.sentAt = appt.quoteSentAt;
        try { await APPOINTMENTS_DOC.set({ entries: appointments }); safeCall(renderAppointments); } catch (e) { console.error('quote doc sent-stamp error:', e); }
        closeAppointmentQuoteModal();
    }

    // Quick look at the quote exactly as it'll print, using whatever's on screen right now
    // (price/items/note), without saving or sending anything — same idea as the invoice's own
    // "View" button, just built from the live draft instead of an already-saved snapshot since
    // a quote here has no separate saved/unsaved pair to load from.
    function previewAppointmentQuote(apptId) {
        const appt = appointments.find(a => a.id === apptId);
        if (!appt) return;
        // Opened synchronously, before anything else, so phone browsers never treat the
        // eventual document.write() as a popup-blocker-worthy delayed open.
        const win = window.open('', '_blank');
        const draftAppt = Object.assign({}, appt, {
            quoteNumber: document.getElementById('quoteNumberInput').value.trim() || suggestQuoteNumber(apptId),
            quotedPrice: parseVal(document.getElementById('quotePriceInput').value),
            quoteItems: quoteItemsState.map(it => ({ desc: (it.desc || '').trim(), amount: parseVal(it.amount) })).filter(it => it.desc || it.amount),
            quoteNote: document.getElementById('quoteNoteInput').value.trim()
        });
        const html = buildAppointmentQuoteHtmlDoc(draftAppt);
        if (win) { win.document.write(html); win.document.close(); }
    }

                        <span style="font-size:0.78rem; color:#38bdf8;">${appt.requestedDate || t('noDateSet')} ${appt.requestedTime || ''}</span>

                        <button class="secondary" onclick="openAppointmentQuoteModal('${appt.id}')" style="padding:6px 10px; font-size:0.78rem; background:#0891b2;">${t('sendQuoteBtn')}</button>
                        <button class="success" onclick="convertAppointmentToJob('${appt.id}')" style="padding:6px 12px; font-size:0.78rem;">${t('convertToJobBtn')}</button>

                    </div>
                </div>

        });
        container.innerHTML = html;
    }

    /* ---------------- Weekly Work Board ---------------- */
    // The Weekly Board organizes work by its OWN scheduling date, separate from the job's
    // official record date (startDate) used in reports — so reordering a job's day here
    // never changes the date shown in Log & Reports. Falls back to startDate only for
    // older jobs saved before this field existed.
    function effectiveScheduleDate(job) { return job.scheduledDate || job.startDate || ''; }

    // A job can now span several days, with a different team on each — e.g. Nathan works
    // Mon-Tue, then Oscar picks it up Wed-Thu, all under the same job/price. job.dailySchedule
    // is the source of truth going forward: [{date, time, team, dayOrder}, ...]. Falls back to
    // the old single-date/assignedTeam fields for jobs saved before this existed.
    function getScheduleEntries(job) {
        if (job.dailySchedule && job.dailySchedule.length > 0) return job.dailySchedule;
        const d = effectiveScheduleDate(job);
        if (!d) return [];
        return [{ date: d, time: job.scheduledTime || '', team: job.assignedTeam || (job.technicians || []).map(tc => tc.name).filter(Boolean), dayOrder: 0 }];
    }

    // Adds or updates (for the same date) one day's entry, without touching any other day
    // already scheduled for this job.
    function upsertScheduleEntry(job, date, time, team, note) {
        const entries = getScheduleEntries(job).map(e => ({ ...e })); // clone, since getScheduleEntries may synthesize from legacy fields
        const idx = entries.findIndex(e => e.date === date);
        if (idx !== -1) { entries[idx].time = time; entries[idx].team = team; entries[idx].note = note; }
        else { entries.push({ date, time, team, note, dayOrder: entries.filter(e => e.date === date).length }); }
        job.dailySchedule = entries;
        // Keep the legacy fields roughly in sync too, so anything not yet updated to read
        // dailySchedule (e.g. an older cached page) still shows something reasonable.
        job.scheduledDate = entries[0].date;
        job.scheduledTime = entries[0].time;
        job.assignedTeam = entries[0].team;
    }

    let weeklyBoardOffset = 0; // 0 = this week, -1 = previous week, +1 = next week
    let showAllPendingMode = false;
    // ---------- Reordering jobs within a day: one small grip handle, using Pointer Events so the SAME
    // code drags with a mouse, a finger, or a pen — unlike the old HTML5 drag-and-drop API this replaces,
    // which only ever worked with a mouse and silently did nothing on a phone. ----------
    let cardDragState = null;

    function startCardDrag(event, jobId, dateStr) {
        event.preventDefault();
        const handle = event.currentTarget;
        const card = handle.closest('.tech-card');
        const container = card.parentElement;
        if (!card || !container) return;
        try { handle.setPointerCapture(event.pointerId); } catch (e) {}
        cardDragState = { jobId, date: dateStr, card, container, pointerId: event.pointerId, moved: false };
        card.classList.add('card-dragging');
        document.addEventListener('pointermove', onCardDragMove);
        document.addEventListener('pointerup', onCardDragEnd);
        document.addEventListener('pointercancel', onCardDragEnd);
    }
    function onCardDragMove(event) {
        if (!cardDragState) return;
        event.preventDefault();
        cardDragState.moved = true;
        const { card, container } = cardDragState;
        const y = event.clientY;
        const siblings = [...container.querySelectorAll(':scope > .tech-card')].filter(el => el !== card);
        let placed = false;
        for (const sib of siblings) {
            const rect = sib.getBoundingClientRect();
            if (y < rect.top + rect.height / 2) { container.insertBefore(card, sib); placed = true; break; }
        }
        if (!placed) container.appendChild(card);
    }
    async function onCardDragEnd(event) {
        if (!cardDragState) return;
        const { card, container, date, moved } = cardDragState;
        document.removeEventListener('pointermove', onCardDragMove);
        document.removeEventListener('pointerup', onCardDragEnd);
        document.removeEventListener('pointercancel', onCardDragEnd);
        card.classList.remove('card-dragging');
        cardDragState = null;
        if (!moved) return;   // a tap on the handle with no real movement: nothing to save
        const orderedJobIds = [...container.querySelectorAll(':scope > .tech-card')].map(el => el.dataset.jobId);
        await persistDayOrder(date, orderedJobIds);
    }
    // Shared by the drag handle above: writes the day's new job order back to Firestore.
    async function persistDayOrder(dateStr, orderedJobIds) {
        const backup = JSON.parse(JSON.stringify(savedJobs));
        orderedJobIds.forEach((jobId, i) => {
            const jobIdx = savedJobs.findIndex(j => j.id === jobId);
            if (jobIdx === -1) return;
            const entries = getScheduleEntries(savedJobs[jobIdx]).map(e => ({ ...e }));
            const entryIdx = entries.findIndex(e => e.date === dateStr);
            if (entryIdx !== -1) { entries[entryIdx].dayOrder = i; savedJobs[jobIdx].dailySchedule = entries; }
        });
        try { await saveSavedJobsData(); }
        catch (e) { savedJobs = backup; alertSaveError(e); }
        renderWeeklyBoard();
    }


    // Week starts on Monday.
    function getWeekRange(offset) {
        // The board is a day-to-day planning tool: "This Week" (offset 0) is a fixed 7-day window
        // starting TOMORROW — today's own work already has its place in the "Jobs Today?" sheet, so the
        // board is for what's coming next. Every other offset tiles continuously from that same anchor
        // (tomorrow going forward, yesterday going backward) in fixed 7-day blocks — so every date is
        // reachable from exactly one offset via ◀/▶ or "Last Week", with only today itself left out
        // (by design — that's "Jobs Today?"'s job). This replaced an earlier version where offsets other
        // than 0 snapped to the calendar Monday..Sunday week, which left a gap between "today" and the
        // start of the calendar week that no offset ever showed.
        const today = isoDate(new Date());
        let start;
        if (offset >= 0) {
            start = addDaysISO(addDaysISO(today, 1), 7 * offset);
        } else {
            const end = addDaysISO(addDaysISO(today, -1), 7 * (offset + 1));
            start = addDaysISO(end, -6);
        }
        const days = [];
        for (let i = 0; i < 7; i++) days.push(new Date(addDaysISO(start, i) + 'T00:00:00'));
        return days;
    }

    function shiftWeek(direction) {
        weeklyBoardOffset = (direction === 0) ? 0 : weeklyBoardOffset + direction;
        renderWeeklyBoard();
    }
    // Jumps straight to last week (relative to today), the same way "This Week" always jumps straight to 0 —
    // regardless of which week is currently being browsed.
    function goToLastWeek() { weeklyBoardOffset = -1; renderWeeklyBoard(); }

    function toggleAllPendingMode() {
        showAllPendingMode = !showAllPendingMode;
        document.getElementById('showAllPendingBtn').style.background = showAllPendingMode ? 'var(--primary)' : '';
        renderWeeklyBoard();

    // Sorts a day's jobs: manual drag order first (dayOrder), then by scheduled time,
    // then jobs with no time at all go last.
    function sortDayEntries(pairs) {
        return [...pairs].sort((a, b) => {
            const orderA = a.entry.dayOrder !== undefined ? a.entry.dayOrder : 999;
            const orderB = b.entry.dayOrder !== undefined ? b.entry.dayOrder : 999;
            if (orderA !== orderB) return orderA - orderB;
            const timeA = a.entry.time || '99:99';
            const timeB = b.entry.time || '99:99';
            return timeA.localeCompare(timeB);
        });
    }

    function renderWeeklyBoard() {
        const dayNamesAr = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
        const dayNamesEn = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const dayNames = currentLang === 'ar' ? dayNamesAr : dayNamesEn;
        const activeJobs = savedJobs.filter(isJobActive);
        const todayStr = isoDate(new Date());

        if (showAllPendingMode) {
            document.getElementById('weeklyRangeLabel').textContent = t('allPendingSubtitle');
            let pairs = [];
            activeJobs.forEach(job => {
                const entries = getScheduleEntries(job);
                if (entries.length === 0) { pairs.push({ job, entry: { date: '', time: '', team: [] } }); }
                else entries.forEach(entry => pairs.push({ job, entry }));
            });
            pairs.sort((a, b) => (a.entry.date || '9999').localeCompare(b.entry.date || '9999'));
            let html = '';
            if (pairs.length === 0) {
                html = `<div style="padding:12px 14px; color:var(--text-muted); font-size:0.82rem;">${t('noJobsThisDay')}</div>`;
            } else {
                pairs.forEach(({ job, entry }) => {
                    const isOverdue = entry.date && entry.date < todayStr;
                    html += renderJobCard(job, entry, isOverdue);
                });
            }
            document.getElementById('weeklyBoardContent').innerHTML = html;
            return;
        }

        const days = getWeekRange(weeklyBoardOffset);
        document.getElementById('weeklyRangeLabel').innerHTML = ltrRange(isoDate(days[0]), isoDate(days[days.length - 1]));

        // The per-day calendar is a historical record too, not just a to-do list: a job that
        // got marked "خلص" (done/closed) should keep showing which days its techs actually
        // worked on it. Only a cancelled job ("ملغي") — work that never really happened — is
        // left out here. "Show all pending" above stays active-jobs-only on purpose: that view
        // is specifically about outstanding work still to schedule.
        const boardJobs = savedJobs.filter(job => job.jobStatus !== 'ملغي');

        let html = '';
        days.forEach(d => {
            const dateStr = isoDate(d);
            let pairs = [];
            boardJobs.forEach(job => { getScheduleEntries(job).forEach(entry => { if (entry.date === dateStr) pairs.push({ job, entry }); }); });
            pairs = sortDayEntries(pairs);
            const isToday = dateStr === todayStr;
            html += `<div style="margin-bottom:14px; border:1px solid var(--border-color); border-radius:10px; overflow:hidden;">
                <div style="background:${isToday ? 'rgba(14,165,233,0.15)' : 'var(--panel-bg)'}; padding:8px 14px; font-weight:700; color:${isToday ? '#38bdf8' : 'var(--text-muted)'}; display:flex; justify-content:space-between; align-items:center;">
                    <span>${dayNames[d.getDay() === 0 ? 6 : d.getDay() - 1]} — ${dateStr}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:400; font-size:0.78rem;">${pairs.length} ${t('jobsWord')}</span>
                        <button class="success" onclick="openQuickScheduleModal('${dateStr}')" style="padding:3px 10px; font-size:0.72rem;">+ ${t('qsAddBtn')}</button>
                    </div>
                </div>
                <div style="padding:10px 14px 4px;">`;
            if (pairs.length === 0) {
                html += `<div style="padding:6px 0 10px; color:var(--text-muted); font-size:0.82rem;">${t('noJobsThisDay')}</div>`;
            } else {
                pairs.forEach(({ job, entry }) => { html += renderJobCard(job, entry, false); });
            }
            html += '</div></div>';
        });
        document.getElementById('weeklyBoardContent').innerHTML = html;
    }

    function openSendScheduleModal() {
        // Smart default: today, or tomorrow if it's already past 5pm, plus 6 more days —

        const now = new Date();

        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        document.getElementById('sendScheduleFrom').value = isoDate(start);
        document.getElementById('sendScheduleTo').value = isoDate(end);

    function confirmSendWeeklyScheduleWhatsApp() {
        const fromStr = document.getElementById('sendScheduleFrom').value;
        const toStr = document.getElementById('sendScheduleTo').value;
        if (!fromStr || !toStr) { alert(t('alertPickBothDates')); return; }

        const days = [];

        while (cursor <= end) { days.push(new Date(cursor)); cursor.setDate(cursor.getDate() + 1); }

        const dayNamesAr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

        let msg = (currentLang === 'ar' ? '📅 جدول الشغل:\n\n' : "📅 Work Schedule:\n\n");
        days.forEach(d => {
            const dateStr = isoDate(d);
            let pairs = [];
            activeJobs.forEach(job => { getScheduleEntries(job).forEach(entry => { if (entry.date === dateStr) pairs.push({ job, entry }); }); });
            pairs = sortDayEntries(pairs);
            if (pairs.length === 0) return;
            msg += `━━━━━━━━━━━━\n*${dayNames[d.getDay()]} — ${dateStr}*\n\n`;
            pairs.forEach(({ job, entry }, i) => {

        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');

    // Expands/collapses a single job row's technician or expense breakdown — the row stays a
    // one-line summary until someone actually wants the detail, instead of always showing the
    // full bullet list for every job in the table.
    function toggleRowDetail(el) {
        const full = el.nextElementSibling;
        if (!full) return;
        // getComputedStyle, not el.style — the hidden state comes from the .detail-full CSS
        // class (display:none), not an inline style, so checking .style.display directly
        // would always read '' and never detect it as hidden.
        const showing = getComputedStyle(full).display !== 'none';
        full.style.display = showing ? 'none' : 'block';
